<style>

<script>
const LETTERS = "ABCDEFGH";
const AUDIO_SET = {};   // test id -> Set of clip keys with Gemini audio
let TOPICS = [];
const cache = {};
let cur = null;      // current test object
let state = null;    // answers/state for current test
let timerInt = null;

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("ketbank:"+k); return v==null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("ketbank:"+k, JSON.stringify(v)); }catch(e){} }
};
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function wcount(s){ return (s.match(/[A-Za-z0-9'’-]+/g)||[]).length; }
function norm(s){ return String(s||"").toLowerCase().replace(/[£$€]/g,"").replace(/[.,!?;]+$/,"").replace(/\s+/g," ").trim(); }

/* ---------- speech ---------- */
const TTS = {
  voices: [], rate: store.get("rate", 0.9), queue: [], playing: false, onend: null,
  init(){
    if(!("speechSynthesis" in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  pick(sp){
    const v = this.voices; if(!v.length) return null;
    const fem = /female|samantha|victoria|karen|moira|tessa|fiona|serena|susan|hazel|libby|sonia|mia|zira|aria|jenny|emma|amy|kate|martha|ava|allison|google uk english female|natasha|clara/i;
    const mal = /\bmale\b|daniel|alex|fred|tom\b|oliver|george|ryan|guy|david|mark|james|arthur|google uk english male|thomas|aaron|rishi|lee/i;
    const gb = v.filter(x=>/en[-_]GB/i.test(x.lang));
    const pool = gb.length? gb : v;
    const F = pool.filter(x=>fem.test(x.name) && !/\bmale\b/i.test(x.name)).concat(v.filter(x=>fem.test(x.name)&& !/\bmale\b/i.test(x.name)));
    const M = pool.filter(x=>mal.test(x.name) && !/female/i.test(x.name)).concat(v.filter(x=>mal.test(x.name)&&!/female/i.test(x.name)));
    if(sp==="F") return F[0]||pool[0];
    if(sp==="F2") return F[1]||F[0]||pool[1]||pool[0];
    if(sp==="M") return M[0]||pool[0];
    if(sp==="M2") return M[1]||M[0]||pool[1]||pool[0];
    return pool[0];
  },
  pitch(sp, voice){
    const isF = /F/.test(sp), name = voice? voice.name : "";
    const vf = /female|samantha|victoria|karen|moira|tessa|fiona|serena|susan|hazel|libby|sonia|zira|aria|jenny|emma|amy|kate|martha|ava|allison|natasha|clara/i.test(name);
    let p = 1;
    if(isF && !vf) p = 1.35; if(!isF && sp!=="N" && vf) p = 0.7;
    if(sp==="M2") p *= 0.92; if(sp==="F2") p *= 1.08;
    return p;
  },
  split(text){ return (text.match(/[^.!?]+[.!?]+["”’']?|[^.!?]+$/g)||[text]).map(s=>s.trim()).filter(Boolean); },
  /* Pre-generated Gemini audio (ket-audio/audio/<test>/<clip>.mp3 ở gốc repo) is used when available; browser voice otherwise */
  audio: null, total: 0,
  hasClip(clip){ return !!(clip && cur && AUDIO_SET[cur.id] && AUDIO_SET[cur.id].has(clip)); },
  progress(){ if(this.audio){ const d=this.audio.duration; return d? this.audio.currentTime/d : 0; } return this.total ? 1 - this.queue.length/this.total : 0; },
  play(turns, onend, clip){
    this.stop();
    if(this.hasClip(clip)){
      const a = new Audio(`../../ket-audio/audio/${cur.id}/${clip}.mp3`); this.audio = a; this.playing = true; this.onend = onend;
      a.playbackRate = Math.max(0.7, Math.min(1.1, (this.forceRate||this.rate)/0.9));
      const fin = () => { if(this.audio!==a) return; this.audio=null; this.playing=false; const f=this.onend; this.onend=null; f && f(); };
      a.onended = fin; a.onerror = () => { if(this.audio!==a) return; this.audio=null; this.playing=false; this._fallback(turns, onend); };
      a.play().catch(()=>{ if(this.audio===a){ this.audio=null; this.playing=false; this._fallback(turns, onend); } });
      return true;
    }
    return this._fallback(turns, onend);
  },
  _fallback(turns, onend){
    if(!("speechSynthesis" in window)){ toast("Trình duyệt không hỗ trợ đọc âm thanh. Hãy dùng Chrome hoặc Edge."); return false; }
    const q = [];
    turns.forEach(t => { this.split(t.t).forEach((s,i)=>q.push({s:t.s, t:s, gap: i===0})); });
    this.queue = q; this.total = q.length; this.playing = true; this.onend = onend;
    this._next(); return true;
  },
  _next(){
    if(!this.playing) return;
    const it = this.queue.shift();
    if(!it){ this.playing=false; const f=this.onend; this.onend=null; f && f(); return; }
    const u = new SpeechSynthesisUtterance(it.t);
    const v = this.pick(it.s); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB";
    u.rate = this.forceRate || this.rate; u.pitch = this.pitch(it.s, v);
    u.onend = () => setTimeout(()=>this._next(), it.gap? 350:120);
    u.onerror = () => setTimeout(()=>this._next(), 50);
    speechSynthesis.speak(u);
  },
  stop(){ if(this.audio){ const a=this.audio; this.audio=null; try{a.pause();}catch(e){} } this.playing=false; this.queue=[]; const f=this.onend; this.onend=null; try{speechSynthesis.cancel();}catch(e){} f && f(true); }
};

  h += `</div>`; }
  if(inc(2)){
  const P2 = R.part2;
  h += `<div class="part done"><h2>Part 2 <span class="qs">Questions 7–13</span></h2><p class="rubric">${esc(P2.question||"For each question, choose the correct answer.")}<br><b>${esc(P2.intro)}</b></p>
    <div class="texts3">${P2.texts.map(t=>`<div class="tx"><h4><b>${t.label}</b>${esc(t.title)}</h4><p>${esc(t.text)}</p></div>`).join("")}</div>`;
  P2.items.forEach((it,i)=>{ const n=7+i, k="p2_"+i, sel=a[k]; const st = sel===it.answer?"ok":"bad";
    h += `<div class="m2 q ${st}" style="grid-template-columns:36px 1fr auto"><div class="qn">${n}</div><div>${esc(it.q)}</div><div class="abc">${["A","B","C"].map(L=>{let c=""; if(sel===L)c="sel"; if(L===it.answer)c="right"; else if(sel===L)c="wrong"; return `<button class="${c}">${L}</button>`}).join("")}</div></div><div style="margin-left:46px">${explHTML("rw",n)}</div>`; });
  h += `</div>`; }
  if(inc(3)){
  h += `<div class="part done"><h2>Part 3 <span class="qs">Questions 14–18</span></h2><p class="rubric">For each question, choose the correct answer.</p>
    <div class="article serif"><h3>${esc(R.part3.title)}</h3>${para(R.part3.text)}</div>`;
  R.part3.items.forEach((it,i)=> h += mcqHTML("rw","p3_"+i,14+i,it.q,it.options,it.answer,d,a["p3_"+i]));
  h += `</div>`; }
  if(inc(4)){
  h += `<div class="part done"><h2>Part 4 <span class="qs">Questions 19–24</span></h2><p class="rubric">For each question, choose the correct answer.</p>
    <div class="article serif"><h3>${esc(R.part4.title)}</h3>${gapsDisplay(R.part4.text)}</div><div class="cloze4">`;
  R.part4.items.forEach((it,i)=> h += mcqHTML("rw","p4_"+i,19+i,"",it.options,it.answer,d,a["p4_"+i]));
  h += `</div></div>`; }
  if(inc(5)){
  h += `<div class="part done"><h2>Part 5 <span class="qs">Questions 25–30</span></h2><p class="rubric">For each question, write the correct answer. Write <b>one</b> word for each gap.</p>`;
  R.part5.texts.forEach(t=>{
    const body = para(t.text).replace(/\{(\d+)\}/g, (_,n)=>{ const i=+n-25, v=a["p5_"+i]||"", acc=R.part5.answers[i]; const ok = acc.includes(norm(v));
      return `<b class="gap">(${n})</b> <input class="gapin ${ok?"right":"wrong"}" value="${esc(v)}" disabled>${ok?"":`<span class="fix">→ ${esc(acc.join(" / "))}</span>`}`; });
    h += `<div class="article serif">${t.header?`<div style="font-family:Lexend;font-size:13px;color:var(--muted);margin-bottom:6px">${esc(t.header)}</div>`:""}${body}</div>`; });
  h += explList("rw",25,30) + `</div>`; }
  if(inc(6)){
  h += `<div class="part done"><h2>Part 6 <span class="qs">Question 31</span></h2>
    <p class="serif" style="margin:0 0 6px">${esc(W.part6.situation)}</p><p style="margin:0">In your email:</p>
    <ul class="points serif">${W.part6.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    <div class="mywrite"><b>Bài của em (${wcount(state.w6)} từ)</b><div>${esc(state.w6)||"<i>(trống)</i>"}</div></div>
    <div class="model"><b>Bài mẫu tham khảo</b>${esc(W.part6.model)}</div></div>`; }
  if(inc(7)){
  h += `<div class="part done"><h2>Part 7 <span class="qs">Question 32</span></h2><p class="rubric">${esc(W.part7.instruction)}</p>
    <div class="pics">${W.part7.pictures.map((p,i)=>`<div class="pic"><span class="n">${i+1}</span><div class="e">${esc(p.emoji)}</div><div class="c">${esc(p.caption)}</div></div>`).join("")}</div>
    <div class="mywrite"><b>Bài của em (${wcount(state.w7)} từ)</b><div>${esc(state.w7)||"<i>(trống)</i>"}</div></div>
    <div class="model"><b>Bài mẫu tham khảo</b>${esc(W.part7.model)}</div></div>`; }

}

/* --- Listening review --- */
function playerHTML(key, label){
  return `<div class="play" id="pl-${key}"><button data-play="${key}">▶ ${label||"Nghe lại"}</button><button class="stop" data-stop="1">■ Dừng</button>
    <span class="cnt" style="margin-left:auto">Tốc độ <select data-rate="1">${[0.75,0.85,0.9,1].map(r=>`<option value="${r}" ${TTS.rate==r?"selected":""}>${r}×</option>`).join("")}</select></span></div>`;
}
function scriptHTML(key, turns){
  return `<button class="tlink" data-tr="${key}">Xem lời thoại (transcript)</button><div class="script" id="tr-${key}">${turns.map(t=>`<p><b>${esc(t.s)}</b>${esc(t.t)}</p>`).join("")}</div>`;
}

  const L = cur.listening, d = true, a = state.l, inc = pt => state.parts.includes(pt);

  h += `<div class="part done"><h2>Part 1 <span class="qs">Questions 1–5</span></h2><p class="rubric">For each question, choose the correct answer.</p>`;
  L.part1.items.forEach((it,i)=>{ const k="p1_"+i, sel=a[k]; const st=sel===it.answer?"ok":"bad";
    h += `<div class="q ${st}"><div class="qn">${i+1}</div><div><div style="margin-bottom:6px;font-weight:600">${esc(it.q)}</div>${playerHTML("l1_"+i)}
      <div class="picopts">${it.options.map((o,j)=>{ let c="picopt"; if(sel===j)c+=" sel"; if(j===it.answer)c+=" right"; else if(sel===j)c+=" wrong";
        return `<div class="${c}"><span class="L">${LETTERS[j]}</span><div class="e">${esc(o.emoji)}</div><div class="lab">${esc(o.label)}</div></div>`}).join("")}</div>
      ${explHTML("l",i+1)}${scriptHTML("l1_"+i, it.script)}</div></div>`; });
  h += `</div>`; }
  if(inc(2)){
  const P2=L.part2;
  h += `<div class="part done"><h2>Part 2 <span class="qs">Questions 6–10</span></h2><p class="rubric"><b>${esc(P2.intro)}</b></p>${playerHTML("l2")}
    <div class="notes"><h3>${esc(P2.title)}</h3>${P2.items.map((it,i)=>{ const v=a["p2_"+i]||""; const ok = it.answer.includes(norm(v));
      return `<div class="row"><div class="qn" style="background:${ok?"var(--ok)":"var(--bad)"};color:#fff">${6+i}</div><span>${esc(it.label)}</span>
      <input class="gapin ${ok?"right":"wrong"}" value="${esc(v)}" disabled>${ok?"":`<span class="fix">→ ${esc(it.answer[0])}</span>`}</div>`}).join("")}</div>
    ${explList("l",6,10)}${scriptHTML("l2", P2.script)}</div>`; }
  if(inc(3)){
  h += `<div class="part done"><h2>Part 3 <span class="qs">Questions 11–15</span></h2><p class="rubric"><b>${esc(L.part3.intro)}</b></p>${playerHTML("l3")}`;
  L.part3.items.forEach((it,i)=> h += mcqHTML("l","p3_"+i,11+i,it.q,it.options,it.answer,d,a["p3_"+i]));
  h += scriptHTML("l3", L.part3.script) + `</div>`; }
  if(inc(4)){
  h += `<div class="part done"><h2>Part 4 <span class="qs">Questions 16–20</span></h2>`;
  L.part4.items.forEach((it,i)=>{ h += `<div style="padding-top:8px;border-top:${i?"1px dashed var(--line)":"0"}"><p style="margin:6px 0 0"><b>${16+i}.</b> ${esc(it.intro)}</p>${playerHTML("l4_"+i)}${mcqHTML("l","p4_"+i,16+i,it.q,it.options,it.answer,d,a["p4_"+i])}${scriptHTML("l4_"+i,it.script)}</div>`; });
  h += `</div>`; }
  if(inc(5)){
  const P5=L.part5;
  h += `<div class="part done"><h2>Part 5 <span class="qs">Questions 21–25</span></h2><p class="rubric"><b>${esc(P5.intro)}</b></p>${playerHTML("l5")}
    <div class="match5"><div>${P5.people.map((p,i)=>{ const sel=a["p5_"+i]||""; const ok=sel===P5.answers[i];
      return `<div class="row" style="display:flex;gap:10px;align-items:center;padding:6px 0"><div class="qn" style="background:${ok?"var(--ok)":"var(--bad)"};color:#fff">${21+i}</div><span style="flex:1">${esc(p)}</span>
        <b class="${ok?"okt":"badt"}">${sel||"—"}</b>${ok?"":`<span class="fix">→ ${P5.answers[i]}</span>`}</div>`}).join("")}</div>
      <div class="optlist">${P5.options.map((o,j)=>`<div><b>${LETTERS[j]}</b> &nbsp;${esc(o)}</div>`).join("")}</div></div>
    ${explList("l",21,25)}${scriptHTML("l5", P5.script)}</div>`; }
  return h;
}
function scriptFor(key){
  const L=cur.listening; const [p,i]=key.split("_");
  if(p==="l1") return L.part1.items[+i].script;
  if(p==="l2") return L.part2.script;
  if(p==="l3") return L.part3.script;
  if(p==="l4") return L.part4.items[+i].script;
  if(p==="l5") return L.part5.script;
}
function scoreRW(){ return runScore(state)[0]; }
function scoreL(){ return runScore(state)[0]; }

  <div class="part spk"><h2>Part 1 <span class="qs">3–4 phút · Giám khảo hỏi từng bạn</span></h2>
    <div class="card"><b>Phase 1</b><ul>${s1.phase1.map(q=>`<li>${esc(q)}${say(q)}</li>`).join("")}</ul></div>
    ${s1.phase2.map(p=>`<div class="card"><b>Phase 2 – ${esc(p.topic)}</b><ul>${p.questions.map(q=>`<li>${esc(q)}${say(q)}</li>`).join("")}<li><i>${esc(p.extended)}</i>${say(p.extended)}</li></ul></div>`).join("")}

    <p class="serif">${esc(s2.task)} ${say(s2.task)}</p>
    <div class="picgrid5">${s2.pictures.map(p=>`<div><div class="e">${esc(p.emoji)}</div><div class="lab">${esc(p.label)}</div></div>`).join("")}</div>
    <div class="card"><b>Câu hỏi gợi ý của giám khảo</b><ul>${s2.prompts.map(q=>`<li>${esc(q)}${say(q)}</li>`).join("")}</ul></div>
    <div class="card"><b>Câu hỏi mở rộng</b><ul>${s2.followup.map(q=>`<li>${esc(q)}${say(q)}</li>`).join("")}</ul></div>
    ${s2.usefulLanguage? `<div class="card"><b>Mẫu câu hữu ích</b><div class="ul" style="margin-top:6px">${s2.usefulLanguage.map(u=>`<span>${esc(u)}</span>`).join("")}</div></div>`:""}

/* --- Vocabulary --- */
function renderV(){
  const e = (typeof EXP!=="undefined") ? EXP[cur.id] : null;
  if(!e || !e.vocab) return `<div class="part"><p>Đang tải từ vựng…</p></div>`;
  const topic = TOPICS.find(t=>t.id===cur.topic)||{};
  return `<div class="chooser-hero">${mascot("wow","bob")}<div class="bubble">Học trước ${e.vocab.length} từ này thì làm bài sẽ dễ hơn nhiều đó! Bấm 🔊 để nghe phát âm.</div></div>
    <div class="part"><h2>Từ vựng của đề <span class="qs">${e.vocab.length} từ · chủ điểm ${esc(topic.en)}</span></h2>
    <table class="vtable"><tr><th>Từ</th><th>Loại</th><th>Phiên âm</th><th>Nghĩa</th><th>Ví dụ</th></tr>
    ${e.vocab.map(w=>`<tr><td><b>${esc(w.w)}</b> <button class="say" data-say="${esc(w.w)}">🔊</button></td><td>${esc(w.pos||"")}</td><td style="color:var(--muted)">${esc(w.ipa||"")}</td><td style="color:var(--brand);font-weight:600">${esc(w.vi)}</td><td class="serif" style="font-size:15px">${esc(w.ex||"")}</td></tr>`).join("")}</table>
    <p class="rubric" style="margin-top:14px">Toàn bộ từ vựng của chủ điểm (danh sách Cambridge): ${esc(topic.words)}</p></div>`;
}

/* --- Results --- */
function resultText(){
  const topic = TOPICS.find(t=>t.id===cur.topic)||{};
  const name = store.get("name","") || "(chưa nhập tên)";
  const runs = allRuns().filter(runDone);
  const L = [`KET for Schools – ${topic.en} – Đề ${cur.testNo} (${cur.title})`, `Học sinh: ${name}`, `Ngày gửi: ${new Date().toLocaleString("vi-VN")}`, ""];
  if(!runs.length) L.push("(Chưa nộp phần nào)");
  runs.forEach(r => { const [s,mx] = runScore(r); const v = runViol(r).filter(x=>x.v);
    L.push(`• ${runLabel(r)} – ${r.mode==="practice"?"Luyện tập":"Test"}: ${mx?`${s}/${mx}`:"bài viết"}${r.at?` (nộp ${r.at})`:""}${r.mode==="test"?` – vi phạm: ${v.length}${v.length?" ["+v.map(x=>x.t+" "+x.type).join("; ")+"]":""}`:""}`); });
  const wr = runs.filter(r=>r.paper==="rw" && (r.parts.includes(6)||r.parts.includes(7)));
  wr.forEach(r => { if(r.parts.includes(6) && r.w6) L.push("", `Writing Part 6 – ${r.mode==="practice"?"Luyện tập":"Test"} (${wcount(r.w6)} words):`, r.w6);
                    if(r.parts.includes(7) && r.w7) L.push("", `Writing Part 7 – ${r.mode==="practice"?"Luyện tập":"Test"} (${wcount(r.w7)} words):`, r.w7); });
  return L.join("\n");
}
function renderRes(){
  const runs = allRuns().filter(runDone);
  return `<div class="part"><h2>🏆 Kết quả của đề này</h2>
    ${runs.length ? `<table class="vtable"><tr><th>Phần</th><th>Chế độ</th><th>Điểm</th><th>Nộp lúc</th><th>Vi phạm</th><th></th></tr>${runs.map(r=>{ const [s,mx]=runScore(r); const v=runViol(r).filter(x=>x.v).length;
      return `<tr><td>${esc(runLabel(r))}</td><td>${r.mode==="practice"?"📘 Luyện tập":"📝 Test"}</td><td><b>${mx?`${s}/${mx}`:"Bài viết"}</b></td><td>${esc(r.at||"")}</td><td>${r.mode==="test"?(v?`⚠️ ${v}`:"0"):"—"}</td><td><button class="lnk" data-act="review" data-key="${r.key}">Xem lại</button></td></tr>`}).join("")}</table>`
      : `<div class="chooser-hero">${mascot("think")}<div class="bubble">Em chưa nộp phần nào của đề này. Vào tab Reading & Writing hoặc Listening để bắt đầu nhé!</div></div>`}
    <p class="rubric" style="margin-top:14px">Bấm <b>Sao chép kết quả</b> rồi dán gửi cho cô qua Zalo/Messenger (gồm điểm, vi phạm và bài viết).</p>
    <textarea class="copybox" readonly id="restext">${esc(resultText())}</textarea>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><button class="primary" data-act="copy">📋 Sao chép kết quả</button></div>
  </div>`;
}

/* --- events --- */
function bindPane(){
  const p = $("#pane");
  p.onclick = e => {
    const pl = e.target.closest("[data-play]");
    if(pl){ const key=pl.dataset.play; const box=$("#pl-"+key);
      document.querySelectorAll(".play.playing").forEach(x=>x.classList.remove("playing"));
      if(TTS.play(scriptFor(key), ()=>box.classList.remove("playing"), key)) box.classList.add("playing");
      return; }
    if(e.target.closest("[data-stop]")){ TTS.stop(); return; }
    const sy = e.target.closest("[data-say]"); if(sy){ TTS.play([{s:"F",t:sy.dataset.say}]); return; }
    const tr = e.target.closest("[data-tr]"); if(tr){ $("#tr-"+tr.dataset.tr).classList.toggle("show"); return; }
    const act = e.target.closest("[data-act]"); if(!act) return;
    const A = act.dataset.act;
    if(A==="run"){ const {paper, part, mode} = act.dataset; let r = getRun(paper, +part, mode);
      if(!r || runDone(r)) r = newRun(paper, +part, mode);
      state = r; save(); startExam(paper); return; }
    if(A==="review"){ const k = act.dataset.key; page.tab = k.split("-")[0]; page.view = k; savePage(); showTab(); window.scrollTo(0,0); return; }
    if(A==="mode"){ page.mode = act.dataset.mode; savePage(); showTab(); return; }
    if(A==="back"){ page.view = null; savePage(); showTab(); window.scrollTo(0,0); return; }
    if(A==="copy"){ const txt=$("#restext"); txt.value=resultText();
      const fallback = () => { txt.focus(); txt.select(); try{ document.execCommand("copy"); toast("Đã sao chép!"); }catch(e){ toast("Hãy bôi đen ô kết quả và sao chép thủ công."); } };
      if(navigator.clipboard) navigator.clipboard.writeText(txt.value).then(()=>toast("Đã sao chép! Dán gửi cho cô nhé."), fallback); else fallback(); }
  };
  p.onchange = e => { const t=e.target;
    if(t.dataset.rate){ TTS.rate=+t.value; store.set("rate",TTS.rate); p.querySelectorAll("[data-rate]").forEach(s=>s.value=t.value); } };
}

boot();
