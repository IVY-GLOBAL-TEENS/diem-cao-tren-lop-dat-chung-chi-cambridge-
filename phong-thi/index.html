  if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.09)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.12)}
  g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.32)}catch(e){}}
const hasTTS='speechSynthesis' in window;
function voices(){if(!hasTTS)return[];return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
if(hasTTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
let speakToken=0;
function voicePool(){const vs=voices();const gb=vs.filter(v=>/GB|AU|IE/i.test(v.lang));const us=vs.filter(v=>/US|CA/i.test(v.lang));return[gb[0]||vs[0],us[0]||gb[1]||vs[1]||vs[0],gb[1]||us[1]||vs[2]||vs[0]]}
function speakLines(lines,onEnd,vmap){
  const tok=++speakToken;let done=false;const fin=()=>{if(done||tok!==speakToken)return;done=true;onEnd&&onEnd()};
  if(!hasTTS){setTimeout(fin,50);return tok}
  speechSynthesis.cancel();const pool=voicePool();const who={};let n=0,w=0;
  lines.forEach(([sp,tx],i)=>{if(!(sp in who))who[sp]=vmap&&sp in vmap?vmap[sp]:n++;const k=who[sp]%3;const u=new SpeechSynthesisUtterance(tx);w+=tx.split(/\s+/).length;
    if(pool[k])u.voice=pool[k];u.lang=(pool[k]&&pool[k].lang)||'en-GB';u.rate=.92;u.pitch=[1.05,0.88,1.2][k];
    if(i===lines.length-1)u.onend=fin;speechSynthesis.speak(u)});
  setTimeout(fin,(w*0.5+lines.length*0.7+3)*1000);return tok}
function speakSentence(text,rate,onWord,onEnd){const tok=++speakToken;let done=false;const fin=()=>{if(done||tok!==speakToken)return;done=true;onEnd&&onEnd()};
  if(!hasTTS){setTimeout(fin,50);return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voicePool()[0];if(v)u.voice=v;u.lang=(v&&v.lang)||'en-GB';u.rate=rate;
  u.onboundary=e=>{if(tok===speakToken&&e.name!=='sentence')onWord&&onWord(e.charIndex)};u.onend=fin;speechSynthesis.speak(u);
  setTimeout(fin,(text.split(/\s+/).length*0.55/rate+3)*1000)}
function speakWord(w){if(!hasTTS){toast('Trình duyệt chưa hỗ trợ đọc tự động. Hãy dùng Chrome hoặc Edge.');return}stopSpeak();const u=new SpeechSynthesisUtterance(w);const v=voicePool()[0];if(v)u.voice=v;u.lang=(v&&v.lang)||'en-GB';u.rate=.82;speechSynthesis.speak(u)}
function stopSpeak(){speakToken++;if(hasTTS)speechSynthesis.cancel()}

  <div class="dock">
   <div class="panel mascot">${MASCOT}<div class="bubble">${TIPS[Math.floor(Math.random()*TIPS.length)]}</div></div>

   <div class="panel dockcard"><h3>Sắp đi thi?</h3><p class="muted" style="margin:0 0 10px;font-size:.92rem"><b>Luyện đề</b> theo kỹ năng KET, PET, Pre-IELTS. <b>Thi thật</b> mô phỏng bài thi trên máy, đủ các Part.</p>
    <div class="row"><button class="b3 teal sm" data-act="go" data-arg="drill">Luyện đề</button><button class="b3 navy sm" data-act="go" data-arg="mock">Thi thật</button></div></div>
  </div>`};

/* level map */
const CHESTS=[[.3,30],[.6,60],[1,120]];
const CHEST_SVG=(open,c)=>`<svg viewBox="0 0 52 46" aria-hidden="true"><rect x="4" y="18" width="44" height="24" rx="3" fill="${c}" stroke="#fff" stroke-width="3"/>${open?`<path d="M4 18l6-14h32l6 14z" fill="#f4c13d" stroke="#fff" stroke-width="3"/><circle cx="18" cy="10" r="3" fill="#fff"/><circle cx="30" cy="7" r="2" fill="#fff"/>`:`<path d="M4 18q22-16 44 0z" fill="${c}" stroke="#fff" stroke-width="3"/>`}<rect x="22" y="22" width="8" height="10" rx="2" fill="#f4c13d" stroke="#fff" stroke-width="2"/></svg>`;
function findAct(id){for(const lv of LEVELS)for(const u of lv.units){const a=u.acts.find(x=>x.id===id);if(a)return{lv,u,a}}return null}
const uStars=u=>u.acts.reduce((a,x)=>a+((S.act[x.id]||{}).stars||0),0);
VIEWS.level=()=>{const lv=LEVELS.find(x=>x.id===V.lv);const acts=lvActs(lv);const st=lvStars(lv),max=acts.length*3;
  return`<div class="roomhead"><button class="b3 ghost sm" data-act="go" data-arg="home">${ICON.back}Các cấp độ</button><div><h2>${lv.name} <span class="tag" style="background:var(--navy)">${lv.tag}</span></h2><div class="muted" style="font-size:.88rem">${lv.sub}</div></div></div>
   <div class="panel lvhead"><div><div class="row" style="gap:6px;font-family:var(--display);font-weight:800;font-size:1.3rem">${ICON.star('#f4c13d').replace('<svg','<svg width="28" height="28"')} ${st} / ${max} sao</div>
     <div class="lvbar"><i style="width:${st/max*100}%"></i></div><span class="hint">${lv.units.length} Unit · ${acts.length} trạm. Mỗi trạm tối đa 3 sao, gom sao để mở rương xu.</span></div>
    <div class="chests">${CHESTS.map(([f,coins],i)=>{const need=Math.ceil(max*f);const key=lv.id+i;const opened=S.chest[key];const ready=!opened&&st>=need;
      return`<button class="chest ${ready?'ready':''}" data-act="chest" data-arg="${lv.id}|${i}" ${ready?'':'disabled'} aria-label="Rương ${i+1}: cần ${need} sao, thưởng ${coins} xu">${CHEST_SVG(opened,['var(--orange)','var(--navy)','var(--red)'][i])}<span>${opened?'Đã mở':need+' sao'}</span><span style="color:var(--gold-d)">+${coins} xu</span></button>`}).join('')}</div></div>
   <div class="ugrid">${lv.units.map((u,i)=>{const s=uStars(u),m=u.acts.length*3;const done=s>=m;return`<button class="ucard" style="--tilt:${[-1,.8,-.4,1.1,-.7][i%5]}deg" data-act="unit" data-arg="${lv.id}|${u.n}">
     <span class="unum" style="background:${lv.c}">${u.n}</span><span class="ubody"><small>${LV_BOOK[lv.id]} · Unit ${u.n}</small><b>${esc(u.title)}</b><span class="utopic">${esc(u.topic)}</span>
     <span class="lvstat" style="margin-top:6px">${ICON.star('#f4c13d').replace('<svg','<svg width="18" height="18"')}<span>${s}/${m}</span><span class="pbar"><i style="width:${s/m*100}%"></i></span></span></span>${done?'<span class="ubadge">HOÀN THÀNH</span>':''}</button>`}).join('')}</div>`};
VIEWS.unit=()=>{const lv=LEVELS.find(x=>x.id===V.lv);const u=lv.units.find(x=>x.n===V.u);const s=uStars(u),m=u.acts.length*3;
  const nextIdx=u.acts.findIndex(a=>!(S.act[a.id]||{}).stars);const xs=[0,14,26,32,26,14];const ui=lv.units.indexOf(u);
  return`<div class="roomhead"><button class="b3 ghost sm" data-act="level" data-arg="${lv.id}">${ICON.back}${lv.name}</button><div><h2>Unit ${u.n} · ${esc(u.title)}</h2><div class="muted" style="font-size:.88rem">${LV_BOOK[lv.id]} · ${esc(u.topic)}</div></div>
    <span class="tag" style="background:var(--gold);color:var(--ink);margin-left:auto">${s}/${m} sao</span></div>
   <div class="map">${u.acts.map((a,i)=>{const t=TYPE[a.type];const st=(S.act[a.id]||{}).stars||0;const x=xs[i%xs.length];
     return`${i?`<div class="link" style="--x:${x}%"></div>`:''}<div class="node" style="--x:${x}%"><button class="stkr ${st?'done':''} ${i===nextIdx?'next':''}" style="--c:${t[2]}" data-act="open" data-arg="${a.id}" aria-label="${esc(a.title)}">${ICON[t[1]]}${i===nextIdx?'<span class="go-flag">TIẾP THEO</span>':''}</button>
      <div class="nlabel" style="--c:${t[2]}"><small>${t[0]}</small><b>${esc(a.title)}</b><div class="nstars">${starRow(st)}</div></div></div>`}).join('')}</div>
   <div class="row" style="justify-content:center;margin-top:6px">${ui>0?`<button class="b3 ghost sm" data-act="unit" data-arg="${lv.id}|${lv.units[ui-1].n}">‹ Unit ${lv.units[ui-1].n}</button>`:''}${ui<lv.units.length-1?`<button class="b3 gold sm" data-act="unit" data-arg="${lv.id}|${lv.units[ui+1].n}">Unit ${lv.units[ui+1].n} ›</button>`:''}</div>`};

/* question pools built from a unit's own content */
function unitPool(uid){const qs=[];const g=GRAMMAR.find(x=>x.id===uid+'-g');const v=VOCAB.find(x=>x.id===uid+'-w');
  if(g)g.items.forEach(it=>qs.push({cat:'Ngữ pháp',q:it[0],opts:it[1],a:it[2],ex:it[3]}));
  if(v)v.words.forEach(w=>{const others=shuffle(v.words.filter(x=>x!==w)).slice(0,3);const opts=shuffle([w,...others]);qs.push({cat:'Từ vựng',q:`"${w[0]}" nghĩa là gì?`,opts:opts.map(o=>o[2]),a:opts.indexOf(w),ex:w[3]})});
  if(v)shuffle(v.words).slice(0,4).forEach(w=>{const others=shuffle(v.words.filter(x=>x!==w)).slice(0,3);const opts=shuffle([w,...others]);qs.push({cat:'Từ vựng',q:`Từ nào nghĩa là "${w[2]}"?`,opts:opts.map(o=>o[0]),a:opts.indexOf(w),ex:w[3]})});
  return qs}
function errorItems(uid){const g=GRAMMAR.find(x=>x.id===uid+'-g');if(!g)return[];
  return g.items.map(it=>{const wrong=it[1].map((o,j)=>j).filter(j=>j!==it[2]);const wj=wrong[Math.floor(Math.random()*wrong.length)];const [pre,post]=it[0].split('___');
    const toks=[...pre.trim().split(/\s+/).filter(Boolean).map(t=>({t})),{t:it[1][wj],bad:true},...(post||'').trim().split(/\s+/).filter(Boolean).map(t=>({t}))];
    return{toks,fix:it[1][it[2]],ex:it[3]}})}
function openAct(id){const f=findAct(id);if(!f)return;const{lv,u,a}=f;const base={lv:lv.id,u:u.n,actId:id};const uid=a.uid;
  const mk=(o)=>go('act',Object.assign(o,base));
  if(a.type==='vocab')return openSet(a.set,base);
  if(a.type==='grammar'){const g=GRAMMAR.find(x=>x.id===a.g);return go('gtopic',Object.assign({g:a.g,q:shuffle(g.items),qi:0,qsel:null,qscore:0},base))}
  if(a.type==='ipa'){const d=IPAS[a.ipa];return mk({kind:'mc',items:shuffle(d.words).map(([w,ip,k])=>({audio:w,prompt:`<span class="bigline">${w}</span>`,opts:d.opts,a:k,explain:`<b>${w}</b> /${ip}/`})),rule:d.rule,ipa:true,i:0,sel:null,score:0})}
  if(a.type==='lw'){const pool=a.sets.flatMap(s=>VOCAB.find(v=>v.id===s).words);const pick=shuffle(pool).slice(0,8);
    return mk({kind:'mc',items:pick.map(w=>{const others=shuffle(pool.filter(x=>x!==w)).slice(0,3);const opts=shuffle([w,...others]);return{audio:w[0],prompt:'<span class="muted" style="font-weight:700">Nghe và chạm vào từ bạn nghe được</span>',opts:opts.map(o=>o[0]),a:opts.indexOf(w),explain:`<b>${esc(w[0])}</b> (${w[1]}) · ${esc(w[2])} — <i>${esc(w[3])}</i>`}}),rule:'Bấm loa để nghe. Có thể nghe lại, nhưng nghe ít lần mà đúng mới là giỏi!',i:0,sel:null,score:0})}
  if(a.type==='tfng')return mk({kind:'mc',passage:a.tf.p,ptitle:a.tf.title,items:a.tf.items.map(([q,k])=>({prompt:`<span class="bigline" style="font-size:1.2rem">${esc(q)}</span>`,opts:['TRUE','FALSE','NOT GIVEN'],a:k,explain:['Thông tin khớp với bài đọc.','Thông tin trái với bài đọc.','Bài đọc không nhắc tới thông tin này.'][k]})),rule:'<b>IELTS Reading · True / False / Not Given.</b> TRUE: khớp với bài · FALSE: trái với bài · NOT GIVEN: bài không nói tới. Đừng dùng hiểu biết riêng của bạn!',i:0,sel:null,score:0});
  if(a.type==='shadow')return mk({kind:'shadow',items:SHADOW[a.sh],i:0,reps:{},stars:{}});
  if(a.type==='dict')return mk({kind:'dict',items:DICT[a.dict],i:0,plays:{},res:{},val:''});
  if(a.type==='letter')return mk({kind:'letter',L:a.letter});
  if(a.type==='talk'){const T=TALKS[a.talk];return mk({kind:'talk',T:a.talk,ti:0,phase:T.debate?'side':'idle',left:0,side:null,stars:{}})}
  if(a.type==='dub')return mk({kind:'dub',D:a.dub,mode:null,idx:-1,dubbed:false,stars:{}});
  const words=a.set?VOCAB.find(v=>v.id===a.set).words:[];
  if(a.type==='memory'){const pairs=(a.pairs||shuffle(words).slice(0,6).map(w=>[w[0],w[2]])).slice(0,6);const cards=shuffle(pairs.flatMap((p,k)=>[{k,t:p[0],en:1},{k,t:p[1]}]));return mk({kind:'memory',cards,open:[],got:{},moves:0,pairs:pairs.length})}
  if(a.type==='hangman'){const ws=shuffle(words.filter(w=>/^[a-z]+$/i.test(w[0]))).slice(0,5);return mk({kind:'hangman',items:ws,i:0,guess:[],lives:6,won:0,state:'play'})}
  if(a.type==='sort')return mk({kind:'sort',S:a.sort,items:shuffle(a.sort.items),sel:null,placed:{},wrong:0});
  if(a.type==='scramble'){const ss=(DICT[uid]||[]).slice(0,3);return mk({kind:'scramble',items:ss.map(s=>({s,tiles:shuffle(s.split(' ').map((t,i)=>({t,i})))})),i:0,pick:[],tries:0,score:0,res:null})}
  if(a.type==='gapbank'){const v=VOCAB.find(x=>x.id===uid+'-w');const ss=DICT[uid]||[];const blanks=[];
    const text=ss.map(s=>{const hit=v.words.find(w=>s.toLowerCase().includes(w[0].toLowerCase())&&!blanks.includes(w[0]));if(hit){const re=new RegExp(hit[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');const real=s.match(re)[0];blanks.push(real);return s.replace(re,'{{'+(blanks.length-1)+'}}')}
      const toksS=s.split(' ');let k=toksS.findIndex((t,i)=>i>0&&t.replace(/[^a-z]/gi,'').length>4);if(k<0)k=1;const w=toksS[k].replace(/[^a-z']/gi,'');blanks.push(w);toksS[k]=toksS[k].replace(w,'{{'+(blanks.length-1)+'}}');return toksS.join(' ')});
    const extra=shuffle(v.words.map(w=>w[0]).filter(w=>!blanks.map(b=>b.toLowerCase()).includes(w.toLowerCase()))).slice(0,2);
    return mk({kind:'gapbank',text,blanks,bank:shuffle([...blanks,...extra]),fill:{},cur:0,checked:false})}
  if(a.type==='wheel')return mk({kind:'wheel',qs:a.qs,phrases:a.phrases||[],used:[],cur:null,rot:0,phase:'spin',left:0,stars:{}});
  if(a.type==='jam')return mk({kind:'wheel',qs:a.topics,phrases:['Well, let me think…','Another thing is…','For example,…'],used:[],cur:null,rot:0,phase:'spin',left:0,stars:{},jam:true});
  if(a.type==='mystery'){const pool=shuffle(unitPool(uid)).slice(0,7);const boxes=shuffle([...pool.map(q=>({q})),{bonus:15},{bonus:25}]);return mk({kind:'mystery',boxes,openB:{},cur:null,sel:null,right:0,total:pool.length})}
  if(a.type==='millionaire'){const pool=shuffle(unitPool(uid));const g=pool.filter(q=>q.cat==='Ngữ pháp'),v=pool.filter(q=>q.cat!=='Ngữ pháp');const qs=[...v.slice(0,3),...g.slice(0,3),...v.slice(3,5),...g.slice(3,4)].slice(0,8);return mk({kind:'millionaire',qs,spare:pool.filter(q=>!qs.includes(q)),i:0,sel:null,hidden:[],used5050:false,usedSwap:false,state:'play'})}
  if(a.type==='errorhunt')return mk({kind:'errorhunt',items:shuffle(errorItems(uid)),i:0,sel:null,score:0});
  if(a.type==='taboo'){const v=VOCAB.find(x=>x.id===a.set||x.id===uid+'-w');const cards=shuffle(v.words).slice(0,5).map(w=>({w:w[0],vi:w[2],ban:[...new Set(toks(w[3]).filter(t=>t.length>3&&!w[0].toLowerCase().includes(t)&&!['this','that','with','very','have','from','your','they','their','there','when','what','into','about','after'].includes(t)))].slice(0,3)}));return mk({kind:'taboo',cards,i:0,phase:'ready',left:0,ok:0})}
  if(a.type==='escape'){const pool=shuffle(unitPool(uid));const er=shuffle(errorItems(uid))[0];const sc=(DICT[uid]||[])[0];
    const locks=[{type:'mc',...pool.find(q=>q.cat==='Từ vựng')},{type:'scramble',s:sc,tiles:shuffle(sc.split(' ').map((t,i)=>({t,i})))},{type:'mc',...pool.find(q=>q.cat==='Ngữ pháp')},{type:'error',...er}];
    return mk({kind:'escape',locks,i:0,tries:0,digits:shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4),pick:[],sel:null,msg:''})}
  if(a.type==='jeopardy'){const pool=shuffle(unitPool(uid));const g=pool.filter(q=>q.cat==='Ngữ pháp'),vv=pool.filter(q=>q.cat==='Từ vựng');
    const er3=shuffle(errorItems(uid)).slice(0,3).map(e=>{const right=e.toks.map(t=>t.bad?e.fix:t.t).join(' ');const wrongS=e.toks.map(t=>t.t).join(' ');const opts=shuffle([right,wrongS]);return{q:'Câu nào ĐÚNG ngữ pháp?',opts,a:opts.indexOf(right),ex:e.ex}});
    const cols=[['Từ vựng',vv.slice(0,3)],['Ngữ pháp',g.slice(0,3)],['Câu đúng?',er3]];const jmax=cols.reduce((s,c)=>s+c[1].reduce((t,_,r)=>t+(r+1)*200,0),0);
    return mk({kind:'jeopardy',cols,jd:{},cur:null,sel:null,pts:0,jmax})}
  if(a.type==='speed'){const pool=shuffle(unitPool(uid).concat(unitPool(uid)));return mk({kind:'speed',pool,i:0,right:0,wrong:0,left:60,phase:'ready',flash:null})}
  if(a.type==='gap')return mk({kind:'gap',items:a.items,i:0,res:{},val:''});
}
function nextActId(id){const f=findAct(id);const all=lvActs(f.lv);const i=all.indexOf(f.a);return all[i+1]?all[i+1].id:null}
function actHead(sub){const f=findAct(V.actId);const t=TYPE[f.a.type];
  return`<div class="roomhead"><button class="b3 ghost sm" data-act="unit" data-arg="${f.lv.id}|${f.u.n}">${ICON.back}Unit ${f.u.n}</button><div><h2>${esc(f.a.title)}</h2><div class="muted" style="font-size:.88rem">${t[0]} · ${f.lv.name} · Unit ${f.u.n} ${esc(f.u.title)}${sub?' · '+sub:''}</div></div></div>`}
function actResult(pct,extra=''){const r=V.rec||{st:starsOf(pct),gain:0};const nx=nextActId(V.actId);
  return`<div class="panel bigres" style="max-width:620px;margin:0 auto"><div class="stars">${starRow(r.st)}</div>
   <div style="font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--red);line-height:1;margin-top:6px">${pct}%</div>
   <p style="margin:6px 0 2px;font-weight:800">${r.st===3?'Xuất sắc! Trạm này đã đạt tối đa.':r.st===2?'Rất tốt! Thử lại để lấy sao thứ 3 nhé.':r.st===1?'Đã qua trạm. Luyện thêm để nâng sao!':'Chưa đạt sao nào. Thử lại nhé, bạn làm được!'}</p>
   <p class="hint" style="margin:0 0 12px">${r.gain?`+${r.gain} sao mới · `:''}XP và xu đã được cộng.</p>${extra}
   <div class="row" style="justify-content:center"><button class="b3 ghost sm" data-act="open" data-arg="${V.actId}">Làm lại</button>${nx?`<button class="b3 lime" data-act="open" data-arg="${nx}">Trạm tiếp ›</button>`:''}<button class="b3 navy sm" data-act="unit" data-arg="${V.lv}|${V.u}">Về Unit</button></div></div>`}
function finishAct(pct){if(V.rec)return;V.rec=recordAct(V.actId,pct);sfx(pct>=40)}

/* rating widget */
function rateHTML(crit,key='stars'){const st=V[key];return`<div class="rate">${crit.map(([k,l])=>`<div class="rate-row"><span>${l}</span>${[1,2,3,4,5].map(n=>`<button class="starbtn" data-act="arate" data-arg="${key}|${k}|${n}" aria-label="${l} ${n} sao">${ICON.star((st[k]||0)>=n?'#f4c13d':'#f0d4d6')}</button>`).join('')}</div>`).join('')}</div>`}
const ratePct=(crit,st)=>Math.round(crit.reduce((a,[k])=>a+(st[k]||0),0)/(crit.length*5)*100);

VIEWS.act=()=>ACT[V.kind]();
const ACT={};

/* --- MC (IPA, listen-word) --- */
ACT.mc=()=>{const it=V.items[V.i];
  if(V.done)return actHead()+actResult(Math.round(V.score/V.items.length*100));
  return actHead()+`<div class="rule">${V.rule}</div>${V.passage?`<div class="passage" style="max-width:820px;margin:0 auto 14px"><h3>${esc(V.ptitle)}</h3>${V.passage}</div>`:''}<div class="panel" style="max-width:${V.passage?820:640}px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div>
   <div class="row"><span class="muted">Câu ${V.i+1}/${V.items.length}</span><span class="sp"></span>${it.audio?`<button class="b3 sky sm" data-act="say" data-arg="${esc(it.audio)}">${ICON.sound}Nghe</button>`:''}</div>
   <div style="margin:8px 0 14px">${it.prompt}</div>
   <div class="opts ${V.ipa?'ipa':''}">${it.opts.map((o,j)=>{let c='';if(V.sel!==null){if(j===it.a)c='ok';else if(j===V.sel)c='bad'}return`<button class="opt ${c}" data-act="mcpick" data-arg="${j}" ${V.sel!==null?'disabled':''}><b>${L[j]}</b>${esc(o)}</button>`}).join('')}</div>
   ${V.sel!==null?`<div class="explain ${V.sel===it.a?'ok':'bad'}">${V.sel===it.a?'Chính xác! ':'Chưa đúng. '}${it.explain}</div><button class="b3 lime" style="margin-top:12px" data-act="mcnext">${V.i<V.items.length-1?'Câu tiếp':'Xem kết quả'}</button>`:''}</div>`};

/* --- SHADOWING --- */
const SH_CRIT=[['rhy','Bắt kịp tốc độ'],['pro','Phát âm rõ từng từ'],['into','Ngữ điệu giống mẫu']];
ACT.shadow=()=>{
  if(V.done)return actHead()+actResult(V.pct);
  if(V.i>=V.items.length)return actHead('Tự đánh giá')+`<div class="panel" style="max-width:640px;margin:0 auto"><h3 style="color:var(--red)">Bạn shadow tốt đến đâu?</h3><p class="hint">Hãy thành thật, hoặc nhờ bạn bên cạnh nghe và chấm giúp.</p>${rateHTML(SH_CRIT)}
   <button class="b3 lime" data-act="shdone" ${SH_CRIT.every(([k])=>V.stars[k])?'':'disabled'}>Nhận sao</button></div>`;
  const [en,vi]=V.items[V.i];const r=V.reps[V.i]||0;
  return actHead()+`<div class="rule"><b>Cách luyện:</b> nghe mẫu một lần, sau đó bấm <b>Nghe & nói theo</b> và nói NGAY SAU giọng mẫu như một cái bóng. Lặp lại 3 lần, lần sau nói to và tự tin hơn lần trước.</div>
   <div class="panel" style="max-width:720px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div><span class="muted">Câu ${V.i+1}/${V.items.length}</span>
    <div class="bigline" id="kara">${en.split(' ').map(w=>`<span class="kw">${esc(w)}</span>`).join(' ')}</div><div class="vi">${esc(vi)}</div>
    <div class="row" style="margin-top:14px"><button class="b3 sky sm" data-act="shplay" data-arg="0.9">${ICON.sound}Nghe mẫu</button><button class="b3 ghost sm" data-act="shplay" data-arg="0.65">${ICON.slow}Nghe chậm</button>
     <button class="b3 sm" data-act="shrep">${sicon('speaking')}Nghe & nói theo</button><span class="sp"></span><span class="reps" aria-label="Đã shadow ${r}/3 lần">${[0,1,2].map(k=>`<i class="${k<r?'on':''}"></i>`).join('')}</span></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="b3 lime" data-act="shnext" ${r>=2?'':'disabled'}>${V.i<V.items.length-1?'Câu tiếp':'Hoàn thành'}</button></div>
    ${r<2?'<p class="hint" style="text-align:right;margin:6px 0 0">Shadow ít nhất 2 lần để mở câu tiếp.</p>':''}</div>`};
function karaoke(text,rate,onEnd){const el=$('#kara');const spans=el?[...el.querySelectorAll('.kw')]:[];const starts=[];let p=0;text.split(' ').forEach(w=>{starts.push(p);p+=w.length+1});
  spans.forEach(s=>s.classList.remove('on'));
  speakSentence(text,rate,ci=>{let k=0;for(let i=0;i<starts.length;i++)if(starts[i]<=ci)k=i;spans.forEach((s,i)=>s.classList.toggle('on',i===k))},()=>{spans.forEach(s=>s.classList.remove('on'));onEnd&&onEnd()})}

/* --- DICTATION --- */
function lcsMark(target,input){const T=toks(target),U=toks(input);const m=T.length,n=U.length;const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=T[i]===U[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ok=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(T[i]===U[j]){ok[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  return{ok,score:ok.filter(Boolean).length/Math.max(1,m),orig:target.split(/\s+/)}}
ACT.dict=()=>{
  if(V.done){const avg=Math.round(V.items.reduce((a,_,i)=>a+(V.res[i]?V.res[i].score:0),0)/V.items.length*100);return actHead()+actResult(avg)}
  const s=V.items[V.i];const pl=V.plays[V.i]||0;const r=V.res[V.i];
  return actHead()+`<div class="rule"><b>Cách làm:</b> nghe câu (tối đa 3 lần, có thể nghe chậm), gõ lại chính xác từng từ. Chữ hoa và dấu câu không bị trừ điểm.</div>
   <div class="panel" style="max-width:720px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div><span class="muted">Câu ${V.i+1}/${V.items.length}</span>
    <div class="row" style="margin:12px 0"><button class="b3 sky" data-act="dplay" data-arg="0.9" ${pl>=3&&!r?'disabled':''}>${ICON.sound}Nghe</button><button class="b3 ghost sm" data-act="dplay" data-arg="0.65" ${pl>=3&&!r?'disabled':''}>${ICON.slow}Chậm</button><span class="muted" style="font-weight:700">Đã nghe ${pl}/3</span></div>
    <label for="din" class="muted" style="font-weight:700">Gõ câu bạn nghe được</label>
    <textarea id="din" style="min-height:90px" ${r?'readonly':''} spellcheck="false" autocomplete="off" placeholder="Type what you hear…">${esc(V.val||'')}</textarea>
    ${r?`<div class="diff">${r.orig.map((w,i)=>`<span class="${r.ok[i]?'y':'n'}">${esc(w)}</span>`).join('')}</div><div class="explain ${r.score>=.8?'ok':'bad'}"><b>${Math.round(r.score*100)}% từ đúng.</b> ${r.score===1?'Hoàn hảo!':'Các từ gạch đỏ là từ bạn nghe sót hoặc viết sai.'}</div>
     <button class="b3 lime" style="margin-top:12px" data-act="dnext">${V.i<V.items.length-1?'Câu tiếp':'Xem kết quả'}</button>`:`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="b3 lime" data-act="dcheck">Kiểm tra</button></div>`}</div>`};

/* --- LETTER --- */
const LINKERS=/\b(and|but|so|because|then|however|also|firstly|secondly|finally|although|when|while|after|before|moreover|therefore)\b/gi;
function checks(t,txt){const linkN=(txt.match(LINKERS)||[]).length;
  return t.points.map(([l,re])=>`<li class="${re.test(txt)?'on':''}"><span>${re.test(txt)?'✓':''}</span>${l}</li>`).join('')+
   `<li class="${linkN>=3?'on':''}"><span>${linkN>=3?'✓':''}</span>Dùng ít nhất 3 từ nối (${linkN})</li>`}
function gradeText(t,txt){const n=words(txt);const pts=t.points.filter(([,re])=>re.test(txt)).length;const link=(txt.match(LINKERS)||[]).length;
  const content=pts/t.points.length;const len=n>=t.min?1:n>=t.min*.7?.6:n>=t.min*.4?.3:0;const org=Math.min(1,link/4);
  const pct=Math.round((content*.55+len*.25+org*.2)*100);const notes=[];
  const miss=t.points.filter(([,re])=>!re.test(txt)).map(p=>p[0].toLowerCase());if(miss.length)notes.push('Còn thiếu: '+miss.join('; ')+'.');
  if(len<1)notes.push(`Bài có ${n} từ, cần khoảng ${t.min} từ.`);if(org<.75)notes.push('Thêm từ nối (because, so, however, moreover…) để bài mạch lạc hơn.');
  if(!notes.length)notes.push('Đủ ý, đủ độ dài, liên kết tốt. Tuyệt vời!');return{pct,notes}}
ACT.letter=()=>{const t=LETTERS[V.L];const key='L.'+V.L;const txt=S.drafts[key]||'';
  if(V.done)return actHead()+actResult(V.res.pct,`<div class="explain ${V.res.pct>=70?'ok':'bad'}" style="text-align:left;margin-bottom:12px">${V.res.notes.join('<br>')}<br><span class="muted">Điểm tự động theo ý, độ dài và từ nối. Gửi bài cho thầy cô IVY để được chữa chi tiết.</span></div><details style="text-align:left;margin-bottom:12px"><summary style="cursor:pointer;font-weight:800">Xem bài mẫu</summary><div class="model"><p>${esc(t.model)}</p></div></details>`);
  return actHead(t.kind)+`<div class="cols"><div><div class="letter"><span class="stamp">${t.stamp}<br>POST</span><div class="from">${esc(t.from)}</div>${t.letter}</div>
    <div class="panel" style="margin-top:14px"><b style="color:var(--red)">Nhiệm vụ:</b> ${t.task}</div></div>
   <div class="panel"><label for="ltext" class="muted" style="font-weight:800">Thư / bài viết của bạn (tự lưu nháp)</label>
    <textarea id="ltext" data-lkey="${key}" placeholder="Dear…">${esc(txt)}</textarea>
    <div class="wc"><span id="lcn">${words(txt)}</span>/${t.min} từ<div class="track"><i id="lcbar" style="width:${Math.min(100,words(txt)/t.min*100)}%" class="${words(txt)>=t.min?'done':''}"></i></div></div>
    <ul class="checks" id="lchecks">${checks(t,txt)}</ul>
    <button class="b3 lime" data-act="lsend">Gửi thư & chấm</button></div></div>`};

/* --- TALK (present, debate, discussion, photo, Q&A) --- */
const TALK_CRIT=[['flu','Trôi chảy, ít ngập ngừng'],['voc','Từ vựng phong phú'],['gra','Ngữ pháp chính xác'],['org','Ý mạch lạc, có ví dụ']];
const DEB_CRIT=[['arg','Lập luận rõ ràng'],['reb','Phản bác ý đối phương'],['voc','Ngôn ngữ tranh biện'],['flu','Tự tin, trôi chảy']];
function talkTurns(){const T=TALKS[V.T];if(!T.debate)return T.turns;const d=T.debate;const pro=V.side==='pro';
  return[{label:'Lập luận mở đầu',card:`<p>Bạn ở phe <b>${pro?'ỦNG HỘ (For)':'PHẢN ĐỐI (Against)'}</b>. Trình bày 2–3 lý do chính.</p>`,prep:60,talk:60},
   {label:'Phản bác',say:pro?d.oppCon:d.oppPro,card:'<p>Đối thủ vừa phát biểu. Hãy phản bác ý của họ và bảo vệ quan điểm của bạn.</p>',prep:15,talk:45},
   {label:'Kết luận',card:'<p>Tóm tắt lập luận mạnh nhất của bạn trong 30 giây.</p>',prep:10,talk:30}]}
ACT.talk=()=>{const T=TALKS[V.T];const crit=T.debate?DEB_CRIT:TALK_CRIT;
  if(V.done)return actHead(T.kind)+actResult(V.pct,T.sample?`<details style="text-align:left;margin-bottom:12px"><summary style="cursor:pointer;font-weight:800">Xem bài nói mẫu</summary><div class="model"><p>${esc(T.sample)}</p></div><button class="b3 ghost sm" data-act="saysample">${ICON.sound}Nghe bài mẫu</button></details>`:'');
  const phr=`<div class="panel" style="margin-top:14px"><b style="color:var(--red)">Cụm từ hữu ích</b><ul class="phr">${T.phrases.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
  if(V.phase==='side'){const d=T.debate;return actHead(T.kind)+`<div class="panel" style="max-width:820px;margin:0 auto"><div class="motion">Motion: ${esc(d.motion)}</div>
    <div class="sides"><div><h4 style="color:var(--lime-d)">For · Ủng hộ</h4><ul>${d.pro.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4 style="color:var(--red)">Against · Phản đối</h4><ul>${d.con.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
    <p style="font-weight:800;margin:14px 0 8px">Chọn phe của bạn. Đối thủ ảo sẽ đứng ở phe còn lại.</p>
    <div class="row"><button class="b3 lime" data-act="tside" data-arg="pro">Tôi ủng hộ</button><button class="b3" data-act="tside" data-arg="con">Tôi phản đối</button></div>${phr}</div>`}
  const turns=talkTurns();
  if(V.phase==='rate')return actHead(T.kind)+`<div class="panel" style="max-width:640px;margin:0 auto"><h3 style="color:var(--red)">Tự đánh giá bài nói</h3><p class="hint">Chấm từ 1 đến 5 sao cho mỗi tiêu chí.</p>${rateHTML(crit)}
    <button class="b3 lime" data-act="tdone" ${crit.every(([k])=>V.stars[k])?'':'disabled'}>Nhận sao</button></div>`;
  const t=turns[V.ti];const R=2*Math.PI*64;const total=V.phase==='prep'?t.prep:t.talk;const frac=['prep','talk'].includes(V.phase)?V.left/total:1;
  return actHead(T.kind)+`<div class="steps">${turns.map((x,i)=>`<span class="${i===V.ti?'on':i<V.ti?'done':''}">${x.label||('Câu '+(i+1))}</span>`).join('')}</div>
   <div class="cols"><div><div class="task">${T.debate?`<div class="motion" style="margin-bottom:10px">${esc(T.debate.motion)}</div>`:''}<h3>${esc(T.title)}</h3>
     ${t.say?`<div class="quote" style="margin:8px 0"><b>${T.debate?'Đối thủ':'Câu hỏi'}:</b> ${V.showQ||!hasTTS||T.debate?esc(t.say):'<span class="muted">(bấm Bắt đầu để nghe câu hỏi · <button class="b3 ghost sm" data-act="tshowq">Hiện chữ</button>)</span>'}</div>`:''}
     ${t.card||''}<p class="hint">${t.prep?'Chuẩn bị '+t.prep+' giây · ':''}Nói ${t.talk} giây</p></div>${phr}</div>
    <div class="panel" style="text-align:center">
     <div class="ring-timer"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="#f6e4e5" stroke-width="12" fill="none"/><circle id="ringc" cx="75" cy="75" r="64" stroke="${V.phase==='talk'?'#d7192a':'#2f9ae0'}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-frac)}"/></svg>
      <div id="ringt">${['prep','talk'].includes(V.phase)?V.left:'–'}<small>${({idle:'sẵn sàng',listen:'đang nghe',prep:'chuẩn bị',talk:'bạn nói'})[V.phase]}</small></div></div>
     ${V.phase==='idle'?`<button class="b3 sky" data-act="tstart">Bắt đầu</button>`:''}
     ${V.phase==='listen'?`<p style="font-weight:800">Hãy lắng nghe…</p><button class="b3 ghost sm" data-act="tskiplisten">Đã nghe xong</button>`:''}
     ${V.phase==='prep'?`<p style="font-weight:800">Ghi nhanh ý chính ra giấy.</p><button class="b3" data-act="ttalk">Nói ngay</button>`:''}
     ${V.phase==='talk'?`<p style="font-weight:800;color:var(--red)">Nói to thành tiếng nhé!</p><button class="b3 lime" data-act="tnext">${V.ti<turns.length-1?'Xong, phần tiếp':'Xong'}</button>`:''}
     <p class="hint">Trang không ghi âm. Mẹo: dùng điện thoại ghi âm để tự nghe lại.</p></div></div>`};
function tPhase(ph){const t=talkTurns()[V.ti];V.phase=ph;V.left=ph==='prep'?t.prep:t.talk;render();clearInterval(tick);
  tick=setInterval(()=>{V.left--;const total=V.phase==='prep'?t.prep:t.talk;const R=2*Math.PI*64;const c=$('#ringc'),tt=$('#ringt');if(c)c.setAttribute('stroke-dashoffset',R*(1-V.left/total));if(tt)tt.firstChild.textContent=Math.max(0,V.left);
   if(V.left<=0){clearInterval(tick);sfx(true);if(V.phase==='prep')tPhase('talk');else tAdvance()}},1000)}
function tBegin(){const t=talkTurns()[V.ti];if(t.say){V.phase='listen';render();speakLines([[TALKS[V.T].debate?'Opponent':'Teacher',t.say]],()=>{if(V.name==='act'&&V.kind==='talk'&&V.phase==='listen')tAfterListen()})}else tAfterListen()}
function tAfterListen(){const t=talkTurns()[V.ti];if(t.prep)tPhase('prep');else tPhase('talk')}
function tAdvance(){clearInterval(tick);stopSpeak();const turns=talkTurns();if(V.ti<turns.length-1){V.ti++;tBegin()}else{V.phase='rate';render()}}

/* --- DUBBING --- */
const DUB_CRIT=[['tim','Khớp thời gian thoại'],['pro','Phát âm rõ ràng'],['emo','Diễn cảm, đúng cảm xúc']];
function charSVG(role,color,acc,name){return`<svg class="chr" data-role="${role}" viewBox="0 0 120 150" aria-label="${name}"><ellipse cx="60" cy="140" rx="40" ry="6" fill="rgba(0,0,0,.12)"/><path d="M14 132 Q8 44 60 34 Q112 44 106 132Z" fill="${color}" stroke="#fff" stroke-width="5"/>${acc}<circle cx="44" cy="76" r="12" fill="#fff"/><circle cx="76" cy="76" r="12" fill="#fff"/><circle cx="46" cy="78" r="5.5" fill="#2a1a22"/><circle cx="78" cy="78" r="5.5" fill="#2a1a22"/><ellipse class="mouth" cx="60" cy="104" rx="13" ry="6" fill="#2a1a22"/><text x="60" y="126" text-anchor="middle" font-size="13" fill="#fff" class="name">${name}</text></svg>`}
ACT.dub=()=>{const D=DUBS[V.D];
  if(V.done)return actHead('Lồng tiếng')+actResult(V.pct);
  if(V.phase==='rate')return actHead('Lồng tiếng')+`<div class="panel" style="max-width:640px;margin:0 auto"><h3 style="color:var(--red)">Bạn lồng tiếng thế nào?</h3>${rateHTML(DUB_CRIT)}<button class="b3 lime" data-act="ddone" ${DUB_CRIT.every(([k])=>V.stars[k])?'':'disabled'}>Nhận sao</button></div>`;
  const running=V.mode!=null&&V.idx>=0;
  return actHead('Lồng tiếng')+`<div class="rule"><b>Cách chơi:</b> xem cảnh mẫu trước. Sau đó chọn vai: lời của vai bạn sẽ <b>tắt tiếng</b>, bạn đọc to đúng lúc thanh đỏ chạy. Đọc khớp thời gian và diễn cảm như diễn viên lồng tiếng!</div>
   <div class="cols"><div><div class="dubstage">${charSVG('A','var(--red)','<path d="M40 38 Q60 14 80 38" fill="#f4c13d" stroke="#fff" stroke-width="4"/>',D.roles.A)}${charSVG('B','var(--navy)','<path d="M30 46 l10-20 10 18 10-20 10 18 10-20 10 22" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>',D.roles.B)}</div>
     <p class="hint" style="margin:8px 4px 0">${esc(D.desc)}</p>
     <div class="row" style="margin-top:12px">${running?`<button class="b3 ghost sm" data-act="dstop">Dừng</button>`:`<button class="b3 sky sm" data-act="drun" data-arg="watch">${ICON.play}Xem mẫu</button><button class="b3 sm" data-act="drun" data-arg="A">Lồng vai ${esc(D.roles.A)}</button><button class="b3 navy sm" data-act="drun" data-arg="B">Lồng vai ${esc(D.roles.B)}</button>`}
      ${V.dubbed&&!running?`<button class="b3 lime sm" data-act="dfinish">Chấm bài</button>`:''}</div>
     ${!V.dubbed?'<p class="hint">Hoàn thành ít nhất một lượt lồng tiếng để chấm bài.</p>':''}</div>
    <div class="panel"><b style="color:var(--red)">Kịch bản · ${esc(D.title)}</b><div class="subs" id="subs">${D.lines.map(([r,t],i)=>`<div class="sub ${i===V.idx?'on':''} ${V.mode===r?'me':''}" id="sub-${i}"><b>${esc(D.roles[r])}</b><div style="flex:1;min-width:0">${esc(t)}${V.mode===r&&i===V.idx?'<div class="cue"><i id="cuebar"></i></div>':''}</div></div>`).join('')}</div></div></div>`};
function dubStep(tok){if(V.name!=='act'||V.kind!=='dub'||V.dtok!==tok)return;const D=DUBS[V.D];
  if(V.idx>=D.lines.length){const wasDub=V.mode!=='watch';V.mode=null;V.idx=-1;if(wasDub){V.dubbed=true;sfx(true);badge('voice')}render();return}
  const [r,t]=D.lines[V.idx];render();document.querySelectorAll('.chr').forEach(c=>c.classList.toggle('talk',c.dataset.role===r));
  const el=$('#sub-'+V.idx);if(el)el.scrollIntoView({block:'nearest'});
  if(V.mode===r){const dur=(t.split(/\s+/).length*0.5+1.4)*1000;const bar=$('#cuebar');if(bar){bar.style.transition=`width ${dur}ms linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='100%'}))}
    setTimeout(()=>{V.idx++;dubStep(tok)},dur)}
  else speakLines([[r,t]],()=>{V.idx++;dubStep(tok)},{A:0,B:1})}


/* --- MEMORY (lật thẻ ghép cặp) --- */
ACT.memory=()=>{if(V.done)return actHead()+actResult(V.pct,`<p class="hint">${V.moves} lượt lật cho ${V.pairs} cặp.</p>`);
  return actHead()+`<div class="rule"><b>Cách chơi:</b> lật 2 thẻ một lượt. Nếu từ tiếng Anh khớp với nghĩa, cặp thẻ sẽ ở lại. Càng ít lượt lật càng nhiều sao!</div>
   <div class="panel" style="max-width:720px;margin:0 auto"><div class="row"><b>Lượt lật: ${V.moves}</b><span class="sp"></span><span class="muted">Đã ghép ${Object.keys(V.got).length}/${V.pairs} cặp</span></div>
   <div class="mgrid">${V.cards.map((c,i)=>{const up=V.open.includes(i)||V.got[c.k];return`<button class="mcard ${up?'up':''} ${V.got[c.k]?'got':''} ${c.en?'en':''}" data-act="mflip" data-arg="${i}" ${V.got[c.k]?'disabled':''} aria-label="${up?esc(c.t):'Thẻ úp'}"><span>${up?esc(c.t):'?'}</span></button>`}).join('')}</div></div>`};

/* --- HANGMAN --- */
const KEYS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
ACT.hangman=()=>{if(V.done)return actHead()+actResult(V.pct);const w=V.items[V.i];const word=w[0].toUpperCase();
  const shown=word.split('').map(ch=>V.guess.includes(ch)||V.state!=='play'?ch:'_');
  const parts=6-V.lives;
  return actHead()+`<div class="rule"><b>Cách chơi:</b> đoán từng chữ cái của từ tiếng Anh dựa vào nghĩa tiếng Việt. Sai 6 lần là thua từ đó.</div>
   <div class="panel" style="max-width:720px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div>
    <div class="hm"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M10 112h60M30 112V10h50v14" stroke="#b47a45" stroke-width="5" fill="none" stroke-linecap="round"/>${parts>0?'<circle cx="80" cy="34" r="10" stroke="#2a1a22" stroke-width="4" fill="#fff"/>':''}${parts>1?'<path d="M80 44v30" stroke="#2a1a22" stroke-width="4"/>':''}${parts>2?'<path d="M80 52l-14 12" stroke="#2a1a22" stroke-width="4"/>':''}${parts>3?'<path d="M80 52l14 12" stroke="#2a1a22" stroke-width="4"/>':''}${parts>4?'<path d="M80 74l-12 18" stroke="#2a1a22" stroke-width="4"/>':''}${parts>5?'<path d="M80 74l12 18" stroke="#2a1a22" stroke-width="4"/>':''}</svg>
     <div><div class="muted">Từ ${V.i+1}/${V.items.length} · còn ${V.lives} mạng</div><div class="vi" style="font-size:1.4rem">${esc(w[2])}</div><div class="hword">${shown.map(c=>`<span>${c}</span>`).join('')}</div></div></div>
    ${V.state==='play'?`<div class="keys">${KEYS.map(k=>`<button data-act="hkey" data-arg="${k}" ${V.guess.includes(k)?'disabled':''} class="${V.guess.includes(k)?(word.includes(k)?'kok':'kno'):''}">${k}</button>`).join('')}</div>`:
     `<div class="explain ${V.state==='win'?'ok':'bad'}"><b>${V.state==='win'?'Đúng rồi!':'Hết mạng!'}</b> ${esc(w[0])} · <i>${esc(w[3])}</i></div><div class="row" style="margin-top:10px"><button class="b3 sky sm" data-act="say" data-arg="${esc(w[0])}">${ICON.sound}Nghe</button><button class="b3 lime" data-act="hnext">${V.i<V.items.length-1?'Từ tiếp':'Xem kết quả'}</button></div>`}</div>`};

/* --- SORT (kéo vào nhóm) --- */
ACT.sort=()=>{if(V.done)return actHead()+actResult(V.pct);const rest=V.items.map((x,i)=>i).filter(i=>V.placed[i]===undefined);
  return actHead()+`<div class="rule"><b>Cách chơi:</b> chạm vào một thẻ rồi chạm vào nhóm đúng (hoặc kéo thả thẻ vào nhóm). Sai sẽ bị trừ điểm.</div>
   <div class="panel"><b style="color:var(--red)">${esc(V.S.t)}</b><div class="chips2" style="margin:10px 0 14px">${rest.length?rest.map(i=>`<button class="tile ${V.sel===i?'sel':''}" draggable="true" data-drag="${i}" data-act="ssel" data-arg="${i}">${esc(V.items[i][0])}</button>`).join(''):'<span class="muted">Đã xếp hết!</span>'}</div>
   <div class="buckets" style="grid-template-columns:repeat(${V.S.groups.length},1fr)">${V.S.groups.map((g,gi)=>`<button class="bucket" data-act="sdrop" data-arg="${gi}" data-drop="${gi}"><b>${esc(g)}</b><span class="chips2">${V.items.map((x,i)=>V.placed[i]===gi?`<span class="tile ok">${esc(x[0])}</span>`:'').join('')}</span></button>`).join('')}</div>
   <p class="hint">Sai ${V.wrong} lần</p></div>`};

/* --- SCRAMBLE (sắp xếp câu) --- */
ACT.scramble=()=>{if(V.done)return actHead()+actResult(Math.round(V.score/V.items.length*100));const it=V.items[V.i];
  const built=V.pick.map(k=>it.tiles[k].t);
  return actHead()+`<div class="rule"><b>Cách chơi:</b> chạm vào các từ theo đúng thứ tự để tạo câu hoàn chỉnh. Chạm vào từ đã chọn để bỏ ra.</div>
   <div class="panel" style="max-width:780px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div><span class="muted">Câu ${V.i+1}/${V.items.length}</span>
    <div class="answer ${V.res===true?'ok':V.res===false?'bad':''}">${built.length?V.pick.map((k,j)=>`<button class="tile on" data-act="sbk" data-arg="${j}" ${V.res===true?'disabled':''}>${esc(it.tiles[k].t)}</button>`).join(''):'<span class="muted">Chạm vào từ bên dưới…</span>'}</div>
    <div class="chips2" style="margin-top:12px">${it.tiles.map((x,k)=>V.pick.includes(k)?'':`<button class="tile" data-act="spk" data-arg="${k}" ${V.res===true?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>
    ${V.res===true?`<div class="explain ok"><b>Chính xác!</b> <button class="b3 ghost sm" data-act="say" data-arg="${esc(it.s)}">${ICON.sound}</button></div><button class="b3 lime" style="margin-top:12px" data-act="snext">${V.i<V.items.length-1?'Câu tiếp':'Xem kết quả'}</button>`:
     V.res===false&&V.tries>=2?`<div class="explain bad">Đáp án: <b>${esc(it.s)}</b></div><button class="b3 lime" style="margin-top:12px" data-act="snext">${V.i<V.items.length-1?'Câu tiếp':'Xem kết quả'}</button>`:
     `<div class="row" style="justify-content:flex-end;margin-top:12px">${V.res===false?'<span style="color:var(--red);font-weight:800">Chưa đúng, thử lại!</span>':''}<button class="b3 lime" data-act="scheck" ${V.pick.length===it.tiles.length?'':'disabled'}>Kiểm tra</button></div>`}</div>`};

/* --- GAP-FILL WITH WORD BANK --- */
ACT.gapbank=()=>{if(V.done)return actHead()+actResult(V.pct);
  const html=V.text.map(s=>s.replace(/\{\{(\d+)\}\}/g,(_,n)=>{n=+n;const v=V.fill[n];let c='';if(V.checked)c=v&&v.toLowerCase()===V.blanks[n].toLowerCase()?'ok':'bad';
    return`<button class="slot ${V.cur===n?'cur':''} ${c}" data-act="gslot" data-arg="${n}" ${V.checked?'disabled':''}>${v?esc(v):'&nbsp;'+(n+1)+'&nbsp;'}</button>${V.checked&&c==='bad'?`<span class="corr2">${esc(V.blanks[n])}</span>`:''}`})).join(' ');
  const used=Object.values(V.fill);
  return actHead()+`<div class="rule"><b>Cách chơi:</b> chọn một ô trống rồi chạm vào từ trong word bank. Có 2 từ thừa không dùng đến.</div>
   <div class="panel" style="max-width:780px;margin:0 auto"><div class="bank">${V.bank.map(w=>`<button class="tile ${used.includes(w)?'used':''}" data-act="gword" data-arg="${esc(w)}" ${V.checked||used.includes(w)?'disabled':''}>${esc(w)}</button>`).join('')}</div>
    <div class="gtext">${html}</div>
    ${V.checked?`<button class="b3 lime" style="margin-top:12px" data-act="gfin">Nhận sao</button>`:`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="b3 ghost sm" data-act="gclear">Làm lại</button><button class="b3 lime" data-act="gcheck" ${Object.keys(V.fill).length===V.blanks.length?'':'disabled'}>Kiểm tra</button></div>`}</div>`};

/* --- WHEEL / JUST A MINUTE --- */
ACT.wheel=()=>{if(V.done)return actHead()+actResult(V.pct);
  const n=V.qs.length,seg=360/n,R=2*Math.PI*64;const need=Math.min(V.jam?3:4,n);
  if(V.phase==='rate')return actHead()+`<div class="panel" style="max-width:640px;margin:0 auto"><h3 style="color:var(--red)">Tự đánh giá bài nói</h3>${rateHTML(TALK_CRIT)}<button class="b3 lime" data-act="wdone" ${TALK_CRIT.every(([k])=>V.stars[k])?'':'disabled'}>Nhận sao</button></div>`;
  const cols=['#d7192a','#1b2a6b','#f28a1d','#14a99c','#8a4fd6','#2f9ae0','#5fb526','#f4c13d'];
  const wheel=`<svg viewBox="-110 -110 220 220" class="wheel" style="transform:rotate(${V.rot}deg)">${V.qs.map((q,i)=>{const a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180;const x0=100*Math.cos(a0),y0=100*Math.sin(a0),x1=100*Math.cos(a1),y1=100*Math.sin(a1);const am=((i+.5)*seg-90)*Math.PI/180;
    return`<path d="M0 0L${x0} ${y0}A100 100 0 ${seg>180?1:0} 1 ${x1} ${y1}Z" fill="${V.used.includes(i)?'#efd2d4':cols[i%cols.length]}" stroke="#fff" stroke-width="3"/><text x="${66*Math.cos(am)}" y="${66*Math.sin(am)+7}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="22" fill="#fff">${i+1}</text>`}).join('')}<circle r="16" fill="#fff" stroke="#d7192a" stroke-width="4"/></svg>`;
  const q=V.cur!=null?V.qs[V.cur]:null;const frac=V.phase==='talk'?V.left/(V.jam?60:30):1;
  return actHead(V.jam?'Nói liên tục 1 phút, không ngập ngừng lâu':'')+`<div class="cols"><div class="panel" style="text-align:center"><div class="wheelbox"><span class="pointer"></span>${wheel}</div>
    <button class="b3" data-act="wspin" ${V.phase==='spin'&&V.used.length<n?'':'disabled'}>Quay!</button><p class="hint">Đã trả lời ${V.used.length}/${n} · cần ít nhất ${need} câu để chấm</p></div>
   <div class="panel">${q?`<div class="muted" style="font-weight:800">${V.jam?'Chủ đề':'Câu hỏi'} số ${V.cur+1}</div><div class="bigq">${esc(q)}</div>`:'<div class="bigq muted">Quay vòng để nhận câu hỏi!</div>'}
    ${V.phase==='talk'?`<div class="ring-timer" style="width:120px;height:120px"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="#f6e4e5" stroke-width="12" fill="none"/><circle id="ringc" cx="75" cy="75" r="64" stroke="#d7192a" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-frac)}"/></svg><div id="ringt" style="font-size:1.8rem">${V.left}<small>bạn nói</small></div></div>
     <div class="row" style="justify-content:center"><button class="b3 ghost sm" data-act="say" data-arg="${esc(q)}">${ICON.sound}Nghe lại</button><button class="b3 lime sm" data-act="wnext">Xong</button></div>`:''}
    ${V.phase==='spin'&&V.used.length>=need?`<button class="b3 lime" data-act="wrate">Kết thúc & chấm</button>`:''}
    <div style="margin-top:12px"><b style="color:var(--red)">Cụm từ hữu ích</b><ul class="phr">${V.phrases.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></div></div>`};

/* --- MYSTERY BOXES (mở ô bí mật) --- */
function qBox(q,sel,act){return`<div class="bigq" style="font-size:1.3rem">${esc(q.q).replace('___','<span style="color:var(--red)">_____</span>')}</div>
  <div class="opts">${q.opts.map((o,j)=>{let c='';if(sel!=null){if(j===q.a)c='ok';else if(j===sel)c='bad'}return`<button class="opt ${c}" data-act="${act}" data-arg="${j}" ${sel!=null?'disabled':''}><b>${L[j]}</b>${esc(o)}</button>`}).join('')}</div>
  ${sel!=null&&q.ex?`<div class="explain ${sel===q.a?'ok':'bad'}">${esc(q.ex)}</div>`:''}`}
ACT.mystery=()=>{if(V.done)return actHead()+actResult(V.pct);const b=V.cur!=null?V.boxes[V.cur]:null;
  return actHead()+`<div class="rule"><b>Cách chơi:</b> mở từng ô bí mật. Mỗi ô là một câu hỏi hoặc một phần thưởng xu!</div>
   <div class="cols"><div class="panel"><div class="boxes">${V.boxes.map((x,i)=>{const o=V.openB[i];return`<button class="mbox ${o?'open':''} ${o==='ok'?'ok':o==='bad'?'bad':''}" data-act="mopen" data-arg="${i}" ${o||V.cur!=null?'disabled':''}>${o?(x.bonus?'+'+x.bonus:o==='ok'?'✓':'✗'):i+1}</button>`}).join('')}</div><p class="hint">Đúng ${V.right}/${V.total} câu hỏi</p></div>
    <div class="panel">${b?(b.bonus?`<div class="bigq">Ô thưởng! +${b.bonus} xu</div><button class="b3 gold" data-act="mclose">Nhận</button>`:qBox(b.q,V.sel,'mpick')+(V.sel!=null?`<button class="b3 lime" style="margin-top:12px" data-act="mclose">Đóng ô</button>`:'')):'<div class="bigq muted">Chọn một ô để mở</div>'}</div></div>`};

/* --- MILLIONAIRE --- */
const LADDER=[100,200,500,1000,2000,5000,10000,50000];
ACT.millionaire=()=>{if(V.done)return actHead()+actResult(V.pct);const q=V.qs[V.i];
  return actHead()+`<div class="cols"><div class="panel mill">${V.state==='play'||V.sel!=null?`<div class="muted" style="font-weight:800">Câu ${V.i+1}/${V.qs.length} · ${LADDER[V.i].toLocaleString('vi-VN')} điểm</div>
     <div class="bigq" style="font-size:1.3rem">${esc(q.q).replace('___','<span style="color:var(--gold)">_____</span>')}</div>
     <div class="opts">${q.opts.map((o,j)=>{let c='';if(V.sel!=null){if(j===q.a)c='ok';else if(j===V.sel)c='bad'}return V.hidden.includes(j)?`<span class="opt" style="visibility:hidden"><b>${L[j]}</b>-</span>`:`<button class="opt ${c}" data-act="mlpick" data-arg="${j}" ${V.sel!=null?'disabled':''}><b>${L[j]}</b>${esc(o)}</button>`}).join('')}</div>
     ${V.sel==null?`<div class="row" style="margin-top:12px"><button class="b3 sky sm" data-act="ml5050" ${V.used5050?'disabled':''}>50 : 50</button><button class="b3 gold sm" data-act="mlswap" ${V.usedSwap||!V.spare.length?'disabled':''}>Đổi câu hỏi</button><span class="sp"></span><button class="b3 ghost sm" data-act="mlstop">Dừng cuộc chơi</button></div>`:
      `<div class="explain ${V.sel===q.a?'ok':'bad'}">${esc(q.ex||'')}</div><button class="b3 lime" style="margin-top:12px" data-act="mlnext">${V.sel===q.a&&V.i<V.qs.length-1?'Câu tiếp':'Xem kết quả'}</button>`}`:''}</div>
    <div class="panel"><b style="color:var(--red)">Bậc thang điểm</b><ol class="ladder" reversed>${LADDER.slice(0,V.qs.length).map((p,i)=>`<li class="${i===V.i?'on':i<V.i?'past':''}">${p.toLocaleString('vi-VN')}</li>`).reverse().join('')}</ol><p class="hint">Trả lời sai là dừng. Có thể dừng cuộc chơi bất cứ lúc nào để giữ điểm.</p></div></div>`};

/* --- ERROR HUNT --- */
ACT.errorhunt=()=>{if(V.done)return actHead()+actResult(Math.round(V.score/V.items.length*100));const it=V.items[V.i];
  return actHead()+`<div class="rule"><b>Cách chơi:</b> mỗi câu có MỘT chỗ sai. Chạm vào từ hoặc cụm từ sai!</div>
   <div class="panel" style="max-width:780px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div><span class="muted">Câu ${V.i+1}/${V.items.length}</span>
    <div class="ehunt">${it.toks.map((t,j)=>{let c='';if(V.sel!=null){if(t.bad)c='bad';else if(j===V.sel)c='miss'}return`<button class="etok ${c}" data-act="epick" data-arg="${j}" ${V.sel!=null?'disabled':''}>${esc(t.t)}</button>`}).join(' ')}</div>
    ${V.sel!=null?`<div class="explain ${it.toks[V.sel].bad?'ok':'bad'}"><b>${it.toks[V.sel].bad?'Tìm đúng rồi!':'Chưa đúng.'}</b> Sửa: <b>${esc(it.toks.find(t=>t.bad).t)}</b> → <b style="color:var(--lime-d)">${esc(it.fix)}</b>. ${esc(it.ex)}</div><button class="b3 lime" style="margin-top:12px" data-act="enext">${V.i<V.items.length-1?'Câu tiếp':'Xem kết quả'}</button>`:''}</div>`};

/* --- TABOO --- */
ACT.taboo=()=>{if(V.done)return actHead()+actResult(V.pct);const c=V.cards[V.i];const R=2*Math.PI*64;
  return actHead('Chơi cùng bạn: bạn mô tả, bạn kia đoán')+`<div class="rule"><b>Cách chơi:</b> mô tả từ trên thẻ bằng tiếng Anh để bạn cùng nhóm đoán, KHÔNG được nói từ đó và các từ cấm. Nếu luyện một mình, hãy nói to phần mô tả. Mỗi thẻ 45 giây.</div>
   <div class="cols"><div class="tcard"><small>Thẻ ${V.i+1}/${V.cards.length}</small><div class="tword">${esc(c.w)}</div><div class="vi" style="color:#fff">${esc(c.vi)}</div><div class="tban"><b>KHÔNG được nói:</b>${[c.w,...c.ban].map(b=>`<span>${esc(b)}</span>`).join('')}</div></div>
    <div class="panel" style="text-align:center"><div class="ring-timer"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="#f6e4e5" stroke-width="12" fill="none"/><circle id="ringc" cx="75" cy="75" r="64" stroke="#8a4fd6" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-(V.phase==='go'?V.left/45:1))}"/></svg><div id="ringt">${V.phase==='go'?V.left:'45'}<small>giây</small></div></div>
     ${V.phase==='ready'?`<button class="b3" data-act="tbgo">Bắt đầu</button>`:`<div class="row" style="justify-content:center"><button class="b3 lime" data-act="tbok">Bạn đoán đúng ✓</button><button class="b3 ghost sm" data-act="tbskip">Bỏ qua</button></div>`}
     <p class="hint">Gợi ý: It's a kind of… · You use it to… · It's the opposite of… · You can find it in…</p><p class="muted" style="font-weight:800">Đoán đúng: ${V.ok}</p></div></div>`};
function tbNext(ok){clearInterval(tick);if(ok)V.ok++;sfx(!!ok);if(V.i<V.cards.length-1){V.i++;V.phase='ready';render()}else{V.pct=Math.round(V.ok/V.cards.length*100);V.done=true;S.missions.speak++;finishAct(V.pct);render()}}

/* --- ESCAPE ROOM --- */
ACT.escape=()=>{if(V.done)return actHead()+actResult(V.pct,`<p style="font-weight:800">Mã mở cửa: ${V.digits.join(' ')}</p>`);const k=V.locks[V.i];
  const story=['Bạn bị nhốt trong thư viện trường sau giờ học! Cửa có khóa 4 số.','Mỗi ổ khóa nhỏ mở ra khi bạn giải đúng một thử thách tiếng Anh.','Giải đủ 4 khóa để có mã thoát ra trước khi đèn tắt!'];
  let body='';
  if(k.type==='mc')body=qBox(k,V.sel,'xpick');
  if(k.type==='error')body=`<div class="muted" style="font-weight:800">Chạm vào phần SAI trong câu:</div><div class="ehunt">${k.toks.map((t,j)=>`<button class="etok ${V.sel===j?(t.bad?'bad':'miss'):''}" data-act="xerr" data-arg="${j}" ${V.sel!=null&&k.toks[V.sel].bad?'disabled':''}>${esc(t.t)}</button>`).join(' ')}</div>`;
  if(k.type==='scramble'){body=`<div class="muted" style="font-weight:800">Sắp xếp lại thành câu đúng:</div><div class="answer">${V.pick.map((x,j)=>`<button class="tile on" data-act="xbk" data-arg="${j}">${esc(k.tiles[x].t)}</button>`).join('')||'<span class="muted">…</span>'}</div><div class="chips2" style="margin-top:10px">${k.tiles.map((x,j)=>V.pick.includes(j)?'':`<button class="tile" data-act="xpk" data-arg="${j}">${esc(x.t)}</button>`).join('')}</div><button class="b3 lime sm" style="margin-top:10px" data-act="xchk" ${V.pick.length===k.tiles.length?'':'disabled'}>Thử mở khóa</button>`}
  return actHead()+`<div class="escape"><div class="estory">${story.map(s=>`<p>${s}</p>`).join('')}</div>
   <div class="locks">${V.locks.map((x,i)=>`<span class="lock ${i<V.i?'open':i===V.i?'cur':''}">${i<V.i?V.digits[i]:'?'}</span>`).join('')}</div>
   <div class="panel" style="max-width:720px;margin:12px auto 0"><b style="color:var(--navy)">Khóa ${V.i+1}/4</b>${body}${V.msg?`<p style="color:var(--red);font-weight:800;margin:8px 0 0">${V.msg}</p>`:''}
   ${V.solved?`<button class="b3 lime" style="margin-top:12px" data-act="xnext">${V.i<3?'Sang khóa tiếp':'Mở cửa!'}</button>`:''}</div></div>`};
function xSolve(ok){if(ok){V.solved=true;V.msg='';sfx(true)}else{V.tries++;V.msg='Sai rồi! Khóa vẫn đóng, thử lại nhé.';sfx(false)}render()}

/* --- JEOPARDY --- */
ACT.jeopardy=()=>{if(V.done)return actHead()+actResult(V.pct,`<p style="font-weight:800">${V.pts} / ${V.jmax} điểm</p>`);
  const c=V.cur;const q=c?V.cols[c[0]][1][c[1]]:null;
  return actHead()+`<div class="rule"><b>Cách chơi:</b> chọn chủ đề và mức điểm. Câu càng nhiều điểm càng khó. Hết bảng là xong!</div>
   <div class="cols"><div class="panel"><div class="jboard">${V.cols.map(([name])=>`<div class="jhead">${name}</div>`).join('')}${[0,1,2].map(r=>V.cols.map((col,ci)=>{const k=ci+'-'+r;if(!col[1][r])return'<span></span>';return`<button class="jcell ${V.jd[k]?(V.jd[k]==='ok'?'ok':'bad'):''}" data-act="jopen" data-arg="${ci}|${r}" ${V.jd[k]||c?'disabled':''}>${V.jd[k]?(V.jd[k]==='ok'?'✓':'✗'):(r+1)*100*2}</button>`}).join('')).join('')}</div><p style="font-family:var(--display);font-weight:800;font-size:1.3rem;margin:10px 0 0">Điểm: ${V.pts}</p></div>
    <div class="panel">${q?`<div class="muted" style="font-weight:800">${V.cols[c[0]][0]} · ${(c[1]+1)*200} điểm</div>${qBox(q,V.sel,'jpick')}${V.sel!=null?`<button class="b3 lime" style="margin-top:12px" data-act="jclose">Về bảng</button>`:''}`:'<div class="bigq muted">Chọn một ô trên bảng</div>'}</div></div>`};

/* --- SPEED CHALLENGE 60s --- */
ACT.speed=()=>{if(V.done)return actHead()+actResult(V.pct,`<p style="font-weight:800">${V.right} câu đúng · ${V.wrong} câu sai trong 60 giây</p>`);
  if(V.phase==='ready')return actHead()+`<div class="panel bigres" style="max-width:560px;margin:0 auto"><div class="bigq">60 giây · trả lời càng nhiều càng tốt!</div><p class="hint">Đúng 8 câu trở lên = 3 sao. Trả lời sai không bị trừ, nhưng mất thời gian.</p><button class="b3" data-act="spdgo">${sicon('bolt')}Bắt đầu</button></div>`;
  const q=V.pool[V.i%V.pool.length];
  return actHead()+`<div class="panel" style="max-width:700px;margin:0 auto"><div class="row"><span class="timer ${V.left<=10?'low':''}" id="timer" style="margin-left:0">${fmt(V.left)}</span><span class="sp"></span><b style="color:var(--lime-d)">✓ ${V.right}</b><b style="color:var(--red)">✗ ${V.wrong}</b></div>
   <div class="bigq ${V.flash||''}" style="font-size:1.3rem;margin-top:12px">${esc(q.q).replace('___','<span style="color:var(--red)">_____</span>')}</div>
   <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-act="spdpick" data-arg="${j}"><b>${L[j]}</b>${esc(o)}</button>`).join('')}</div></div>`};

/* --- TYPED GAP (word formation) --- */
ACT.gap=()=>{if(V.done){const sc=V.items.filter((_,i)=>V.res[i]).length;return actHead()+actResult(Math.round(sc/V.items.length*100))}
  const it=V.items[V.i];const r=V.res[V.i];
  return actHead()+`<div class="rule"><b>Word formation:</b> biến đổi từ trong ngoặc thành dạng đúng (tính từ, danh từ, phủ định…).</div>
   <div class="panel" style="max-width:700px;margin:0 auto"><div class="prog"><i style="width:${V.i/V.items.length*100}%"></i></div><span class="muted">Câu ${V.i+1}/${V.items.length}</span>
    <div class="bigq" style="font-size:1.3rem">${esc(it[0]).replace('___','<span style="color:var(--red)">_____</span>')}</div>
    <div class="row"><input class="gap ${r===undefined?'':r?'ok':'bad'}" id="gapin" autocomplete="off" spellcheck="false" ${r!==undefined?'disabled':''} value="${esc(V.val||'')}" aria-label="Đáp án"><button class="b3 lime sm" data-act="gapchk" ${r!==undefined?'disabled':''}>Kiểm tra</button></div>
    ${r!==undefined?`<div class="explain ${r?'ok':'bad'}">${r?'Chính xác!':'Đáp án: <b>'+esc(it[1][0])+'</b>'}</div><button class="b3 lime" style="margin-top:12px" data-act="gapnext">${V.i<V.items.length-1?'Câu tiếp':'Xem kết quả'}</button>`:''}</div>`};

/* =====================================================================
   VOCAB & GRAMMAR stations
   ===================================================================== */
function openSet(id,base={}){const s=VOCAB.find(x=>x.id===id);go('vset',Object.assign({set:id,mode:'card',ci:0,flip:false,qz:makeVQuiz(s),qi:0,qsel:null,qscore:0},base))}
function makeVQuiz(s){return shuffle(s.words).map(w=>{const others=shuffle(s.words.filter(x=>x!==w)).slice(0,3);const opts=shuffle([w,...others]);return{w,opts:opts.map(o=>o[2]),a:opts.indexOf(w)}})}
VIEWS.vset=()=>{const s=VOCAB.find(x=>x.id===V.set);
  const tabs=actHead(s.bookName+' · '+s.unit)+`<div class="tabs">${[['card','1 · Thẻ ghi nhớ'],['quiz','2 · Trắc nghiệm'],['spell','3 · Đánh vần']].map(([k,l])=>`<button aria-selected="${V.mode===k}" data-act="vmode" data-arg="${k}">${l}</button>`).join('')}</div>`;
  if(V.mode==='card'){const w=s.words[V.ci];const kn=!!S.known[w[0]];
    return tabs+`<div class="flash-wrap"><button class="flash ${V.flip?'flip':''}" data-act="flip" aria-label="Lật thẻ">
      <div class="face front"><span class="pos">${V.ci+1}/${s.words.length} · ${w[1]}</span><span class="w">${esc(w[0])}</span><span class="pos">Chạm để lật</span></div>
      <div class="face back"><span class="w" style="font-size:clamp(1.4rem,5vw,2.2rem)">${esc(w[2])}</span><span class="ex">"${esc(w[3])}"</span></div></button>
     <div class="flash-ctl"><button class="b3 ghost sm" data-act="card" data-arg="-1">${ICON.back}Trước</button><button class="b3 sky sm" data-act="say" data-arg="${esc(w[0])}">${ICON.sound}Nghe</button>
      <button class="b3 ${kn?'lime':'gold'} sm" data-act="known" data-arg="${esc(w[0])}">${kn?'Đã thuộc ✓':'Đánh dấu đã thuộc'}</button><button class="b3 ghost sm" data-act="card" data-arg="1">Tiếp →</button></div>
     <p class="hint" style="text-align:center;color:var(--rose)">Học xong thẻ, làm Trắc nghiệm hoặc Đánh vần để nhận sao.</p></div>`}
  const q=V.qz;
  if(V.qi>=q.length)return tabs+actResult(Math.round(V.qscore/q.length*100));
  const it=q[V.qi];
  if(V.mode==='quiz'){
    return tabs+`<div class="panel" style="max-width:640px;margin:0 auto"><div class="prog"><i style="width:${V.qi/q.length*100}%"></i></div>
     <div class="muted">Câu ${V.qi+1}/${q.length} · Chọn nghĩa đúng</div><div class="bigq">${esc(it.w[0])} <button class="b3 ghost sm" data-act="say" data-arg="${esc(it.w[0])}" aria-label="Nghe">${ICON.sound}</button></div>
     <div class="opts">${it.opts.map((o,j)=>{let c='';if(V.qsel!==null){if(j===it.a)c='ok';else if(j===V.qsel)c='bad'}return`<button class="opt ${c}" data-act="vpick" data-arg="${j}" ${V.qsel!==null?'disabled':''}><b>${L[j]}</b>${esc(o)}</button>`}).join('')}</div>
     ${V.qsel!==null?`<div class="explain ${V.qsel===it.a?'ok':'bad'}"><i>"${esc(it.w[3])}"</i></div><button class="b3 lime" style="margin-top:12px" data-act="vnext">Câu tiếp</button>`:''}</div>`}
  const hint=it.w[0][0]+it.w[0].slice(1).replace(/[a-z]/gi,'_');
  return tabs+`<div class="panel" style="max-width:640px;margin:0 auto"><div class="prog"><i style="width:${V.qi/q.length*100}%"></i></div>
   <div class="muted">Câu ${V.qi+1}/${q.length} · Viết từ tiếng Anh</div><div class="bigq">${esc(it.w[2])}</div>
   <p style="font-family:var(--display);letter-spacing:4px;font-size:1.3rem;margin:0 0 10px">${esc(hint)}</p>
   <div class="row"><input class="gap ${V.qsel===null?'':(V.qsel?'ok':'bad')}" id="spellin" autocomplete="off" aria-label="Nhập từ" ${V.qsel!==null?'disabled':''} value="${esc(V.spv||'')}"><button class="b3 lime sm" data-act="spellcheck" ${V.qsel!==null?'disabled':''}>Kiểm tra</button></div>
   ${V.qsel!==null?`<div class="explain ${V.qsel?'ok':'bad'}">${V.qsel?'Chính xác!':'Đáp án: <b>'+esc(it.w[0])+'</b>'} — <i>${esc(it.w[3])}</i></div><button class="b3 lime" style="margin-top:12px" data-act="vnext">Câu tiếp</button>`:''}</div>`};
VIEWS.gtopic=()=>{const g=GRAMMAR.find(x=>x.id===V.g);const q=V.q;
  const head=actHead(g.tag)+`<div class="rule">${g.rule}</div>`;
  if(V.qi>=q.length)return head+actResult(Math.round(V.qscore/q.length*100));
  const it=q[V.qi];
  return head+`<div class="panel" style="max-width:700px;margin:0 auto"><div class="prog"><i style="width:${V.qi/q.length*100}%"></i></div><div class="muted">Câu ${V.qi+1}/${q.length}</div>
   <div class="bigq">${esc(it[0]).replace('___','<span style="color:var(--red)">_____</span>')}</div>
   <div class="opts">${it[1].map((o,j)=>{let c='';if(V.qsel!==null){if(j===it[2])c='ok';else if(j===V.qsel)c='bad'}return`<button class="opt ${c}" data-act="gpick" data-arg="${j}" ${V.qsel!==null?'disabled':''}><b>${L[j]}</b>${esc(o)}</button>`}).join('')}</div>
   ${V.qsel!==null?`<div class="explain ${V.qsel===it[2]?'ok':'bad'}"><b>${V.qsel===it[2]?'Chính xác!':'Chưa đúng.'}</b> ${esc(it[3])}</div><button class="b3 lime" style="margin-top:12px" data-act="gnext">Câu tiếp</button>`:''}</div>`};

/* =====================================================================
   LUYỆN ĐỀ (exam-skill rooms)
   ===================================================================== */
function bestPct(ex,sk){const b=S.best[ex+'.'+sk];return b?b.pct:0}
VIEWS.drill=()=>{const deco=[DRIP+doo('heart','#d7192a','top:60px;right:14px'),doo('rainbow','','top:58px;left:10px'),doo('leaf','#5fb526','top:62px;right:16px')];
  return`<div class="sec-title"><h2>Luyện Đề Theo Kỹ Năng</h2><span class="muted">Dạng bài sát đề thi, có đồng hồ</span></div>
  ${porch(`<div class="booths">${EXAM_ORDER.map((k,i)=>{const e=EXAMS[k];return`<article class="booth" style="--tilt:${e.tilt}">${deco[i]}
    <div class="booth-top"><h3>${e.name}</h3><span class="lvb">${e.level}</span></div>
    <button class="window" data-act="room" data-arg="${e.id}|listening"><span class="ws">${e.sub}</span><span class="wsub">Bấm để vào phòng luyện</span></button>
    <div class="shelf"></div>
    <div class="bskills">${SKILLS.map(s=>{const p=bestPct(e.id,s.id);return`<button class="bsk" style="--c:${s.c}" data-act="room" data-arg="${e.id}|${s.id}">${ICON[s.id]}${s.vi}<small>${p?p+'%':'—'}</small></button>`}).join('')}</div></article>`}).join('')}</div>`)}`};
function startRoom(ex,sk){go('room',{ex,sk,ans:{},done:false,plays:{},left:EXAMS[ex].time[sk]*60,wi:0,sp:{i:0,phase:'idle',left:0,stars:{}}})}
VIEWS.room=()=>{const e=EXAMS[V.ex];
  return`<div class="roomhead"><button class="b3 ghost sm" data-act="go" data-arg="drill">${ICON.back}Luyện đề</button>
   <div><h2>${e.name} <span class="tag" style="background:var(--navy)">${e.level}</span></h2><div class="muted" style="font-size:.88rem">${e.sub}</div></div>
   ${V.sk!=='speaking'?`<div class="timer" id="timer">${fmt(V.left)}</div>`:''}</div>
   <div class="tabs" role="tablist">${SKILLS.map(s=>`<button role="tab" aria-selected="${s.id===V.sk}" data-act="room" data-arg="${e.id}|${s.id}">${ICON[s.id]}${s.vi}</button>`).join('')}</div>`+ROOM[V.sk](e)};
function resultBox(score,total,extra=''){const pct=Math.round(score/total*100);
  return`<div class="result"><div><div class="big">${score}/${total}</div><div class="muted">${pct}% · +${score*10} XP · +${score} xu</div></div>
   <div class="stars">${starRow(starsOf(pct))}</div><div class="sp"></div>${extra}<button class="b3 sky sm" data-act="retry">Làm lại</button></div>`}
function mcq(i,it,letters=L){const sel=V.ans[i];
  return`<div class="opts">${it.opts.map((o,j)=>{let cls='';if(V.done){if(j===it.a)cls='ok';else if(sel===j)cls='bad'}
   return`<button class="opt ${cls}" data-act="pick" data-arg="${i}|${j}" aria-pressed="${sel===j}" ${V.done?'disabled':''}><b>${letters[j]}</b>${esc(o)}</button>`}).join('')}</div>`}
function player(key,label){const used=V.plays[key]||0;
  return`<div class="player" id="pl-${key}"><button class="b3 sm" data-act="listen" data-arg="${key}" ${used>=2&&!V.done?'disabled':''}>${ICON.play}${used?'Nghe lại':'Phát'}</button>
   <div class="wave">${'<i></i>'.repeat(9)}</div><span class="muted" style="font-size:.85rem">${label} · đã nghe ${used}/2${V.done?' (đã nộp: nghe tự do)':''}</span></div>`}
function scriptBox(lines){return`<div class="script">${lines.map(([s,t])=>`<p><b>${esc(s)}:</b> ${esc(t)}</p>`).join('')}</div>`}
const ROOM={};
ROOM.listening=e=>{const L1=e.listening;let body='';
  if(L1.mode==='each')body=L1.items.map((it,i)=>`<div class="q"><div class="qt"><span class="qn">${i+1}</span>${esc(it.q)}</div>${player(i,'Đoạn '+(i+1))}${mcq(i,it)}${V.done?scriptBox(it.script):''}</div>`).join('');
  else body=player('all','Toàn bộ đoạn ghi âm')+`<div class="q" style="background:var(--white)"><h3 style="color:var(--red);margin-bottom:10px">Riverside Youth Centre · Summer English Club</h3>
     ${L1.items.map((it,i)=>{const v=V.ans[i]||'';const ok=V.done&&isGap(v,it.a);
      return`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px"><span class="qn">${i+1}</span><label for="g${i}" style="min-width:170px;font-weight:700">${esc(it.q)}</label>
       <input id="g${i}" class="gap ${V.done?(ok?'ok':'bad'):''}" data-gap="${i}" value="${esc(v)}" ${V.done?'disabled':''} autocomplete="off">
       ${V.done&&!ok?`<span style="color:var(--red);font-weight:800">→ ${esc(it.a[0])}</span>`:''}</div>`}).join('')}</div>${V.done?scriptBox(L1.script):''}`;
  return`${V.done?resultBox(V.score,L1.items.length):''}<div class="panel" style="padding:12px 16px;margin-bottom:12px"><span class="muted">${L1.intro}</span></div>${body}
   ${V.done?'':`<button class="b3 lime" data-act="submit">Nộp bài</button>`}`};
ROOM.reading=e=>{const R=e.reading;const tfng=R.tfng;const opts=['TRUE','FALSE','NOT GIVEN'];
  const qs=R.items.map((it,i)=>{const o=tfng?{opts,a:it.a}:it;return`<div class="q"><div class="qt"><span class="qn">${i+1}</span>${esc(it.q)}</div>${mcq(i,o,tfng?['T','F','NG']:L)}</div>`}).join('');
  return`${V.done?resultBox(V.score,R.items.length):''}<div class="cols"><article class="passage"><h3>${R.title}</h3>${R.passage}</article>
   <div>${R.intro?`<div class="panel" style="padding:10px 14px;margin-bottom:10px"><span class="muted">${R.intro}</span></div>`:''}${qs}${V.done?'':`<button class="b3 lime" data-act="submit">Nộp bài</button>`}</div></div>`};
function chartSVG(){const d=[['Gaming',70],['Sport',55],['Music',45],['Reading',30]];const W=360,H=200,x0=40,max=80;
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H+30}" style="width:100%;max-width:420px;display:block;margin:10px 0" role="img" aria-label="Biểu đồ cột: Gaming 70, Sport 55, Music 45, Reading 30">
  ${[0,20,40,60,80].map(v=>{const y=H-v/max*(H-20);return`<line x1="${x0}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#efd2d4"/><text x="${x0-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#76626a">${v}</text>`}).join('')}
  ${d.map(([l,v],i)=>{const bw=50,gx=x0+18+i*78,h=v/max*(H-20);return`<rect x="${gx}" y="${H-h}" width="${bw}" height="${h}" rx="6" fill="${['#d7192a','#1b2a6b','#f28a1d','#14a99c'][i]}"/><text x="${gx+bw/2}" y="${H-h-5}" font-size="12" font-weight="700" text-anchor="middle" fill="#2a1a22">${v}</text><text x="${gx+bw/2}" y="${H+16}" font-size="12" text-anchor="middle" fill="#2a1a22">${l}</text>`}).join('')}
  <text x="10" y="12" font-size="10" fill="#76626a">students</text></svg></div>`}
ROOM.writing=e=>{const tasks=e.writing;const t=tasks[V.wi];const key=e.id+'.w'+V.wi;const txt=S.drafts[key]||'';const res=V.wres&&V.wres[V.wi];
  return`<div class="steps" style="gap:8px">${tasks.map((x,i)=>`<button class="b3 ${i===V.wi?'gold':'ghost'} sm" data-act="wtask" data-arg="${i}">${esc(x.title)}</button>`).join('')}</div>
   <div class="cols"><div class="task"><h3>${esc(t.title)}</h3>${t.task}${t.chart?chartSVG():''}</div>
   <div class="panel"><label for="wtext" class="muted" style="font-weight:700">Bài làm của bạn (tự động lưu nháp)</label>
    <textarea id="wtext" data-wkey="${key}" placeholder="Bắt đầu viết bằng tiếng Anh tại đây…">${esc(txt)}</textarea>
    <div class="wc"><span id="wcn">${words(txt)}</span>/${t.min} từ<div class="track"><i id="wcbar" style="width:${Math.min(100,words(txt)/t.min*100)}%" class="${words(txt)>=t.min?'done':''}"></i></div></div>
    <ul class="checks" id="wchecks">${checks(t,txt)}</ul>
    <div class="row"><button class="b3 lime" data-act="wsubmit">Chấm thử</button><button class="b3 ghost sm" data-act="wmodel">${V.showModel?'Ẩn':'Xem'} bài mẫu</button></div>
    ${res?`<div class="explain ${res.pct>=60?'ok':'bad'}" style="margin-top:12px"><b>Ước lượng: ${res.pct}%</b><br>${res.notes.join('<br>')}<br><span class="muted">Điểm tự động theo tiêu chí cơ bản. Thầy cô sẽ chấm chi tiết hơn.</span></div>`:''}
    ${V.showModel?`<div class="model"><b>Bài mẫu tham khảo</b><p>${esc(t.model)}</p></div>`:''}</div></div>`};
const avgStar=i=>{const s=V.sp.stars[i]||{};const v=Object.values(s);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
ROOM.speaking=e=>{const sp=V.sp;const items=e.speaking;const it=items[sp.i];
  const steps=`<div class="steps">${items.map((x,i)=>`<span class="${i===sp.i?'on':(sp.stars[i]?'done':'')}">${x.part} · ${x.title}</span>`).join('')}</div>`;
  if(sp.phase==='end'){const tot=items.reduce((a,_,i)=>a+avgStar(i),0);const sc=Math.round(tot/items.length*10)/10;
    return steps+`<div class="result"><div><div class="big">${sc}/5</div><div class="muted">Điểm tự đánh giá trung bình</div></div><div class="sp"></div><button class="b3 sky sm" data-act="retry">Luyện lại</button></div>`}
  const R=2*Math.PI*64;const total=sp.phase==='prep'?it.prep:it.talk;const frac=sp.phase==='idle'||sp.phase==='rate'?1:sp.left/total;
  return steps+`<div class="cols"><div class="task"><h3>${it.part} · ${it.title}</h3>${it.prompt}<p class="hint">Chuẩn bị ${it.prep} giây · Nói ${it.talk} giây</p></div>
   <div class="panel" style="text-align:center">
    <div class="ring-timer"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="#f6e4e5" stroke-width="12" fill="none"/><circle id="ringc" cx="75" cy="75" r="64" stroke="${sp.phase==='talk'?'#d7192a':'#2f9ae0'}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-frac)}"/></svg>
     <div id="ringt">${sp.phase==='prep'||sp.phase==='talk'?sp.left:(sp.phase==='rate'?'✓':it.prep)}<small>${({idle:'sẵn sàng',prep:'chuẩn bị',talk:'đang nói',rate:'tự chấm'})[sp.phase]}</small></div></div>
    ${sp.phase==='idle'?`<button class="b3 sky" data-act="spstart">Bắt đầu chuẩn bị</button>`:''}
    ${sp.phase==='prep'?`<button class="b3" data-act="sptalk">Nói ngay</button>`:''}

function buildChallenge(code){const rnd=mulberry(hash(code));
  const G=GRAMMAR.flatMap(t=>t.items.map(it=>({q:it[0],opts:it[1],a:it[2]})));const Vw=VOCAB.flatMap(s=>s.words.map(w=>({w,s})));
  const gs=shuffle(G,rnd).slice(0,6).map(x=>{const idx=shuffle([0,1,2,3],rnd);return{q:x.q,opts:idx.map(i=>x.opts[i]),a:idx.indexOf(x.a)}});
  const vs=shuffle(Vw,rnd).slice(0,4).map(({w,s})=>{const others=shuffle(s.words.filter(x=>x!==w),rnd).slice(0,3);const opts=shuffle([w,...others],rnd);return{q:'"'+w[0]+'" nghĩa là gì?',opts:opts.map(o=>o[2]),a:opts.indexOf(w)}});
  return shuffle([...gs,...vs],rnd)}
function newCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}

  case'cbhide':E.hideTime=!E.hideTime;$('#exam').innerHTML=VIEWS.test();break;
  case'cbchoice':{const[pi,j]=arg.split('|').map(Number);E.wchoice[pi]=j;$('#exam').innerHTML=VIEWS.test();break}
  case'cbplay':{const pi=+arg;const part=paperOf().parts[pi];if((E.played[pi]&&!E.review)||E.playing!=null)break;E.played[pi]=true;E.playing=pi;
    const lines=[];part.audio.forEach(s=>{lines.push(['Narrator',s.label]);lines.push(...s.lines);lines.push(['Narrator','Now listen again.']);lines.push(...s.lines)});
    lines.push(['Narrator','That is the end of '+part.title+'.']);E.playMsg='Đang phát '+part.title+' (mỗi đoạn 2 lần)…';
    $('#exam').innerHTML=VIEWS.test();
    speakLines(lines,()=>{if(!E)return;E.playing=null;if(V.name==='test'&&E.part===pi){const a2=$('#aud');if(a2){a2.classList.remove('on');$('#audst').textContent=E.review?'Chế độ xem lại.':'Đã phát xong phần này.';const b=a2.querySelector('.pbtn');b.textContent=E.review?'Nghe lại':'Đã phát';b.disabled=!E.review}}});
    if(!hasTTS)toast('Trình duyệt không hỗ trợ đọc tự động. Hãy dùng Chrome hoặc Edge.');break}
  case'cbfinish':E.modal=true;E.timeup=false;$('#exam').innerHTML=VIEWS.test();break;
  case'cbcancel':E.modal=false;$('#exam').innerHTML=VIEWS.test();break;
  case'cbsubmit':finishMock();break;
  case'cbreview':E.review=true;E.part=0;E.playing=null;go('test');break;
  case'cbexit':go('mockres');break;
  case'spgo':spAsk();break;
  case'spans':spAnswer();break;
  case'spskip':spNext();break;
  case'sprep':{clearInterval(tick);const t=spTurns()[E.si];E.sphase='ask';render();speakLines([['Examiner',t.say]],()=>{if(V.name==='speak'&&E.sphase==='ask')spAnswer()});break}
  case'sptext':E.showText=!E.showText;render();break;
  case'spquit':clearInterval(tick);stopSpeak();go('mock');break;
  case'srt':{const[k,n]=arg.split('|');E.rate[k]=+n;render();break}
  case'spdone':{const sum=CRIT.reduce((a,[k])=>a+E.rate[k],0);const pct=Math.round(sum/20*100);const p=paperOf();
    E.result={rows:CRIT.map(([k,en])=>({title:en,score:E.rate[k],total:5})),got:sum,tot:20,pct};
    S.name=E.name;S.mocks.push({exam:E.exam,short:MOCK[E.exam].short,paper:p.name,paperId:p.id,name:E.name,pct,grade:gradeOf(E.exam,pct)[1],at:Date.now()});badge('mock');reward(pct,Math.round(pct/5));go('mockres');break}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg,b)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.gap!==undefined)V.ans[t.dataset.gap]=t.value;
  if(t.id==='din')V.val=t.value;
  if(t.id==='wtext'){S.drafts[t.dataset.wkey]=t.value;save();const ex=EXAMS[V.ex].writing[V.wi];const n=words(t.value);
    $('#wcn').textContent=n;const bar=$('#wcbar');bar.style.width=Math.min(100,n/ex.min*100)+'%';bar.classList.toggle('done',n>=ex.min);$('#wchecks').innerHTML=checks(ex,t.value)}
  if(t.id==='ltext'){S.drafts[t.dataset.lkey]=t.value;save();const lt=LETTERS[V.L];const n=words(t.value);
    $('#lcn').textContent=n;const bar=$('#lcbar');bar.style.width=Math.min(100,n/lt.min*100)+'%';bar.classList.toggle('done',n>=lt.min);$('#lchecks').innerHTML=checks(lt,t.value)}
  if(E&&t.dataset.cb!==undefined&&t.tagName==='INPUT'){E.ans[+t.dataset.cb]=t.value;updateNav()}
  if(E&&t.dataset.cbw!==undefined){E.ans[+t.dataset.cbw]=t.value;const w=$('#wc-'+t.dataset.cbw);if(w)w.textContent=words(t.value);updateNav()}
});
document.addEventListener('change',e=>{const t=e.target;if(E&&t.tagName==='SELECT'&&t.dataset.cb!==undefined){E.ans[+t.dataset.cb]=t.value===''?undefined:+t.value;updateNav()}});
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag]');if(t){V.sel=+t.dataset.drag;try{e.dataTransfer.setData('text/plain',t.dataset.drag)}catch(x){}}});
document.addEventListener('dragover',e=>{const b=e.target.closest('[data-drop]');if(b){e.preventDefault();b.classList.add('over')}});
document.addEventListener('dragleave',e=>{const b=e.target.closest('[data-drop]');if(b)b.classList.remove('over')});
document.addEventListener('drop',e=>{const b=e.target.closest('[data-drop]');if(b&&V.kind==='sort'){e.preventDefault();act('sdrop',b.dataset.drop)}});
render();
</script>
