<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Phòng Thi IVY English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Oswald:wght@400;600&family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: red-and-white craft porch — sticker command bar, porch stage with cardboard booths, level maps of stations; exam mode switches to a plain computer-test screen. One deliberate light look. */
:root{
  --red:#d7192a; --red-d:#9c0e1b; --red-l:#ff6b74; --rose:#ffe4e6; --cream:#fffaf6; --white:#ffffff;
  --navy:#1b2a6b; --navy-d:#0f1946; --teal:#14a99c; --teal-d:#0b7268; --orange:#f28a1d; --orange-d:#b35d00;
  --lime:#5fb526; --lime-d:#3d7a12; --sky:#2f9ae0; --sky-d:#1b67a0; --gold:#f4c13d; --gold-d:#b98a08; --grape:#8a4fd6;
  --ink:#2a1a22; --muted:#76626a; --kraft:#efdfc4; --kraft-2:#e3cca6; --kraft-d:#b8976a; --line:#efd2d4; --track:#f6e4e5;
  --ok-bg:#e3f6da; --bad-bg:#fde3e1;
  --cb-navy:#1d2650; --cb-bg:#eef0f5; --cb-line:#c8cee0; --cb-blue:#2c5fd3; --cb-text:#1b2134; --cb-sel:#dfe8ff;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Patrick Hand","Comic Sans MS",cursive;
  --exam:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--red);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:var(--red)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3,h4,.disp{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.logo{display:flex;flex-direction:column;align-items:stretch;gap:3px;background:#fdf3c4;border:0;border-radius:8px;padding:6px 8px 5px;box-shadow:0 5px 0 var(--red-d);font-family:"Oswald","Arial Narrow",Arial,sans-serif}
.logo .lg-box{display:block;background:#cc0a14;color:#fdf3c4;font-weight:600;font-size:1.7rem;line-height:1.25;letter-spacing:.38em;padding:0 .2em 0 .58em;text-align:center}
.logo .lg-en{display:block;color:#cc0a14;font-weight:400;font-size:1.12rem;line-height:1;letter-spacing:.07em;text-align:center}
.nav{display:flex;flex-wrap:wrap;gap:10px;flex:1}
.stk{--c:var(--red);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:86px;height:78px;border-radius:18px;background:var(--c);border:4px solid var(--white);box-shadow:0 5px 0 rgba(80,0,10,.35);color:var(--white);font-family:var(--display);font-weight:800;font-size:.74rem;letter-spacing:.3px;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .12s}
.stk svg{width:30px;height:30px}
.stk:hover{transform:translateY(-2px) rotate(-2deg)}
.stk[aria-current="true"]{transform:translateY(-3px) rotate(-3deg);box-shadow:0 0 0 4px var(--gold),0 6px 0 rgba(80,0,10,.35)}
.stk .new{position:absolute;top:-10px;right:-10px;background:var(--gold);color:var(--ink);font-size:.6rem;padding:1px 6px;border-radius:6px;text-shadow:none;transform:rotate(12deg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;border-radius:999px;background:var(--white);color:var(--ink);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--red-d)}
.chip i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:.72rem;color:var(--white)}
.chip small{display:block;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;line-height:1}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--white);border:0;color:var(--red);display:grid;place-items:center;box-shadow:0 3px 0 var(--red-d)}

/* buttons */
.b3{--c:var(--red);--d:var(--red-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:0;border-radius:14px;background:var(--c);box-shadow:0 5px 0 var(--d);font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.3px;text-transform:uppercase;transition:transform .08s,box-shadow .08s;color:var(--white)}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.b3[disabled]{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.b3.lime{--c:var(--lime);--d:var(--lime-d)}
.b3.gold{--c:var(--gold);--d:var(--gold-d);color:var(--ink)}
.b3.sky{--c:var(--sky);--d:var(--sky-d)}
.b3.navy{--c:var(--navy);--d:var(--navy-d)}
.b3.teal{--c:var(--teal);--d:var(--teal-d)}
.b3.ghost{--c:var(--white);--d:#e2c7ca;color:var(--red);border:2px solid var(--line)}
.b3.sm{padding:7px 12px;font-size:.85rem;border-radius:11px}

.panel{background:var(--cream);border:4px solid var(--white);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(80,0,10,.28)}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:8px;font-weight:800;font-family:var(--display);font-size:.85rem;color:var(--white)}
.sec-title{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:8px;color:var(--white)}
.sec-title h2{font-size:2.1rem;text-shadow:0 3px 0 var(--red-d)}
.sec-title .muted{color:var(--rose)}
.hint{font-size:.85rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}

/* porch stage */
.porch{position:relative;border-radius:14px;overflow:hidden;border:6px solid var(--white);box-shadow:0 10px 0 rgba(80,0,10,.3);background:repeating-linear-gradient(180deg,#fffaf3 0 30px,#f1e1d6 30px 32px);padding:96px 18px 0}
.porch::before{content:"";position:absolute;left:0;right:0;top:0;height:26px;background:linear-gradient(180deg,var(--red),var(--red-d))}
.porch .post{position:absolute;top:26px;bottom:0;width:18px;background:linear-gradient(90deg,#fff,#e9dfe6)}
.porch .post.l{left:10px}.porch .post.r{right:10px}
.bunting{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:space-around;padding:0 26px;pointer-events:none}
.bunting::before{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:var(--red-d);opacity:.5}
.flag{position:relative;width:clamp(20px,3.6vw,40px);aspect-ratio:4/5;background-color:var(--f);background-image:radial-gradient(circle,rgba(255,255,255,.65) 1.5px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.4) 3px,transparent 3.5px);background-size:8px 8px,16px 16px;clip-path:polygon(0 0,100% 0,100% 80%,84% 100%,67% 80%,50% 100%,33% 80%,16% 100%,0 80%);transform:rotate(var(--r));margin-top:var(--y)}
.flag.w{background-image:radial-gradient(circle,rgba(215,25,42,.5) 1.5px,transparent 2px),radial-gradient(circle,rgba(215,25,42,.3) 3px,transparent 3.5px);box-shadow:inset 0 0 0 2px #f2c9cc}
.booths{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;align-items:end}
.floor{position:relative;height:30px;margin:0 -18px;background:linear-gradient(180deg,#e8d6c7,#d8c2ae);border-top:3px solid #cdb39a}
.booth{position:relative;background:var(--kraft);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 9px);border-radius:8px 8px 3px 3px;padding:16px 16px 14px;transform:rotate(var(--tilt,0deg));box-shadow:7px 8px 0 rgba(90,50,20,.15),inset 0 0 0 2px var(--kraft-2);transition:transform .2s}
.booth:hover{transform:rotate(0) translateY(-4px)}
.booth .drip{position:absolute;left:0;top:-2px;width:100%;height:46px}
.doo{position:absolute;pointer-events:none}
.booth-top{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.booth-top h3{font-size:clamp(1.6rem,3vw,2.1rem);color:var(--red);letter-spacing:1px;-webkit-text-stroke:1px var(--red-d);text-shadow:3px 3px 0 var(--white);text-align:center}
.lvb{font-family:var(--display);font-weight:800;color:var(--white);background:var(--navy);padding:1px 9px;border-radius:8px;border:2px solid var(--white);transform:rotate(6deg)}
.window{position:relative;display:block;width:100%;border:0;border-radius:4px;background:#5a4130;padding:18px 26px;min-height:110px;box-shadow:inset 0 6px 0 rgba(0,0,0,.25);color:var(--white);text-align:center}
.window::before,.window::after{content:"";position:absolute;top:0;bottom:0;width:22px;background:repeating-linear-gradient(90deg,var(--red) 0 6px,var(--red-l) 6px 10px);border-radius:0 0 40% 0}
.window::before{left:0}.window::after{right:0;transform:scaleX(-1)}
.window .ws{font-family:var(--hand);font-size:1.15rem;line-height:1.25}
.window .wsub{display:block;font-size:.8rem;color:#f3d9c6;margin-top:6px}
button.window:hover .ws{color:var(--gold)}
.shelf{height:12px;margin:0 -10px;background:#b47a45;border-radius:3px;box-shadow:0 5px 0 #8a5a2e}
.bskills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.bsk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:3px solid var(--white);background:var(--c);color:var(--white);font-family:var(--display);font-weight:800;font-size:.8rem;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bsk svg{width:22px;height:22px}
.bsk small{font-family:var(--body);font-size:.66rem;font-weight:700}
.lvstat{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:800;font-size:.9rem}
.lvstat .pbar{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden}
.lvstat .pbar i{display:block;height:100%;background:var(--red)}
.lvtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.lvtags span{font-size:.72rem;font-weight:800;background:var(--white);border-radius:6px;padding:1px 7px;color:var(--navy)}
.tickets{display:grid;gap:8px;margin-top:12px}
.ticket{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:var(--white);color:var(--ink);text-align:left;box-shadow:0 3px 0 var(--kraft-d);position:relative}
.ticket::before{content:"";position:absolute;left:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--kraft)}
.ticket .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--white);flex:none}
.ticket .ti svg{width:22px;height:22px}
.ticket b{font-family:var(--display);font-size:1rem;display:block;line-height:1.1}
.ticket small{color:var(--muted);font-weight:700}
.ticket .go{margin-left:auto;color:var(--red);font-family:var(--display);font-weight:800}
.ticket:hover{transform:translateX(3px)}
.ticket .best{display:block;font-size:.75rem;font-weight:800;color:var(--lime-d)}

.dock{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;margin-top:18px}
.mascot{display:flex;gap:12px;align-items:center}
.mascot svg{flex:none;width:76px;height:96px}
.bubble{position:relative;background:var(--white);border:3px dashed var(--red-l);border-radius:16px;padding:10px 14px;font-family:var(--hand);font-size:1.1rem;line-height:1.3;color:var(--navy)}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted var(--line)}
.mission:last-child{border-bottom:0}
.mission .bar2{flex:1;min-width:0}
.mission .bar2 div{height:8px;border-radius:9px;background:var(--track);margin-top:4px;overflow:hidden}
.mission .bar2 i{display:block;height:100%;background:var(--lime)}
.dockcard h3{font-size:1.25rem;margin-bottom:6px;color:var(--red)}

/* level map */
.lvhead{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.chests{display:flex;gap:10px;flex-wrap:wrap}
.chest{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0;font-weight:800;font-size:.75rem;color:var(--muted)}
.chest svg{width:52px;height:46px}
.chest.ready svg{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.map{position:relative;max-width:680px;margin:16px auto 0;padding:10px 0 20px}
.node{display:flex;align-items:center;gap:14px;margin-left:var(--x);width:max-content;max-width:calc(100% - var(--x))}
.link{width:0;height:26px;border-left:4px dotted rgba(255,255,255,.75);margin-left:calc(var(--x) + 34px)}
.stkr{position:relative;flex:none;width:72px;height:72px;border-radius:50%;border:5px solid var(--white);background:var(--c);color:var(--white);display:grid;place-items:center;box-shadow:0 6px 0 rgba(80,0,10,.35)}
.stkr svg{width:34px;height:34px}
.stkr.done{box-shadow:0 0 0 4px var(--gold),0 6px 0 rgba(80,0,10,.35)}
.stkr.next{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.nlabel{background:var(--white);border-radius:14px;padding:6px 12px 8px;box-shadow:0 4px 0 rgba(80,0,10,.25);min-width:0}
.nlabel b{display:block;font-family:var(--display);font-size:1.02rem;line-height:1.15}
.nlabel small{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--c)}
.nstars{display:flex;gap:1px;margin-top:2px}
.nstars svg{width:16px;height:16px}
.go-flag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:800;font-size:.7rem;padding:0 7px;border-radius:6px;white-space:nowrap}

/* practice room */
.roomhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px;color:var(--white)}
.roomhead h2{font-size:1.8rem;text-shadow:0 3px 0 var(--red-d)}
.roomhead .muted{color:var(--rose)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:12px;border:3px solid var(--white);background:rgba(255,255,255,.18);color:var(--white);font-weight:800;display:flex;gap:6px;align-items:center}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:var(--white);color:var(--red)}
.timer{margin-left:auto;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:4px 14px;border-radius:12px;background:var(--white);color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--white);background:var(--navy)}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start}
.cols>*{min-width:0}
.passage{background:var(--white);border-radius:18px;padding:20px 22px;font-size:1rem;line-height:1.7;max-height:72vh;overflow:auto;border:4px solid var(--white);box-shadow:0 6px 0 rgba(80,0,10,.28),inset 0 0 0 1px var(--line)}
.passage h3{color:var(--red);margin-bottom:8px}
.passage p{margin:0 0 .8em}
.q{padding:14px;border-radius:16px;background:var(--cream);border:3px solid var(--white);margin-bottom:10px;box-shadow:0 4px 0 rgba(80,0,10,.2)}
.q .qt{font-weight:800;margin-bottom:8px;display:flex;gap:8px}
.qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--red);color:var(--white);display:grid;place-items:center;font-family:var(--display);font-size:.9rem}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--white)}
.opt b{flex:none;width:24px;height:24px;border-radius:7px;background:var(--rose);color:var(--red);display:grid;place-items:center;font-family:var(--display);font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--sky);background:#e4f2ff}
.opt.ok{border-color:var(--lime);background:var(--ok-bg)}
.opt.bad{border-color:var(--red);background:var(--bad-bg)}
.opts.ipa .opt{font-size:1.15rem;justify-content:center}
.gap{width:100%;max-width:240px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--white);color:var(--ink)}
.gap.ok{border-color:var(--lime);background:var(--ok-bg)}.gap.bad{border-color:var(--red);background:var(--bad-bg)}
.player{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--rose);border:2px dashed var(--red-l);margin-bottom:10px;flex-wrap:wrap}
.wave{display:flex;gap:3px;align-items:flex-end;height:24px}
.wave i{width:4px;background:var(--red);border-radius:3px;height:30%}
.playing .wave i{animation:wv .8s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.4s}
@keyframes wv{50%{height:100%}}
.script{font-size:.88rem;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.script p{margin:0 0 4px}
.result{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px;border-radius:18px;background:var(--white);border:4px solid var(--gold);margin-bottom:14px;box-shadow:0 6px 0 var(--gold-d)}
.result .big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--red);line-height:1}
.stars{display:flex;gap:4px}
.stars svg{width:30px;height:30px}
.task{background:var(--white);border-radius:18px;padding:18px 20px;border:4px solid var(--white);box-shadow:0 6px 0 rgba(80,0,10,.28),inset 0 0 0 1px var(--line)}
.task h3{color:var(--red);margin-bottom:6px}
.task ul{margin:6px 0;padding-left:20px}
.quote{background:var(--rose);padding:10px 12px;border-radius:10px}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.scene{background:var(--rose);border-radius:12px;padding:10px;font-size:.85rem;font-weight:700}
.scene b{display:block;font-family:var(--display);color:var(--red)}
textarea{width:100%;min-height:220px;padding:14px;border-radius:16px;border:3px solid var(--white);background:var(--white);color:var(--ink);line-height:1.6;resize:vertical;box-shadow:inset 0 0 0 2px var(--line)}
.wc{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:800;font-variant-numeric:tabular-nums}
.wc .track{flex:1;height:10px;border-radius:9px;background:var(--track);overflow:hidden}
.wc .track i{display:block;height:100%;background:var(--red-l);transition:width .2s}
.wc .track i.done{background:var(--lime)}
.checks{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;align-items:center;font-size:.9rem}
.checks li span{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--white);display:grid;place-items:center;font-size:.75rem;flex:none}
.checks li.on span{background:var(--lime);border-color:var(--lime);color:var(--white)}
.model{margin-top:12px;padding:14px;border-radius:14px;background:var(--ok-bg);border:2px solid var(--lime)}
.model p{margin:0 0 .6em;white-space:pre-line}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps span{padding:4px 12px;border-radius:9px;background:rgba(255,255,255,.2);color:var(--white);border:2px solid var(--white);font-weight:800;font-size:.85rem}
.steps span.on{background:var(--white);color:var(--red)}
.steps span.done{background:var(--lime);border-color:var(--white)}
.ring-timer{position:relative;width:150px;height:150px;margin:6px auto}
.ring-timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-timer div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1}
.ring-timer div small{display:block;font-size:.8rem;font-family:var(--body);color:var(--muted);font-weight:700}
.rate{display:grid;gap:8px;margin:10px 0}
.rate-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate-row span{min-width:150px;font-weight:700}
.starbtn{background:none;border:0;padding:2px}
.starbtn svg{width:28px;height:28px}
.phr{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.phr li{background:var(--white);border:2px dashed var(--line);border-radius:10px;padding:3px 9px;font-size:.88rem;font-weight:700}
.bigline{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.9rem);font-weight:700;line-height:1.35;margin:8px 0}
.bigline .kw{transition:background .1s;border-radius:6px;padding:0 2px}
.bigline .kw.on{background:var(--gold)}
.vi{font-family:var(--hand);font-size:1.15rem;color:var(--muted)}
.reps{display:flex;gap:6px}
.reps i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);background:var(--white)}
.reps i.on{background:var(--lime);border-color:var(--lime-d)}
.diff{font-size:1.15rem;line-height:1.9;margin-top:10px}
.diff span{padding:1px 4px;border-radius:5px;margin-right:2px}
.diff .y{background:var(--ok-bg);color:var(--lime-d)}
.diff .n{background:var(--bad-bg);color:var(--red);text-decoration:underline wavy}
.letter{position:relative;background:var(--white);background-image:repeating-linear-gradient(180deg,transparent 0 29px,#f3dadd 29px 30px);border-radius:6px;padding:22px 24px 18px;box-shadow:0 6px 0 rgba(80,0,10,.28);font-family:var(--hand);font-size:1.18rem;line-height:30px;color:var(--navy)}
.letter p{margin:0 0 0}
.letter .stamp{position:absolute;top:10px;right:12px;width:58px;height:66px;border:3px dashed var(--red);border-radius:4px;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:.7rem;font-weight:800;color:var(--red);line-height:1.1;transform:rotate(6deg);background:var(--rose)}
.letter .from{font-family:var(--body);font-size:.8rem;font-weight:800;color:var(--muted);line-height:1.4;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.motion{background:var(--navy);color:var(--white);border-radius:14px;padding:12px 16px;font-family:var(--display);font-size:1.25rem;font-weight:800}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sides>div{background:var(--white);border-radius:12px;padding:10px 12px;border:3px solid var(--line)}
.sides h4{margin-bottom:4px}
.sides ul{margin:0;padding-left:18px;font-size:.9rem}
.photo{border:10px solid var(--white);box-shadow:0 3px 10px rgba(0,0,0,.18);background:#f4efe6;padding:12px 14px;font-size:.95rem;transform:rotate(-1deg);margin:6px 0}
.photo b{font-family:var(--display);display:block;margin-bottom:2px}
.dubstage{position:relative;border-radius:18px;border:5px solid var(--white);background:linear-gradient(180deg,#fff5e8 0 70%,#e8d6c7 70%);padding:16px;display:flex;justify-content:space-around;align-items:flex-end;min-height:190px;box-shadow:0 6px 0 rgba(80,0,10,.28);overflow:hidden}
.dubstage .chr{width:min(150px,32%);height:auto;transition:transform .2s}
.dubstage .chr.talk{transform:translateY(-6px)}
.chr .mouth{transform-box:fill-box;transform-origin:center}
.chr.talk .mouth{animation:mouth .18s ease-in-out infinite alternate}
@keyframes mouth{to{transform:scaleY(.25)}}
.chr .name{font-family:var(--display);font-weight:800}
.subs{display:grid;gap:6px;margin-top:12px}
.sub{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--white);border:3px solid transparent}
.sub b{flex:none;min-width:56px;font-family:var(--display)}
.sub.on{border-color:var(--gold);background:#fff7d9}
.sub.me{box-shadow:inset 4px 0 0 var(--red)}
.cue{height:8px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:6px}
.cue i{display:block;height:100%;width:0;background:var(--red)}
.bigres{text-align:center}
.bigres .stars{justify-content:center}
.bigres .stars svg{width:56px;height:56px}

/* misc shared */
.flash-wrap{perspective:1200px;max-width:520px;margin:0 auto}
.flash{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;backface-visibility:hidden;text-align:center;border:5px solid var(--white);box-shadow:0 7px 0 rgba(80,0,10,.3)}
.face.front{background:var(--white);color:var(--red)}
.face.back{background:var(--navy);color:var(--white);transform:rotateY(180deg)}
.face .w{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1}
.face .pos{font-size:.85rem;opacity:.8;font-weight:700}
.face .ex{font-family:var(--hand);font-size:1.15rem;max-width:42ch}
.flash-ctl{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.rule{padding:14px 16px;border-radius:16px;background:var(--white);border:3px dashed var(--gold-d);margin-bottom:14px}
.rule b{color:var(--red)}
.explain{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.92rem}
.explain.ok{background:var(--ok-bg);border:2px solid var(--lime)}
.explain.bad{background:var(--bad-bg);border:2px solid var(--red)}
.bigq{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:700;line-height:1.3;margin:6px 0 14px}
.prog{height:12px;border-radius:9px;background:var(--track);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .3s}
.code{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:6px;color:var(--red)}
.codein{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--white);color:var(--navy);font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:3px;text-transform:uppercase;width:180px;max-width:100%}
.combo{font-family:var(--display);font-weight:800;color:var(--gold)}
table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.tbl{overflow-x:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:12px;border-radius:16px;border:3px dashed rgba(255,255,255,.6);text-align:center;color:var(--white);opacity:.6}
.badge.on{opacity:1;border:4px solid var(--white);background:var(--cream);color:var(--ink)}
.badge svg{width:44px;height:44px}
.badge h4{margin:4px 0 2px;font-size:1rem}
.badge p{margin:0;font-size:.78rem}
.lvbar{height:14px;border-radius:9px;background:var(--track);overflow:hidden;margin:8px 0}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%);z-index:60;padding:12px 20px;border-radius:16px;background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:800;box-shadow:0 6px 0 var(--gold-d);transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ============ computer-based exam screen ============ */
.cb{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--cb-bg);color:var(--cb-text);font-family:var(--exam);font-size:15px;line-height:1.5}
.cb button{font-family:var(--exam)}
.cb-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--cb-navy);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.cb-top .who{font-size:.82rem;line-height:1.25}
.cb-top .who b{display:block;font-size:.95rem}
.cb-top .ttl{flex:1;text-align:center;font-weight:700;min-width:0}
.cb-top .clock{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}
.cb-top .clock span{background:rgba(255,255,255,.12);border-radius:4px;padding:3px 10px}
.cb-top .clock.low span{background:#c2362b}
.cb-top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:4px;padding:4px 10px;font-size:.82rem}
.cb-instr{background:#fff;border-bottom:1px solid var(--cb-line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.cb-instr b{display:block;font-size:1rem}
.cb-instr p{margin:2px 0 0}
.cb-main{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cb-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%}
.cb-split>div{min-width:0;overflow:auto;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:16px 18px}
.cb-one{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:16px 18px}
.cb-text p{margin:0 0 .8em}
.cb-text h4,.cb h4{font-family:var(--exam);font-size:1.05rem;margin:0 0 8px}
.cbq{padding:12px 0;border-bottom:1px solid #e3e6ef}
.cbq:last-child{border-bottom:0}
.cbq-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.cbn{flex:none;min-width:28px;height:28px;padding:0 4px;border:2px solid var(--cb-navy);border-radius:4px;display:grid;place-items:center;font-weight:700}
.cbq-h .stem{flex:1;min-width:0}
.flagb{flex:none;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:2px 8px;font-size:.78rem;color:#555}
.flagb[aria-pressed="true"]{background:#fff3c4;border-color:#d8a300;color:#6b5100}
.cbopts{display:grid;gap:6px;padding-left:38px}
.cbo{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:8px 10px}
.cbo .rd{flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;border:2px solid #6a7290;display:grid;place-items:center}
.cbo .lt{font-weight:700;min-width:18px}
.cbo[aria-pressed="true"]{background:var(--cb-sel);border-color:var(--cb-blue)}
.cbo[aria-pressed="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cb-blue)}
.cbo.ok{background:#e1f4e7;border-color:#1d8a4e}
.cbo.bad{background:#fbe3e1;border-color:#c2362b}
.cb select,.cb input.cbin{border:1px solid #7d86a6;border-radius:3px;padding:3px 6px;background:#fff;font-family:var(--exam);font-size:.95rem;max-width:100%}
.cb input.cbin{width:150px}
.cb .ok-f{border-color:#1d8a4e!important;background:#e1f4e7!important}
.cb .bad-f{border-color:#c2362b!important;background:#fbe3e1!important}
.corr{color:#1d8a4e;font-weight:700;font-size:.85rem;margin-left:4px}
.notice{border:2px solid #333;padding:10px 14px;margin-bottom:8px;max-width:440px;text-align:center;background:#fff}
.notice.msg{text-align:left;border:1px solid #9aa3bf;border-radius:14px 14px 14px 2px;background:#f1f4fb}
.notice.note{text-align:left;border:0;background:#fff8c9;box-shadow:2px 3px 0 #e1d48a;font-family:var(--hand);font-size:1.08rem;transform:rotate(-1deg)}
.notice.email{text-align:left;border:1px solid #b9c0d4;border-radius:3px}
.notice.email .eh{font-size:.8rem;color:#555;border-bottom:1px solid #ddd;margin:-4px 0 6px;padding-bottom:4px}
.notes-card{border:1px solid var(--cb-line);border-radius:4px;padding:14px 16px;background:#fbfbfd}
.notes-card h4{text-align:center}
.nrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0}
.nrow label{min-width:170px}
.sidebox{font-size:.95rem}
.sidebox p{margin:0 0 8px;padding:6px 8px;border:1px solid #e3e6ef;border-radius:3px}
.audio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:10px 14px;margin-bottom:12px}
.audio .pbtn{background:var(--cb-blue);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-weight:700;display:flex;gap:6px;align-items:center}
.audio .pbtn[disabled]{background:#9aa3bf;cursor:not-allowed}
.audio .st{font-size:.88rem;color:#4b5370}
.vol{display:flex;gap:2px;align-items:flex-end;height:18px}
.vol i{width:4px;background:#9aa3bf;border-radius:1px}
.audio.on .vol i{background:var(--cb-blue);animation:wv .7s ease-in-out infinite}
.wbox{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wbox>div{min-width:0;overflow:auto;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:16px 18px}
.wbox textarea{min-height:300px;border-radius:3px;border:1px solid #7d86a6;box-shadow:none;font-family:var(--exam);font-size:1rem}
.wcount{text-align:right;font-size:.85rem;color:#4b5370;margin-top:4px}
.wtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.wtabs button{border:1px solid var(--cb-line);background:#fff;border-radius:4px;padding:6px 12px}
.wtabs button[aria-pressed="true"]{background:var(--cb-navy);color:#fff}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pics svg{width:100%;height:auto;border:1px solid #b9c0d4;border-radius:3px;background:#fff}
.cb-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border-top:1px solid var(--cb-line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cb-parts{display:flex;flex-wrap:wrap;gap:4px}
.cb-part{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--cb-line);background:#f7f8fb;border-radius:4px;padding:3px 10px;font-size:.78rem;line-height:1.2}
.cb-part b{font-size:.85rem}
.cb-part.on{background:var(--cb-navy);color:#fff;border-color:var(--cb-navy)}
.cb-nums{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.cb-num{position:relative;width:32px;height:32px;border:1px solid #9aa3bf;background:#fff;border-radius:3px;font-weight:700;font-size:.85rem}
.cb-num.ans{background:#4b5370;color:#fff;border-color:#4b5370}
.cb-num.flag::after{content:"";position:absolute;right:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e2a400;border:2px solid #fff}
.cb-num.ok{background:#1d8a4e;color:#fff;border-color:#1d8a4e}
.cb-num.bad{background:#c2362b;color:#fff;border-color:#c2362b}
.cb-arrows{display:flex;gap:6px}
.cb-arrows button{width:38px;height:38px;border-radius:4px;border:1px solid #9aa3bf;background:#fff;font-weight:700;font-size:1.1rem}
.cb-arrows button[disabled]{opacity:.4}
.cb-arrows .cb-finish{background:#1d8a4e;color:#fff;border-color:#1d8a4e;width:auto;padding:0 14px;font-size:.92rem}
.cb-modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,26,50,.55);padding:16px}
.cb-modal>div{background:#fff;border-radius:6px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.cb-modal h3{font-family:var(--exam);margin-bottom:8px}
.cb-btn{border:1px solid var(--cb-navy);background:#fff;color:var(--cb-navy);border-radius:4px;padding:8px 16px;font-weight:700}
.cb-btn.pri{background:var(--cb-navy);color:#fff}
.cb-btn.go{background:#1d8a4e;border-color:#1d8a4e;color:#fff}
.cb-btn[disabled]{opacity:.5}
.cb-page{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--cb-line);border-radius:4px;padding:22px 24px}
.examiner{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.examiner svg{width:110px;height:110px}
.say{background:#f1f4fb;border:1px solid #c8cee0;border-radius:6px;padding:12px 14px;min-height:56px}
.cardbox{margin-top:14px;border:1px dashed #9aa3bf;border-radius:6px;padding:12px 14px;background:#fbfbfd}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.acts div{border:1px solid #c8cee0;border-radius:4px;padding:10px;text-align:center;background:#fff;font-weight:700}
.acts svg{width:40px;height:40px;display:block;margin:0 auto 4px}
.cb .photo{transform:none;font-family:var(--exam)}
.crit{display:grid;gap:10px;margin:12px 0}
.crit .rate-row span{min-width:220px;font-weight:700}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{width:34px;height:34px;border:1px solid #9aa3bf;border-radius:4px;background:#fff;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--cb-navy);color:#fff}

/* results */
.sor{background:var(--white);border:4px solid var(--white);border-radius:6px;box-shadow:0 8px 0 rgba(80,0,10,.3);padding:22px 24px;position:relative;overflow:hidden}
.sor::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--white) 24px 48px)}
.sor h2{color:var(--red);font-size:1.8rem;margin:8px 0 4px}
.grade{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:var(--rose);border:2px solid var(--red);font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--red)}
.gbar{height:12px;border-radius:6px;background:var(--track);overflow:hidden;min-width:80px}
.gbar i{display:block;height:100%;background:var(--red)}


/* units & new game types */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.ucard{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:0;border-radius:10px;background:var(--kraft);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 9px);box-shadow:6px 7px 0 rgba(80,0,10,.28),inset 0 0 0 2px var(--kraft-2);transform:rotate(var(--tilt,0deg));transition:transform .15s}
.ucard:hover{transform:rotate(0) translateY(-3px)}
.unum{flex:none;width:48px;height:48px;border-radius:50%;border:4px solid var(--white);display:grid;place-items:center;color:var(--white);font-family:var(--display);font-weight:800;font-size:1.4rem;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ubody{flex:1;min-width:0;display:flex;flex-direction:column}
.ubody small{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--red)}
.ubody b{font-family:var(--display);font-size:1.2rem;line-height:1.15}
.utopic{font-size:.82rem;color:var(--muted);font-weight:700}
.ubadge{position:absolute;top:-10px;right:-8px;background:var(--lime);color:var(--white);font-family:var(--display);font-weight:800;font-size:.68rem;padding:2px 8px;border-radius:6px;transform:rotate(6deg);border:2px solid var(--white)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mcard{aspect-ratio:4/3;max-width:100%;border:4px solid var(--white);border-radius:14px;background:var(--red);background-image:radial-gradient(circle,rgba(255,255,255,.25) 2px,transparent 2.5px);background-size:14px 14px;color:var(--white);font-family:var(--display);font-weight:800;font-size:1.6rem;box-shadow:0 4px 0 rgba(80,0,10,.3);display:grid;place-items:center;padding:6px;transition:transform .2s}
.mcard.up{background:var(--white);color:var(--ink);font-size:clamp(.8rem,2.4vw,1.05rem);border-color:var(--line);transform:rotateY(0)}
.mcard.up.en{color:var(--red)}
.mcard.got{background:var(--ok-bg);border-color:var(--lime)}
.hm{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin:8px 0 14px}
.hm svg{width:120px;height:120px}
.hword{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hword span{min-width:28px;text-align:center;border-bottom:4px solid var(--red);font-family:var(--display);font-weight:800;font-size:1.6rem}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.keys button{height:40px;border-radius:9px;border:2px solid var(--line);background:var(--white);font-family:var(--display);font-weight:800}
.keys button.kok{background:var(--lime);color:var(--white);border-color:var(--lime)}
.keys button.kno{background:var(--track);color:var(--muted)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:7px 12px;border-radius:10px;border:2px solid var(--line);background:var(--white);font-weight:800;box-shadow:0 3px 0 var(--line)}
.tile.sel{border-color:var(--sky);background:#e4f2ff;box-shadow:0 3px 0 var(--sky)}
.tile.on{background:var(--rose);border-color:var(--red-l)}
.tile.ok{background:var(--ok-bg);border-color:var(--lime);box-shadow:none}
.tile.used{opacity:.35}
.buckets{display:grid;gap:10px}
.bucket{min-height:140px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left;padding:10px;border-radius:14px;border:3px dashed var(--red-l);background:var(--white)}
.bucket b{font-family:var(--display);color:var(--red)}
.bucket.over{background:var(--rose)}
.answer{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:12px;border:3px dashed var(--line);background:var(--white);margin-top:10px}
.answer.ok{border-color:var(--lime);background:var(--ok-bg)}
.answer.bad{border-color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;background:var(--rose);margin-bottom:12px}
.gtext{font-size:1.1rem;line-height:2.4}
.slot{min-width:84px;padding:2px 10px;border:0;border-bottom:3px solid var(--red);background:var(--track);border-radius:6px 6px 0 0;font-weight:800}
.slot.cur{background:var(--gold)}
.slot.ok{background:var(--ok-bg);border-color:var(--lime)}
.slot.bad{background:var(--bad-bg)}
.corr2{color:var(--lime-d);font-weight:800;font-size:.85rem;margin-left:4px}
.wheelbox{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%;margin:0 auto 12px}
.wheel{width:100%;height:100%;transition:transform 2s cubic-bezier(.2,.8,.2,1)}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--navy);z-index:2}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mbox{aspect-ratio:1;max-width:100%;border-radius:14px;border:4px solid var(--white);background:var(--gold);background-image:linear-gradient(90deg,transparent 45%,var(--red) 45% 55%,transparent 55%),linear-gradient(0deg,transparent 45%,var(--red) 45% 55%,transparent 55%);font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--ink);box-shadow:0 5px 0 var(--gold-d)}
.mbox.open{background:var(--white);background-image:none;box-shadow:none;border-color:var(--line);font-size:1.3rem}
.mbox.ok{color:var(--lime-d)}.mbox.bad{color:var(--red)}
.mill{background:var(--navy);color:var(--white);border-color:var(--white)}
.mill .muted{color:#b9c2ec}
.mill .opt{background:#24357f;border-color:#4b5db0;color:var(--white)}
.mill .opt b{background:var(--gold);color:var(--ink)}
.mill .opt.ok{background:var(--lime-d);border-color:var(--lime)}
.mill .opt.bad{background:var(--red-d);border-color:var(--red-l)}
.mill .explain{color:var(--ink)}
.ladder{margin:8px 0 0;padding-left:28px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.ladder li{padding:2px 8px;border-radius:6px;color:var(--muted)}
.ladder li.on{background:var(--gold);color:var(--ink)}
.ladder li.past{color:var(--lime-d)}
.ehunt{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;font-size:1.15rem}
.etok{border:2px solid transparent;background:var(--white);border-radius:8px;padding:4px 8px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.etok:hover{border-color:var(--sky)}
.etok.bad{background:var(--bad-bg);border-color:var(--red);text-decoration:line-through}
.etok.miss{background:var(--track);border-color:var(--muted)}
.tcard{border-radius:18px;border:5px solid var(--white);background:var(--grape);color:var(--white);padding:20px;text-align:center;box-shadow:0 7px 0 rgba(80,0,10,.3)}
.tcard small{font-weight:800;opacity:.85}
.tword{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.1;margin:6px 0}
.tban{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tban span{background:var(--white);color:var(--red);font-weight:800;border-radius:8px;padding:2px 10px;text-decoration:line-through}
.escape{max-width:820px;margin:0 auto}
.estory{background:var(--navy);color:var(--white);border-radius:16px;border:4px solid var(--white);padding:14px 18px;font-weight:700;box-shadow:0 6px 0 rgba(80,0,10,.3)}
.estory p{margin:0 0 4px}
.locks{display:flex;gap:10px;justify-content:center;margin-top:12px}
.lock{width:60px;height:70px;border-radius:12px 12px 8px 8px;border:4px solid var(--white);background:var(--muted);color:var(--white);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.8rem;position:relative}
.lock::before{content:"";position:absolute;top:-22px;left:50%;width:30px;height:26px;margin-left:-15px;border:5px solid var(--white);border-bottom:0;border-radius:15px 15px 0 0}
.lock.cur{background:var(--gold);color:var(--ink)}
.lock.open{background:var(--lime)}
.lock.open::before{transform:translateX(10px) rotate(-20deg)}
.jboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jhead{font-family:var(--display);font-weight:800;color:var(--white);background:var(--navy);border-radius:10px;text-align:center;padding:8px 4px;font-size:.95rem}
.jcell{height:64px;border-radius:10px;border:3px solid var(--white);background:var(--orange);color:var(--white);font-family:var(--display);font-weight:800;font-size:1.4rem;box-shadow:0 4px 0 var(--orange-d)}
.jcell.ok{background:var(--lime);box-shadow:none}.jcell.bad{background:var(--muted);box-shadow:none}
@media (max-width:520px){.mgrid{grid-template-columns:repeat(3,1fr)}.hm{grid-template-columns:80px 1fr}.hm svg{width:80px;height:80px}.buckets{grid-template-columns:1fr!important}.lock{width:50px;height:58px}}
@media (max-width:860px){
  .cols,.dock,.cb-split,.wbox,.lvhead{grid-template-columns:1fr}
  .cb-split{height:auto}
  .passage{max-height:none}
  .stk{width:72px;height:68px;font-size:.66rem}.stk svg{width:24px;height:24px}
}
@media (max-width:520px){
  .scenes,.pics,.sides{grid-template-columns:1fr}
  .nav{gap:6px}
  .stk{width:calc(20% - 5px);min-width:58px;height:60px;border-width:3px;font-size:.58rem}
  .stk svg{width:20px;height:20px}
  .cbopts{padding-left:0}
  .examiner{grid-template-columns:1fr}
  .cb-top .ttl{flex-basis:100%;order:3;text-align:left}
  .porch{padding:84px 12px 0}
  .stkr{width:58px;height:58px}.stkr svg{width:26px;height:26px}
  .link{margin-left:calc(var(--x) + 27px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const EXAMS = {
 ket:{id:'ket',name:'KET',sub:'A2 Key for Schools',level:'A2',tilt:'-1.5deg',
  time:{listening:12,reading:15,writing:20,speaking:10},
  listening:{mode:'each',intro:'Nghe 5 đoạn hội thoại ngắn. Mỗi đoạn được phát tối đa 2 lần. Chọn đáp án A, B hoặc C.',items:[
   {q:'What time does the film start?',script:[['Girl','Shall we go to the cinema tonight?'],['Boy',"Sure. The film starts at a quarter to eight, but let's meet at half past seven."]],opts:['7:30','7:45','8:15'],a:1},
   {q:'How will Tom get to school tomorrow?',script:[['Mum',"Tom, Dad can't drive you tomorrow because the car is at the garage."],['Tom',"That's OK. It isn't raining, so I'll ride my bike."]],opts:['By car','By bus','By bike'],a:2},
   {q:'What did Anna buy at the shop?',script:[['Anna','I wanted a new T-shirt, but they were too expensive. In the end I bought a cap. It was only five pounds.']],opts:['A T-shirt','A cap','A jacket'],a:1},
   {q:"Where is the boy's phone?",script:[['Boy',"Mum, have you seen my phone? It isn't in my bag."],['Mum','I saw it in the kitchen, next to the fridge.']],opts:['In his bag','In the kitchen','In the bedroom'],a:1},
   {q:'How much is a student ticket?',script:[['Man','Adult tickets are twelve pounds, but students pay eight pounds. Children under five go in free.']],opts:['£5','£8','£12'],a:1}]},
  reading:{title:'An email from Da Lat',passage:`<p>Hi Mai,</p><p>I'm writing from the science camp in Da Lat! There are thirty students here from all over Viet Nam. We sleep in wooden houses near a lake, and it's quite cold at night, so I'm happy I brought my big jacket.</p><p>Every morning we have lessons about plants and stars. Yesterday we visited a flower farm and learned how farmers grow strawberries. My favourite activity is in the evening, when we look at the sky through a big telescope. Last night I saw Saturn and its rings!</p><p>The food is good, but I miss Mum's noodle soup. I'm coming home on Sunday. Can you meet me at the bus station at four o'clock?</p><p>Love,<br>Linh</p>`,items:[
   {q:'How many students are at the camp?',opts:['13','30','40'],a:1},
   {q:'Why is Linh happy she brought her jacket?',opts:['The lake is very big.','It is cold at night.','It rains every day.'],a:1},
   {q:'What did the students do yesterday?',opts:['They visited a farm.','They went swimming.','They climbed a mountain.'],a:0},
   {q:'What does Linh enjoy most at the camp?',opts:['The morning lessons','Looking at the sky','The food'],a:1},
   {q:'What does Linh ask Mai to do?',opts:['Cook noodle soup','Meet her on Sunday','Visit the camp'],a:1}]},
  writing:[
   {title:'Email',min:25,task:`<p>You want to go to the cinema with your English friend, Sam, on Saturday.</p><p><b>Write an email to Sam. Say:</b></p><ul><li>which film you want to see</li><li>where you will meet</li><li>what time you will meet.</li></ul><p>Write <b>25 words or more</b>.</p>`,
    points:[['Nói tên phim / loại phim',/film|movie|cartoon/i],['Nói địa điểm gặp',/meet|at the|outside|in front/i],['Nói giờ gặp',/\d|o'clock|half past|quarter|morning|afternoon|evening/i]],
    model:`Hi Sam,\nDo you want to see the new cartoon film with me on Saturday? Let's meet outside the cinema in Vincom. We can meet at half past two because the film starts at three.\nSee you!\nNam`},
   {title:'Story',min:35,task:`<p>Look at the three pictures. <b>Write the story</b> shown in the pictures. Write <b>35 words or more</b>.</p><div class="scenes"><div class="scene"><b>1</b>A boy finds a small wet dog in the park. It is raining.</div><div class="scene"><b>2</b>He takes the dog home and gives it some food.</div><div class="scene"><b>3</b>Next day he sees a "Lost dog" poster and gives the dog back to a happy girl.</div></div>`,
    points:[['Kể cảnh 1 (công viên, chú chó)',/dog|puppy/i],['Kể cảnh 2 (mang về nhà, cho ăn)',/home|food|fed|feed|ate/i],['Kể cảnh 3 (tấm áp phích, trả lại)',/poster|lost|gave|return|owner|girl/i],['Dùng thì quá khứ',/\b(was|were|found|took|saw|gave|went|walked|ate)\b/i]],
    model:`One rainy afternoon, Bao was walking in the park when he found a small dog. It was wet and cold. He took it home and gave it some food and milk. The next day, he saw a "Lost dog" poster on the wall. He called the number and gave the dog back to a little girl. She was very happy.`}],
  speaking:[
   {part:'Part 1',title:'Giới thiệu bản thân',prep:10,talk:45,prompt:`<p>Answer the examiner's questions:</p><ul><li>What's your name? How old are you?</li><li>Where do you live?</li><li>What do you like doing at the weekend?</li><li>Tell me about your best friend.</li></ul>`,sample:'My name is Lan and I am thirteen years old. I live in Thai Binh with my family. At the weekend I like playing badminton with my brother and watching cartoons. My best friend is Hoa. She is funny and kind, and we sit next to each other at school.'},
   {part:'Part 2',title:'Thảo luận',prep:15,talk:60,prompt:`<p>Here are some places to go on a school trip: <b>the beach, a museum, a zoo, a theme park, a farm</b>.</p><ul><li>Do you like going to these places?</li><li>Which place is the best for a school trip? Why?</li></ul>`,sample:"I like going to the beach because I can swim and play with my friends. I don't really like museums because they are a bit boring for me. I think the zoo is the best place for a school trip, because we can learn about animals and it is fun for everyone."}]},
 pet:{id:'pet',name:'PET',sub:'B1 Preliminary for Schools',level:'B1',tilt:'1deg',
  time:{listening:15,reading:20,writing:40,speaking:12},
  listening:{mode:'each',intro:'Nghe 5 đoạn ngắn và chọn đáp án đúng. Mỗi đoạn phát tối đa 2 lần.',items:[
   {q:'Why is the girl late?',script:[['Girl',"Sorry I'm late. The bus was fine, but I forgot my homework and had to go back home to get it."],['Boy',"Never mind, the class hasn't started yet."]],opts:['The bus was late.','She forgot something.','She woke up late.'],a:1},
   {q:'What is the boy most looking forward to this weekend?',script:[['Boy',"My parents want to visit my grandma on Saturday, and that's fine, but on Sunday I really want to try the new climbing wall at the sports centre."],['Girl','Oh, I went swimming there last week.']],opts:['Visiting his grandma','Going climbing','Going swimming'],a:1},
   {q:'What will the weather be like tomorrow afternoon?',script:[['Radio','Tomorrow morning will start cloudy with some light rain, but by the afternoon the clouds will clear and it will be sunny and warm, around twenty-eight degrees.']],opts:['Rainy','Cloudy','Sunny'],a:2},
   {q:'What must students bring on the trip?',script:[['Teacher',"For tomorrow's trip to the museum, you don't need money because lunch is included. Please wear comfortable shoes, and don't forget your notebook. You'll need it for the project."]],opts:['Some money','Their lunch','A notebook'],a:2},
   {q:'How does the girl feel about her new school now?',script:[['Girl',"At first I was nervous because I didn't know anyone, but the teachers are friendly and I've already made two good friends. I'm really enjoying it now."]],opts:['Nervous','Bored','Happy'],a:2}]},
  reading:{title:'The girl who turns plastic into bricks',passage:`<p>When fifteen-year-old Minh Anh noticed how much plastic was left on the beach near her home in Quang Ngai, she decided to do something about it. "Every weekend I saw tourists leave bottles and bags behind," she says. "I knew that picking them up wasn't enough. I wanted to find a way to use them."</p><p>After reading about eco-bricks online, Minh Anh started an after-school club. Members collect clean plastic waste and push it tightly into empty bottles until each one is as hard as a brick. At first only four classmates joined, but within six months the club had more than forty members.</p><p>Last spring, the club used 1,200 eco-bricks to build a small reading corner for a primary school in their village. "The hardest part was waiting," Minh Anh laughs. "Each bottle takes about an hour to fill, so we needed a lot of patience."</p><p>Her teachers are proud, but Minh Anh says the project is not about winning prizes. "I just want people my age to understand that small actions add up. If everyone changed one habit, our beaches would look completely different."</p><p class="hint">(Bài đọc luyện tập do giáo viên biên soạn)</p>`,items:[
   {q:'Why did Minh Anh start the project?',opts:['She wanted to win a prize.','She wanted to reuse the rubbish she saw.','Her teacher asked her to.','Tourists complained about the beach.'],a:1},
   {q:'What do the club members do?',opts:['Buy new bottles for the club','Push plastic waste into bottles','Clean the beach every day','Sell bricks to tourists'],a:1},
   {q:'What happened to the club in its first six months?',opts:['Many more students joined.','Four members left.','It moved to a new school.','It won a competition.'],a:0},
   {q:'What was difficult about building the reading corner?',opts:['Finding a school','Making enough bricks took a long time','Nobody wanted to help','The weather was bad'],a:1},
   {q:"What is Minh Anh's main message?",opts:['Prizes are important for young people.','Tourists should not visit beaches.','Small changes by young people matter.','Eco-bricks are cheaper than real bricks.'],a:2}]},
  writing:[
   {title:'Email (~100 từ)',min:100,task:`<p>Read this email from your English-speaking friend, Alex.</p><p class="quote"><i>Hi! Our class is planning a trip next month. Should we go to the beach or the mountains? What activities could we do there? And what should I bring? Thanks!</i></p><p><b>Write your email to Alex, answering all the questions.</b> Write about <b>100 words</b>.</p>`,
    points:[['Chọn biển hay núi',/beach|mountain/i],['Gợi ý hoạt động',/swim|hike|hiking|climb|camp|play|walk|visit|explore|activit/i],['Gợi ý mang theo',/bring|take|pack|jacket|sun ?cream|hat|shoes|camera/i],['Có lời chào và kết thư',/^(hi|hello|dear)|see you|best wishes|love|bye/im]],
    model:`Hi Alex,\nThanks for your email. I think the mountains are a better choice than the beach because it's really hot at this time of year, and the air in the mountains is cool and fresh.\nThere are lots of things you can do there. You could go hiking in the morning and have a picnic by a waterfall. In the evening, you could make a campfire and sing songs with your classmates.\nDon't forget to bring a warm jacket, because it gets cold at night. Comfortable shoes and a camera are good ideas too.\nHave a great trip!\nMinh`},
   {title:'Article (~100 từ)',min:100,task:`<p>You see this announcement in an English-language magazine for teenagers.</p><p class="quote"><b>Articles wanted! My favourite place to relax.</b><br>Where is it? Why do you like it? What do you do there?</p><p>Write your <b>article</b> in about <b>100 words</b>.</p>`,
    points:[['Có tiêu đề',/^.{3,60}\n/],['Nói địa điểm',/place|room|park|garden|beach|café|cafe|house|lake|river/i],['Giải thích lý do',/because|since|as |so /i],['Kể việc làm ở đó',/\b(read|listen|watch|play|draw|sit|walk|chat|sleep)/i]],
    model:`My Secret Garden\nMy favourite place to relax is the small garden on the roof of my grandparents' house. It is full of plants, flowers and even a few tomato plants that my grandfather grows.\nI love it because it is quiet and peaceful, far away from the noise of the street below. When I feel stressed about exams, I go up there with a book and a glass of iced tea.\nSometimes I just sit and listen to the birds, and sometimes I help my grandfather water the plants. After an hour there, I always feel calm and ready to study again.`}],
  speaking:[
   {part:'Part 1',title:'Phỏng vấn',prep:10,talk:60,prompt:`<ul><li>Where do you live? Do you like living there?</li><li>What subjects do you enjoy most at school? Why?</li><li>Tell us about something you did last weekend.</li><li>What would you like to do in the future?</li></ul>`,sample:'I live in a small town in Thai Binh. I like it because it is quiet and my friends live nearby. My favourite subject is biology, because I love learning about animals. Last weekend I went cycling with my cousins around the rice fields, and then we had a picnic. In the future I would like to become a vet.'},
   {part:'Part 2',title:'Mô tả bức ảnh',prep:15,talk:60,prompt:`<p><b>Your photograph:</b> A group of four teenagers is cooking together in a bright kitchen. One is cutting vegetables, one is stirring a pot, and two are laughing and looking at a recipe on a tablet.</p><p>Describe what you can see. Talk for about <b>one minute</b>.</p>`,sample:'In this photo I can see four teenagers in a kitchen. It looks like a modern kitchen with a lot of light. On the left, a boy is cutting some vegetables, maybe carrots. Next to him, a girl is stirring something in a pot. In the background, two other students are looking at a tablet; I think they are reading a recipe. They look happy and relaxed, so maybe they are cooking for a party.'},
   {part:'Part 3',title:'Thảo luận chung',prep:20,talk:90,prompt:`<p>Your class wants to raise money for a local charity. Here are some ideas: <b>a bake sale, a car wash, a concert, a sports day, a second-hand book fair</b>.</p><p>Talk about the ideas and decide which one would be <b>best</b>.</p>`,sample:"Let's think about each idea. A bake sale is easy, but we need a lot of people to cook. A concert could raise more money, but it needs a big room and a lot of practice. I think a second-hand book fair is the best idea, because everyone has old books at home, it doesn't cost anything, and it also encourages people to read. What do you think?"}]},
 ielts:{id:'ielts',name:'PRE-IELTS',sub:'Tiền IELTS · nền tảng A2+',level:'A2+',tilt:'-0.5deg',
  time:{listening:12,reading:20,writing:45,speaking:12},
  listening:{mode:'form',intro:'Section 1 · Một cuộc gọi đăng ký câu lạc bộ. Điền vào phiếu, MỖI chỗ trống KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT SỐ. Phát tối đa 2 lần.',
   script:[['Receptionist','Good morning, Riverside Youth Centre. How can I help you?'],['Caller',"Hi, I'd like to join the summer English club."],['Receptionist','Great. Can I have your name, please?'],['Caller',"It's Daniel Parker. That's P, A, R, K, E, R."],['Receptionist','Thank you. And how old are you, Daniel?'],['Caller',"I'm fourteen."],['Receptionist','The club meets once a week. Which day do you prefer, Tuesday or Thursday?'],['Caller','Thursday is better for me. I have football on Tuesdays.'],['Receptionist','OK. The course costs forty-five dollars for the whole month.'],['Caller',"That's fine. Do I need to bring anything?"],['Receptionist','Just a dictionary. We provide all the books.'],['Receptionist','And finally, a phone number?'],['Caller',"Sure. It's zero, nine, one, two, four, five, eight, seven, three, six."]],

  reading:{title:'Why teenagers stay up late',tfng:true,passage:`<p>Most scientists agree that teenagers need between eight and ten hours of sleep every night. However, a large number of secondary school students sleep fewer than seven hours. One reason is biological: during puberty, the body starts producing the sleep hormone melatonin later in the evening, so many teenagers do not feel tired until around 11 p.m.</p><p>Technology also plays a role. Light from phone and tablet screens can delay sleep even further, and many young people keep their phones in their bedrooms at night.</p><p>Some schools in other countries have experimented with starting classes later, at around 9 a.m. Early results suggest that students at these schools arrive on time more often and feel more alert in morning lessons.</p><p>Experts recommend simple habits: going to bed at the same time each night, keeping phones out of the bedroom, and avoiding drinks with caffeine in the afternoon.</p>`,
   intro:'Chọn TRUE nếu câu khớp với bài đọc, FALSE nếu câu trái với bài đọc, NOT GIVEN nếu bài không nói tới.',items:[

  writing:[
   {title:'Task 1 · Biểu đồ (≥80 từ)',min:80,chart:true,task:`<p>The chart below shows the favourite free-time activities of <b>200 students</b> at a secondary school.</p><p>Summarise the information by selecting and reporting the main features. Write <b>at least 80 words</b>.</p>`,
    points:[['Câu mở bài (the chart shows…)',/chart|graph|shows|illustrates/i],['Nêu hoạt động phổ biến nhất',/gam(e|ing)/i],['Nêu số liệu cụ thể',/\d/],['Có so sánh',/than|most|least|more|fewer|less|while|whereas/i]],
    model:`The bar chart shows the favourite free-time activities of 200 students at a secondary school.\nOverall, playing video games was the most popular activity, while reading was the least popular.\nSeventy students chose gaming as their favourite activity, which is more than a third of the group. Sport came second with 55 students, followed by listening to music with 45.\nOnly 30 students said reading was their favourite way to spend free time, less than half the number who preferred gaming.`},
   {title:'Task 2 · Ý kiến (≥120 từ)',min:120,task:`<p>Write about the following topic:</p><p class="quote"><b>Some people think students should not have homework at weekends. Do you agree or disagree?</b></p><p>Give reasons for your answer and include any relevant examples. Write <b>at least 120 words</b>.</p>`,
    points:[['Nêu rõ quan điểm',/I (agree|disagree|believe|think)|in my opinion/i],['Có lý do 1 (Firstly…)',/first|to begin|one reason/i],['Có lý do 2 (Secondly…)',/second|another|also|moreover|in addition/i],['Có ví dụ',/for example|for instance|such as/i],['Có kết luận',/in conclusion|to sum up|overall/i]],
    model:`Many students in Viet Nam have homework every weekend. In my opinion, students should have little or no homework at weekends.\nFirstly, young people need time to rest. After five or six days of lessons, students are often tired, and a free weekend helps them return to school with more energy.\nSecondly, weekends are a good time to develop other skills. For example, students can play sports, learn music or help their parents at home. These activities are also important for their future.\nHowever, a small amount of revision can be useful before an exam.\nIn conclusion, I believe weekend homework should be limited so that students can rest and enjoy a balanced life.`}],
  speaking:[
   {part:'Part 1',title:'Câu hỏi làm quen',prep:5,talk:60,prompt:`<ul><li>Do you work or are you a student?</li><li>What do you like about your hometown?</li><li>How do you usually spend your free time?</li><li>Do you prefer reading books or watching films? Why?</li></ul>`,sample:"I'm a student in grade nine. What I like most about my hometown is the food, especially the local rice cakes. In my free time I usually play badminton or watch English videos on YouTube. I prefer watching films, because they help me improve my listening and they are more relaxing than reading."},
   {part:'Part 2',title:'Cue card',prep:60,talk:120,prompt:`<p><b>Describe a teacher who has helped you.</b></p><p>You should say:</p><ul><li>who the teacher is</li><li>what subject he or she teaches</li><li>how he or she helped you</li></ul><p>and explain why you remember this teacher.</p>`,sample:"I'd like to talk about Ms Huong, my English teacher in grade seven. She was young and very energetic. Before her class, I was afraid of speaking English because I thought my pronunciation was bad. Ms Huong encouraged me to join the English club and gave me small speaking tasks every week. Slowly I became more confident. I remember her because she believed in me before I believed in myself."},
   {part:'Part 3',title:'Thảo luận mở rộng',prep:10,talk:90,prompt:`<ul><li>What makes a good teacher?</li><li>Do you think computers will replace teachers in the future? Why or why not?</li></ul>`,sample:"I think a good teacher is patient and understands that every student learns differently. As for technology, computers can help a lot, for example with practice exercises or instant feedback, but I don't think they will replace teachers completely. Students also need motivation and care, and a machine cannot really give that."}]}

const LETTERS={
 'a2-1':{kind:'Thư penpal',from:'Emma · Manchester, UK',stamp:'UK',min:50,
  letter:`<p>Hi!</p><p>My name's Emma and I'm thirteen. I live in Manchester with my mum, my dad and my little brother, Harry. I love playing the piano and riding my bike in the park.</p><p>What about you? Tell me about your family and your hobbies. What's your school like?</p><p>Write soon!<br>Emma</p>`,
  task:'Viết thư trả lời Emma (ít nhất 50 từ). Giới thiệu bản thân, gia đình, sở thích, trường học, và hỏi Emma một câu.',
  points:[['Lời chào',/^(hi|hello|dear)/im],['Giới thiệu gia đình',/mother|father|mum|dad|brother|sister|family|parents/i],['Kể sở thích',/like|love|enjoy|hobby|hobbies|play/i],['Kể về trường',/school|class|teacher|subject/i],['Hỏi Emma một câu',/\?/],['Kết thư',/write soon|best wishes|love|bye|see you|take care/i]],
  model:`Hi Emma,\nThanks for your letter! My name is Nam and I'm twelve. I live in Thai Binh with my parents and my older sister, Linh. I love playing football and drawing comics.\nMy school is quite big. There are forty students in my class and my favourite subject is English. My teacher is very funny!\nDo you have any pets? What's your favourite food?\nWrite soon,\nNam`},
 'a2-2':{kind:'Thư penpal',from:'Kenji · Osaka, Japan',stamp:'JP',min:60,
  letter:`<p>Hello from Osaka!</p><p>Last weekend I went to a summer festival with my friends. We wore traditional clothes and ate takoyaki. There were fireworks at night. It was amazing!</p><p>Do you have festivals in Viet Nam? What is your favourite festival? What do you do and what do you eat?</p><p>Your friend,<br>Kenji</p>`,
  task:'Viết thư trả lời Kenji (ít nhất 60 từ). Kể về lễ hội em thích nhất: làm gì, ăn gì, và một lần đáng nhớ em đã tham gia.',
  points:[['Lời chào',/^(hi|hello|dear)/im],['Tên lễ hội',/tet|festival|mid-autumn|lunar|new year|lantern/i],['Hoạt động trong lễ hội',/visit|watch|wear|clean|decorate|give|receive|carry|play|go/i],['Món ăn',/cake|banh|chung|food|eat|mooncake|sticky/i],['Kể chuyện đã qua (thì quá khứ)',/\b(went|was|were|ate|got|saw|visited|had)\b/i],['Kết thư',/write soon|best wishes|love|bye|see you|your friend/i]],
  model:`Hello Kenji,\nYour festival sounds amazing! In Viet Nam, my favourite festival is Tet, the Lunar New Year. Before Tet, we clean and decorate our house with flowers. We eat banh chung, a square sticky rice cake.\nLast Tet, I visited my grandparents in the countryside. I got lucky money in red envelopes and watched fireworks with my cousins. It was the best day of the year!\nWhat do you do for New Year in Japan?\nYour friend,\nMai`},
 'b1-1':{kind:'Email penpal',from:'Sofia · Valencia, Spain',stamp:'ES',min:100,
  letter:`<p>Hi there,</p><p>I'm doing a school project about how teenagers around the world spend their free time. Could you tell me how you and your friends usually spend your free time?</p><p>Do you think teenagers in Viet Nam spend too much time online? I'd love to hear your opinion.</p><p>Also, I might visit Viet Nam next summer with my family. What should I see?</p><p>Thanks a lot!<br>Sofia</p>`,
  task:'Viết email trả lời Sofia (khoảng 100 từ). Trả lời đủ 3 câu hỏi: thời gian rảnh, ý kiến về việc dùng mạng, gợi ý điểm tham quan.',
  points:[['Lời chào & cảm ơn',/^(hi|hello|dear)[\s\S]*(thank|great to hear|nice to hear)/im],['Kể hoạt động lúc rảnh',/usually|often|sometimes|play|go|watch|hang out/i],['Nêu ý kiến về thời gian online',/(i think|in my opinion|i believe|i agree|i don't think)/i],['Gợi ý nơi tham quan',/should|recommend|visit|ha long|hoi an|sa pa|da nang|ha noi|hanoi/i],['Dùng từ nối',/however|because|although|also|so/i],['Kết thư',/best wishes|take care|write soon|bye|see you|love/i]],
  model:`Hi Sofia,\nThanks for your email. I'm happy to help with your project!\nIn my free time, my friends and I usually play badminton in the park or go to a bubble tea café after school. At weekends, we sometimes ride our bikes around the lake.\nTo be honest, I think many teenagers here spend too much time online, especially on games and TikTok. However, the internet is also useful for learning.\nIf you visit Viet Nam, you should definitely see Ha Long Bay and the old town of Hoi An. The food is amazing too!\nBest wishes,\nAn`},
 'pi-1':{kind:'Thư tư vấn',from:'Alex · Melbourne, Australia',stamp:'AU',min:150,
  letter:`<p>Hey!</p><p>Big news: my school is offering an exchange semester in Viet Nam next year and I'm thinking about applying! But I'm a bit nervous.</p><p>Which city do you think is best for a student? What is daily life like for students there? And is there anything I should prepare before I come?</p><p>Cheers,<br>Alex</p>`,
  task:'Viết thư trả lời Alex (khoảng 150 từ): tư vấn thành phố phù hợp và lý do, mô tả đời sống học sinh, gợi ý những điều cần chuẩn bị.',
  points:[['Mở thư thân mật, phản hồi tin',/^(hi|hello|hey|dear)[\s\S]{0,200}(great|exciting|amazing|congrat|happy)/im],['Đề xuất thành phố + lý do',/(ha noi|hanoi|da nang|ho chi minh|saigon|hue|hoi an)[\s\S]*(because|since|as)/i],['Mô tả đời sống học sinh',/students|school|classes|day|morning|afternoon|study/i],['Lời khuyên chuẩn bị',/should|recommend|make sure|don't forget|it's a good idea|bring|learn/i],['Ít nhất 3 từ nối học thuật',/(moreover|in addition|however|although|for example|for instance|as a result|therefore)/i],['Kết thư',/best wishes|take care|cheers|see you|can't wait|bye/i]],
  model:`Hey Alex,\nThat's exciting news! You should definitely apply.\nIn my opinion, Da Nang is the best city for an exchange student. It's smaller and less crowded than Ha Noi or Ho Chi Minh City, and the beach is only ten minutes from the city centre. Moreover, the cost of living is quite low.\nAs for daily life, school starts early, at around 7 a.m., so you'll need to get used to waking up at six! Most students go to extra classes in the afternoon, but they also hang out at cafés and play sports in the evening.\nBefore you come, I'd recommend learning a few basic Vietnamese phrases, because not everyone speaks English. You should also bring light clothes and a good raincoat, as it rains a lot in autumn.\nLet me know if you decide to come. I can't wait to show you around!\nCheers,\nMinh`},
 'pi-2':{kind:'Đoạn văn nghị luận',from:'Đề bài · Opinion paragraph',stamp:'?',min:150,
  letter:`<p><b>Some people believe that mobile phones should be banned in schools. Others think they are useful learning tools.</b></p><p>Write a paragraph giving your opinion. Include reasons and examples.</p>`,
  task:'Viết một đoạn văn nêu ý kiến (khoảng 150 từ): câu chủ đề nêu quan điểm, 2 lý do có ví dụ, có nhắc ý kiến trái chiều, câu kết.',
  points:[['Câu chủ đề nêu quan điểm',/(in my opinion|i believe|i strongly|from my point of view|i think)/i],['Lý do 1',/firstly|first of all|the first reason|to begin with/i],['Lý do 2',/secondly|moreover|in addition|furthermore|another reason/i],['Có ví dụ',/for example|for instance|such as/i],['Nhắc ý kiến trái chiều',/however|on the other hand|although|admittedly|some people argue/i],['Câu kết',/in conclusion|to sum up|overall|all things considered|therefore/i]],
  model:`In my opinion, mobile phones should not be completely banned in schools, but their use should be strictly controlled. Firstly, smartphones can be valuable learning tools. For example, students can look up new words, watch short science videos or use apps like Quizlet to review vocabulary. Secondly, phones allow students to contact their parents in an emergency, which is important for safety. On the other hand, it is true that phones can be a serious distraction. Some students play games or check social media during lessons instead of listening to the teacher. However, this problem can be solved with clear rules, such as keeping phones in lockers and only using them when the teacher allows it. All things considered, I believe that a smart policy is better than a total ban, because it teaches young people to use technology responsibly.`}
};

 'a2-room':{kind:'Mô tả',title:'Căn phòng của em',turns:[{card:'<p><b>Describe your bedroom.</b></p><ul><li>Where is it in your house?</li><li>What is in it?</li><li>What do you do there?</li><li>What would you like to change?</li></ul>',prep:30,talk:50}],

 'b1-present':{kind:'Thuyết trình',title:'My dream job',turns:[{card:'<p><b>Give a short presentation: My dream job</b></p><ul><li>What job is it?</li><li>Why do you want to do it?</li><li>What skills or qualities do you need?</li><li>How will you prepare for it?</li></ul>',prep:60,talk:90}],
  phrases:["Today I'd like to talk about…",'First of all,… / Secondly,…','The main reason is that…','To do this job, you need to be…','To sum up,…'],sample:"Today I'd like to talk about my dream job, which is becoming a vet. First of all, I have always loved animals; I have two cats and a dog at home. The main reason I want to be a vet is that I want to help animals that are sick or hurt. To do this job, you need to be patient, calm and good at science. To prepare, I'm studying biology hard and I volunteer at an animal shelter at weekends. To sum up, being a vet is not easy, but I believe it is the right job for me."},
 'b1-debate':{kind:'Tranh biện',title:'School uniforms',debate:{motion:'Students should wear school uniforms.',

 'b1-discuss':{kind:'Thảo luận',title:'Teenagers & social media',turns:[{say:'How much time do you spend on social media every day?',talk:30},{say:'What are the good things about social media for teenagers?',talk:40},{say:'What problems can social media cause?',talk:40},{say:'Should parents control how much time teenagers spend online? Why or why not?',talk:45}],
  phrases:['In my experience,…','One advantage is that…','The problem is that…','I partly agree, because…','It depends on…'],sample:"Honestly, I spend about two hours a day on social media, mostly in the evening. One advantage is that we can keep in touch with friends and learn new things from short videos. The problem is that it's easy to waste time, and some people feel bad when they compare themselves with others. I partly agree that parents should control screen time, but I think it's better if they talk to us and set rules together."},

   {card:photoCard('Photo 2','A school science lab. Four students wearing white coats and safety glasses are standing around a table. One girl is pouring a blue liquid into a glass tube while a boy writes notes. Their teacher is smiling and pointing at a poster on the wall.'),prep:20,talk:60}],
  phrases:['In this photo I can see…','In the foreground / In the background…','On the left / On the right…','It looks like… / They seem to be…','Maybe they are… because…'],sample:"In this photo I can see a busy market, probably in the morning because the light is soft. In the foreground, there are some women wearing conical hats. They seem to be selling vegetables from baskets. On the right, a teenage boy is helping his mother carry a heavy bag of oranges. In the background, I can see lots of motorbikes and colourful umbrellas. It looks hot but everyone seems busy and cheerful."},
 'pi-present':{kind:'Cue card',title:'A place you want to visit',turns:[{card:'<p><b>Describe a place in your country that you would like to visit.</b></p><p>You should say:</p><ul><li>where it is</li><li>how you know about it</li><li>what you would like to do there</li></ul><p>and explain why you would like to visit this place.</p>',prep:60,talk:120}],
  phrases:["I'd like to talk about…",'I first heard about it when…',"If I had the chance, I'd…","What attracts me most is…",'All in all,…'],sample:"I'd like to talk about Ha Giang, a mountainous province in the far north of Viet Nam. I first heard about it from a travel vlog on YouTube, and the scenery looked breathtaking. If I had the chance, I'd ride along the Ma Pi Leng Pass and visit the local markets, where ethnic minority people sell handmade clothes. What attracts me most is that Ha Giang is still quite wild and untouched compared with other tourist destinations. All in all, it would be an unforgettable adventure, and I hope I can go there after my exams."},
 'pi-debate':{kind:'Tranh biện',title:'Online vs classroom learning',debate:{motion:'Online learning is better than classroom learning.',
