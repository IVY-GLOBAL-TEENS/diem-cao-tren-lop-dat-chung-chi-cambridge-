     <div class="cb-main"><div class="cb-page"><div class="crit">${CRIT.map(([k,en,vi])=>`<div class="rate-row"><span>${en}<br><small class="muted" style="font-weight:400">${vi}</small></span><div class="scale">${[0,1,2,3,4,5].map(n=>`<button data-act="srt" data-arg="${k}|${n}" aria-pressed="${E.rate[k]===n}">${n}</button>`).join('')}</div></div>`).join('')}</div>
      <p class="hint">5 = rất tốt, đúng trình độ ${MOCK[E.exam].level} trở lên · 3 = đạt yêu cầu · 1 = còn nhiều lỗi, câu rất ngắn.</p>
      <div class="row" style="justify-content:flex-end"><button class="cb-btn go" data-act="spdone" ${all?'':'disabled'}>Xem kết quả</button></div></div></div></div>`}
  const R=2*Math.PI*64;const frac=E.sphase==='answer'?E.sleft/t.resp:1;
  return`<div class="cb">${top}
   <div class="cb-instr"><b>${pt.title} · lượt ${T.filter((x,i)=>x.pi===t.pi&&i<=E.si).length}/${pt.turns.length}</b><p>${pt.desc}</p></div>
   <div class="cb-main"><div class="cb-page">
    <div class="examiner">${EXAMINER}<div><div class="row" style="justify-content:space-between"><b>Examiner</b><button class="flagb" data-act="sptext" aria-pressed="${E.showText}">${E.showText?'Ẩn chữ':'Hiện chữ câu hỏi'}</button></div>
     <div class="say">${E.sphase==='ready'?'Bấm "Bắt đầu" khi bạn sẵn sàng. Giám khảo sẽ nói câu đầu tiên.':(E.showText||!hasTTS?esc(t.say):'<span class="muted">(Đang nghe giám khảo… bật "Hiện chữ" nếu cần)</span>')}</div></div></div>
    ${pt.card?cardHTML(pt.card):''}
    <div style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:14px">
     <div class="ring-timer" style="width:120px;height:120px;margin:0"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="#e3e6ef" stroke-width="12" fill="none"/><circle id="ringc" cx="75" cy="75" r="64" stroke="${E.sphase==='answer'?'#c2362b':'#2c5fd3'}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-frac)}"/></svg>
      <div id="ringt" style="font-family:var(--exam);font-size:1.8rem">${E.sphase==='answer'?E.sleft:'–'}<small>${({ready:'sẵn sàng',ask:'giám khảo nói',answer:'bạn trả lời'})[E.sphase]}</small></div></div>
     <div><p style="margin:0 0 10px;font-weight:700">${({ready:'Phần thi nói được mô phỏng với giám khảo ảo.',ask:'Hãy lắng nghe câu hỏi…',answer:'Bạn trả lời to thành tiếng ngay bây giờ.'})[E.sphase]}</p>
      <div class="row">${E.sphase==='ready'?`<button class="cb-btn pri" data-act="spgo">Bắt đầu</button>`:''}
       ${E.sphase==='ask'&&!hasTTS?`<button class="cb-btn pri" data-act="spans">Tôi đã đọc câu hỏi</button>`:''}
       ${E.sphase!=='ready'?`<button class="cb-btn" data-act="sprep">Nghe lại câu hỏi</button><button class="cb-btn go" data-act="spskip">${E.si<T.length-1?'Câu tiếp ›':'Kết thúc bài nói'}</button>`:''}
       <button class="cb-btn" data-act="spquit">Thoát</button></div></div></div>
   </div></div>
   <div class="cb-nav"><div class="cb-parts">${p.parts.map((x,i)=>`<span class="cb-part ${i===t.pi?'on':''}"><b>${x.title}</b><span>${x.turns.length} lượt</span></span>`).join('')}</div><div class="cb-nums"></div><span class="muted" style="font-size:.85rem">Lượt ${E.si+1}/${T.length}</span></div></div>`};
function spAsk(){const t=spTurns()[E.si];E.sphase='ask';render();if(!hasTTS)return;
  speakLines([['Examiner',t.say]],()=>{if(V.name==='speak'&&E.sphase==='ask'&&spTurns()[E.si]===t)spAnswer()})}
function spAnswer(){const t=spTurns()[E.si];E.sphase='answer';E.sleft=t.resp;render();clearInterval(tick);
  tick=setInterval(()=>{E.sleft--;const R=2*Math.PI*64;const c=$('#ringc'),tt=$('#ringt');if(c)c.setAttribute('stroke-dashoffset',R*(1-E.sleft/t.resp));if(tt)tt.firstChild.textContent=Math.max(0,E.sleft);
   if(E.sleft<=0){clearInterval(tick);sfx(true);spNext()}},1000)}
function spNext(){clearInterval(tick);stopSpeak();const T=spTurns();if(E.si<T.length-1){E.si++;spAsk()}else{E.sphase='rate';render()}}

/* =====================================================================
   AFTER RENDER (timers)
   ===================================================================== */
function after(){
  if(V.name==='room'&&V.sk!=='speaking'&&!V.done){clearInterval(tick);tick=setInterval(()=>{V.left--;const t=$('#timer');if(t){t.textContent=fmt(V.left);t.classList.toggle('low',V.left<=60)}
    if(V.left<=0){clearInterval(tick);if(V.sk==='writing'){V.done=true;toast('Hết giờ làm bài Viết! Hãy bấm Chấm thử.')}else{toast('Hết giờ! Bài đã được nộp tự động.');submit()}}},1000)}
  if(V.name==='challenge'&&V.q&&!V.end&&!tick){tick=setInterval(()=>{V.left--;const t=$('#timer');if(t){t.textContent=fmt(V.left);t.classList.toggle('low',V.left<=15)}if(V.left<=0)endChallenge()},1000)}
  if(V.name==='vset'&&V.mode==='spell'){const i=$('#spellin');if(i&&V.qsel===null){i.focus();i.onkeydown=e=>{if(e.key==='Enter')act('spellcheck')}}}
  if(V.name==='act'&&V.kind==='dict'){const i=$('#din');if(i&&!V.res[V.i]){i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();act('dcheck')}}}}
  if(V.name==='test'&&!E.review&&!tick){tick=setInterval(()=>{E.left--;const t=$('#cbtime');if(t)t.textContent=fmt(E.left);const c=$('#cbclock');if(c)c.classList.toggle('low',E.left<=300);
    if(E.left===300)toast('Còn 5 phút!');if(E.left<=0){clearInterval(tick);tick=null;E.modal=true;E.timeup=true;render()}},1000)}
}
function spTick(){clearInterval(tick);const it=EXAMS[V.ex].speaking[V.sp.i];
  tick=setInterval(()=>{V.sp.left--;const total=V.sp.phase==='prep'?it.prep:it.talk;const R=2*Math.PI*64;const c=$('#ringc'),t=$('#ringt');
    if(c)c.setAttribute('stroke-dashoffset',R*(1-V.sp.left/total));if(t)t.firstChild.textContent=V.sp.left;
    if(V.sp.left<=0){clearInterval(tick);if(V.sp.phase==='prep'){V.sp.phase='talk';V.sp.left=it.talk;sfx(true);render();spTick()}else{V.sp.phase='rate';sfx(true);render()}}},1000)}
function submit(){const e=EXAMS[V.ex];clearInterval(tick);stopSpeak();let sc=0,tot=0;
  if(V.sk==='listening'){const L1=e.listening;tot=L1.items.length;
    if(L1.mode==='each')L1.items.forEach((it,i)=>{if(V.ans[i]===it.a)sc++});else L1.items.forEach((it,i)=>{if(isGap(V.ans[i]||'',it.a))sc++});S.missions.listen++}
  else if(V.sk==='reading'){tot=e.reading.items.length;e.reading.items.forEach((it,i)=>{if(V.ans[i]===it.a)sc++})}
  V.done=true;V.score=sc;setBest(e.id,V.sk,sc,tot);reward(sc*10,sc);sfx(sc/tot>=.5);render();window.scrollTo({top:0,behavior:'smooth'})}
function endChallenge(){clearInterval(tick);tick=null;V.end=true;V.time=90-V.left;S.xp+=V.pts;S.coins+=V.right;touchStreak();if(V.right>=8)badge('flash');save();render()}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function act(a,arg,el){
  switch(a){
  case'go':go(arg);break;
  case'sound':S.sound=!S.sound;save();renderChips();break;
  case'claim':if(!S.missions.claimed.includes(arg)){S.missions.claimed.push(arg);S.coins+=20;save();sfx(true);toast('+20 xu! Nhiệm vụ hoàn thành.');render()}break;
  /* levels */
  case'level':go('level',{lv:arg});break;
  case'open':openAct(arg);break;
  case'unit':{const[l,u]=arg.split('|');go('unit',{lv:l,u:+u});break}
  case'mflip':{const i=+arg;if(V.open.length>=2||V.open.includes(i))break;V.open.push(i);
    if(V.open.length===2){V.moves++;const [a,b]=V.open.map(k=>V.cards[k]);
      if(a.k===b.k){V.got[a.k]=1;V.open=[];sfx(true);if(Object.keys(V.got).length===V.pairs){V.pct=Math.round(Math.max(0,Math.min(100,100-(V.moves-V.pairs)*8)));V.done=true;finishAct(V.pct)}render()}
      else{render();setTimeout(()=>{if(V.kind==='memory'){V.open=[];render()}},900)}}else render();break}
  case'hkey':{const w=V.items[V.i][0].toUpperCase();V.guess.push(arg);if(!w.includes(arg)){V.lives--;sfx(false)}else sfx(true);
    if(w.split('').every(c=>V.guess.includes(c))){V.state='win';V.won++;S.missions.vocab++;save()}else if(V.lives<=0)V.state='lose';render();break}
  case'hnext':if(V.i<V.items.length-1){Object.assign(V,{i:V.i+1,guess:[],lives:6,state:'play'});render()}else{V.pct=Math.round(V.won/V.items.length*100);V.done=true;finishAct(V.pct);render()}break;
  case'ssel':V.sel=+arg;render();break;
  case'sdrop':{if(V.sel==null){toast('Chọn một thẻ trước nhé.');break}const g=+arg;
    if(V.items[V.sel][1]===g){V.placed[V.sel]=g;V.sel=null;sfx(true);if(Object.keys(V.placed).length===V.items.length){V.pct=Math.round(V.items.length/(V.items.length+V.wrong)*100);V.done=true;finishAct(V.pct)}}
    else{V.wrong++;sfx(false);toast('Chưa đúng nhóm, thử lại!')}render();break}
  case'spk':V.pick.push(+arg);V.res=null;render();break;
  case'sbk':V.pick.splice(+arg,1);V.res=null;render();break;
  case'scheck':{const it=V.items[V.i];const s=V.pick.map(k=>it.tiles[k].t).join(' ');const ok=s===it.s;V.res=ok;if(ok){V.score+=V.tries?0.5:1;sfx(true)}else{V.tries++;sfx(false)}render();break}
  case'snext':if(V.i<V.items.length-1){Object.assign(V,{i:V.i+1,pick:[],tries:0,res:null});render()}else{V.done=true;finishAct(Math.round(V.score/V.items.length*100));render()}break;
  case'gslot':V.cur=+arg;render();break;
  case'gword':{let c=V.cur;if(c==null||V.fill[c]!=null)c=V.blanks.findIndex((_,i)=>V.fill[i]==null);if(c<0)break;V.fill[c]=arg;const nx=V.blanks.findIndex((_,i)=>V.fill[i]==null);V.cur=nx<0?null:nx;render();break}
  case'gclear':V.fill={};V.cur=0;render();break;
  case'gcheck':{V.checked=true;const ok=V.blanks.filter((b,i)=>(V.fill[i]||'').toLowerCase()===b.toLowerCase()).length;V.pct=Math.round(ok/V.blanks.length*100);sfx(V.pct>=70);render();break}
  case'gfin':V.done=true;S.missions.vocab+=2;finishAct(V.pct);render();break;
  case'wspin':{const n=V.qs.length;const free=V.qs.map((_,i)=>i).filter(i=>!V.used.includes(i));const i=free[Math.floor(Math.random()*free.length)];const seg=360/n;
    V.rot=V.rot-(V.rot%360)+1080+(360-(i+.5)*seg);V.cur=i;V.phase='spinning';render();
    setTimeout(()=>{if(V.kind!=='wheel'||V.cur!==i)return;V.used.push(i);V.phase='talk';V.left=V.jam?60:30;render();speakWord(V.jam?'Your topic is: '+V.qs[i]:V.qs[i]);
      clearInterval(tick);tick=setInterval(()=>{V.left--;const R=2*Math.PI*64;const c=$('#ringc'),t=$('#ringt');if(c)c.setAttribute('stroke-dashoffset',R*(1-V.left/(V.jam?60:30)));if(t)t.firstChild.textContent=Math.max(0,V.left);if(V.left<=0){clearInterval(tick);sfx(true);V.phase='spin';render()}},1000)},2100);break}
  case'wnext':clearInterval(tick);stopSpeak();V.phase='spin';render();break;
  case'wrate':V.phase='rate';render();break;
  case'wdone':V.pct=ratePct(TALK_CRIT,V.stars);V.done=true;S.missions.speak++;finishAct(V.pct);render();break;
  case'mopen':{const i=+arg;V.cur=i;V.sel=null;const b=V.boxes[i];if(b.bonus){V.openB[i]='bonus';S.coins+=b.bonus;save();renderChips();sfx(true)}render();break}
  case'mpick':{const b=V.boxes[V.cur];V.sel=+arg;const ok=V.sel===b.q.a;if(ok)V.right++;V.openB[V.cur]=ok?'ok':'bad';sfx(ok);render();break}
  case'mclose':V.cur=null;V.sel=null;if(Object.keys(V.openB).length===V.boxes.length){V.pct=Math.round(V.right/V.total*100);V.done=true;finishAct(V.pct)}render();break;
  case'mlpick':{const q=V.qs[V.i];V.sel=+arg;sfx(V.sel===q.a);render();break}
  case'mlnext':{const q=V.qs[V.i];if(V.sel===q.a&&V.i<V.qs.length-1){V.i++;V.sel=null;V.hidden=[];render()}else{const reached=V.sel===q.a?V.i+1:V.i;V.pct=Math.round(reached/V.qs.length*100);V.done=true;finishAct(V.pct);render()}break}
  case'ml5050':{const q=V.qs[V.i];V.hidden=shuffle(q.opts.map((_,j)=>j).filter(j=>j!==q.a)).slice(0,Math.min(2,q.opts.length-2));V.used5050=true;render();break}
  case'mlswap':V.qs[V.i]=V.spare.pop();V.usedSwap=true;V.hidden=[];render();break;
  case'mlstop':V.pct=Math.round(V.i/V.qs.length*100);V.done=true;finishAct(V.pct);render();break;
  case'epick':{const it=V.items[V.i];V.sel=+arg;const ok=!!it.toks[V.sel].bad;if(ok){V.score++;S.missions.grammar=(S.missions.grammar||0)+1;save()}sfx(ok);render();break}
  case'enext':if(V.i<V.items.length-1){V.i++;V.sel=null;render()}else{V.done=true;finishAct(Math.round(V.score/V.items.length*100));render()}break;
  case'tbgo':V.phase='go';V.left=45;render();clearInterval(tick);tick=setInterval(()=>{V.left--;const R=2*Math.PI*64;const c=$('#ringc'),t=$('#ringt');if(c)c.setAttribute('stroke-dashoffset',R*(1-V.left/45));if(t)t.firstChild.textContent=Math.max(0,V.left);if(V.left<=0)tbNext(false)},1000);break;
  case'tbok':tbNext(true);break;
  case'tbskip':tbNext(false);break;
  case'xpick':{const k=V.locks[V.i];const j=+arg;if(j===k.a){V.sel=j;xSolve(true)}else{V.sel=null;xSolve(false)}break}
  case'xerr':{const k=V.locks[V.i];V.sel=+arg;xSolve(!!k.toks[V.sel].bad);break}
  case'xpk':V.pick.push(+arg);render();break;
  case'xbk':V.pick.splice(+arg,1);render();break;
  case'xchk':{const k=V.locks[V.i];const ok=V.pick.map(x=>k.tiles[x].t).join(' ')===k.s;if(!ok)V.pick=[];xSolve(ok);break}
  case'xnext':if(V.i<3){Object.assign(V,{i:V.i+1,sel:null,pick:[],solved:false,msg:''});render()}else{V.pct=Math.round(4/(4+V.tries)*100);V.done=true;badge('first');finishAct(V.pct);render()}break;
  case'jopen':{const[ci,r]=arg.split('|').map(Number);V.cur=[ci,r];V.sel=null;render();break}
  case'jpick':{const[ci,r]=V.cur;const q=V.cols[ci][1][r];V.sel=+arg;const ok=V.sel===q.a;if(ok)V.pts+=(r+1)*200;V.jd[ci+'-'+r]=ok?'ok':'bad';sfx(ok);render();break}
  case'jclose':V.cur=null;V.sel=null;if(Object.keys(V.jd).length>=V.cols.reduce((a,c)=>a+c[1].length,0)){V.pct=Math.round(V.pts/V.jmax*100);V.done=true;finishAct(V.pct)}render();break;
  case'spdgo':V.phase='play';V.left=60;render();clearInterval(tick);tick=setInterval(()=>{V.left--;const t=$('#timer');if(t){t.textContent=fmt(V.left);t.classList.toggle('low',V.left<=10)}if(V.left<=0){clearInterval(tick);V.pct=Math.min(100,Math.round(V.right/8*100));V.done=true;finishAct(V.pct);render()}},1000);break;
  case'spdpick':{const q=V.pool[V.i%V.pool.length];const ok=+arg===q.a;if(ok)V.right++;else V.wrong++;sfx(ok);V.i++;render();break}
  case'gapchk':{const it=V.items[V.i];const v=($('#gapin')||{}).value||'';if(!v.trim()){toast('Hãy nhập đáp án.');break}V.val=v;V.res[V.i]=isGap(v,it[1]);sfx(V.res[V.i]);render();break}
  case'bkpick':{const it=V.B.parts[V.pi].items[V.i];V.sel=+arg;const ok=V.sel===it.a;V.res[V.pi+'-'+V.i]=ok;if(ok)V.ok++;sfx(ok);render();break}
  case'bkchk':{const it=V.B.parts[V.pi].items[V.i];const v=($('#bkin')||{}).value||'';if(!v.trim()){toast('Hãy nhập đáp án.');break}V.val=v;const ok=isGap(v,it.ans);V.res[V.pi+'-'+V.i]=ok;if(ok)V.ok++;sfx(ok);render();break}
  case'bknext':{const P=V.B.parts[V.pi];V.sel=null;V.val='';if(V.i<P.items.length-1)V.i++;else if(V.pi<V.B.parts.length-1){V.pi++;V.i=0;V.scr=false;stopSpeak()}else{V.done=true;stopSpeak();finishAct(Math.round(V.ok/bkTotal()*100))}render();break}
  case'bkplay':{const P=V.B.parts[V.pi];if(P.script)speakLines(P.script,null);break}
  case'bkstop':stopSpeak();break;
  case'bkscript':V.scr=!V.scr;render();break;
  case'gapnext':if(V.i<V.items.length-1){V.i++;V.val='';render()}else{V.done=true;const sc=V.items.filter((_,i)=>V.res[i]).length;finishAct(Math.round(sc/V.items.length*100));render()}break;
  case'chest':{const[lv,i]=arg.split('|');const key=lv+i;if(S.chest[key])break;S.chest[key]=1;const c=CHESTS[+i][1];S.coins+=c;save();sfx(true);toast(`Mở rương! +${c} xu`);render();break}
  case'say':speakWord(arg);break;
  case'arate':{const[key,k,n]=arg.split('|');V[key][k]=+n;render();break}
  case'mcpick':{const it=V.items[V.i];V.sel=+arg;const ok=V.sel===it.a;if(ok){V.score++;S.missions.vocab++;save()}sfx(ok);render();break}
  case'mcnext':if(V.i<V.items.length-1){V.i++;V.sel=null;render();if(V.items[V.i].audio)speakWord(V.items[V.i].audio)}else{V.done=true;finishAct(Math.round(V.score/V.items.length*100));render()}break;
  case'shplay':{const [en]=V.items[V.i];karaoke(en,+arg);break}
  case'shrep':{const [en]=V.items[V.i];const i=V.i;el.disabled=true;karaoke(en,0.9,()=>{if(V.name!=='act'||V.i!==i)return;V.reps[i]=Math.min(3,(V.reps[i]||0)+1);sfx(true);render()});break}
  case'shnext':V.i++;stopSpeak();render();break;
  case'shdone':V.pct=ratePct(SH_CRIT,V.stars);V.done=true;S.missions.speak++;finishAct(V.pct);render();break;
  case'dplay':{V.val=($('#din')||{}).value||V.val;if(!V.res[V.i])V.plays[V.i]=(V.plays[V.i]||0)+1;const r=+arg;const s=V.items[V.i];render();speakSentence(s,r);break}
  case'dcheck':{const v=($('#din')||{}).value||'';if(!v.trim()){toast('Hãy gõ câu bạn nghe được.');break}V.val=v;V.res[V.i]=lcsMark(V.items[V.i],v);sfx(V.res[V.i].score>=.8);render();break}
  case'dnext':if(V.i<V.items.length-1){V.i++;V.val='';render()}else{V.done=true;S.missions.listen++;const avg=Math.round(V.items.reduce((a,_,i)=>a+(V.res[i]?V.res[i].score:0),0)/V.items.length*100);finishAct(avg);render()}break;
  case'lsend':{const t=LETTERS[V.L];const txt=S.drafts['L.'+V.L]||'';if(words(txt)<10){toast('Hãy viết thêm trước khi gửi nhé.');break}V.res=gradeText(t,txt);V.done=true;S.missions.write++;finishAct(V.res.pct);render();break}
  case'tside':V.side=arg;V.phase='idle';render();break;
  case'tshowq':V.showQ=true;render();break;
  case'tstart':tBegin();break;
  case'tskiplisten':stopSpeak();tAfterListen();break;
  case'ttalk':tPhase('talk');break;
  case'tnext':tAdvance();break;
  case'tdone':{const T=TALKS[V.T];const crit=T.debate?DEB_CRIT:TALK_CRIT;V.pct=ratePct(crit,V.stars);V.done=true;S.missions.speak++;if(T.debate)badge('debater');finishAct(V.pct);render();break}
  case'saysample':speakLines([['A',TALKS[V.T].sample]]);break;
  case'drun':{V.mode=arg;V.idx=0;V.dtok=(V.dtok||0)+1;dubStep(V.dtok);break}
  case'dstop':V.dtok=(V.dtok||0)+1;stopSpeak();V.mode=null;V.idx=-1;render();break;
  case'dfinish':V.phase='rate';render();break;
  case'ddone':V.pct=ratePct(DUB_CRIT,V.stars);V.done=true;S.missions.speak++;finishAct(V.pct);render();break;
  /* vocab & grammar stations */
  case'vmode':{const s=VOCAB.find(x=>x.id===V.set);Object.assign(V,{mode:arg,qz:makeVQuiz(s),qi:0,qsel:null,qscore:0,spv:'',flip:false,rec:null});render();break}
  case'flip':V.flip=!V.flip;$('.flash').classList.toggle('flip',V.flip);break;
  case'card':{const s=VOCAB.find(x=>x.id===V.set);V.ci=(V.ci+Number(arg)+s.words.length)%s.words.length;V.flip=false;render();break}
  case'known':if(S.known[arg])delete S.known[arg];else{S.known[arg]=1;reward(2,0);if(Object.keys(S.known).length>=30)badge('words')}save();render();break;
  case'vpick':{const it=V.qz[V.qi];V.qsel=+arg;const ok=V.qsel===it.a;if(ok){V.qscore++;S.missions.vocab++;save()}sfx(ok);render();break}
  case'spellcheck':{const it=V.qz[V.qi];const v=($('#spellin')||{}).value||'';V.spv=v;const ok=norm(v)===norm(it.w[0]);V.qsel=ok;if(ok){V.qscore++;S.missions.vocab++;save()}sfx(ok);render();break}
  case'vnext':V.qi++;V.qsel=null;V.spv='';if(V.qi>=V.qz.length){const s=VOCAB.find(x=>x.id===V.set);if(V.qscore===V.qz.length)s.words.forEach(w=>S.known[w[0]]=1);if(Object.keys(S.known).length>=30)badge('words');finishAct(Math.round(V.qscore/V.qz.length*100))}render();break;
  case'gpick':{const it=V.q[V.qi];V.qsel=+arg;const ok=V.qsel===it[2];if(ok){V.qscore++;S.missions.grammar=(S.missions.grammar||0)+1;save()}sfx(ok);render();break}
  case'gnext':V.qi++;V.qsel=null;if(V.qi>=V.q.length)finishAct(Math.round(V.qscore/V.q.length*100));render();break;
  /* luyện đề */
  case'room':{const[ex,sk]=arg.split('|');if(ex==='ket')go('ketbank',{sk:sk||'listening',q:''});else startRoom(ex,sk);break}
  case'room2':{const[ex,sk]=arg.split('|');startRoom(ex,sk);break}
  case'retry':if(V.name==='room')startRoom(V.ex,V.sk);else go('challenge');break;
  case'pick':{const[i,j]=arg.split('|').map(Number);V.ans[i]=j;el.parentNode.querySelectorAll('.opt').forEach((b,k)=>b.setAttribute('aria-pressed',k===j));break}
  case'listen':{const e=EXAMS[V.ex];const key=arg;const lines=key==='all'?e.listening.script:e.listening.items[+key].script;
    if(!V.done)V.plays[key]=(V.plays[key]||0)+1;const box=$('#pl-'+key);
    if(box){box.classList.add('playing');box.querySelector('button').disabled=true;box.querySelector('.muted').textContent='Đang phát…'}
    speakLines(lines,()=>{const b=$('#pl-'+key);if(b){b.classList.remove('playing');const used=V.plays[key]||0;b.querySelector('button').disabled=used>=2&&!V.done;b.querySelector('.muted').textContent=`đã nghe ${used}/2`}});break}
  case'submit':{const L1=EXAMS[V.ex].listening;const un=V.sk==='listening'&&L1.mode==='form'?0:EXAMS[V.ex][V.sk].items.filter((_,i)=>V.ans[i]===undefined).length;
    if(un&&!V.warned){V.warned=true;toast(`Còn ${un} câu chưa làm. Bấm Nộp bài lần nữa để nộp.`);break}submit();break}
  case'wtask':V.wi=+arg;V.showModel=false;render();break;
  case'wmodel':V.showModel=!V.showModel;render();break;
  case'wsubmit':{const e=EXAMS[V.ex];const t=e.writing[V.wi];const txt=S.drafts[e.id+'.w'+V.wi]||'';if(words(txt)<5){toast('Hãy viết bài trước khi chấm nhé.');break}
    const r=gradeText(t,txt);V.wres=V.wres||{};V.wres[V.wi]=r;V.wcount=V.wcount||{};if(!V.wcount[V.wi]){V.wcount[V.wi]=1;S.missions.write++}
    setBest(e.id,'writing',r.pct,100);reward(Math.round(r.pct/4),Math.round(r.pct/20));sfx(r.pct>=60);render();break}
  case'spstart':{const it=EXAMS[V.ex].speaking[V.sp.i];V.sp.phase='prep';V.sp.left=it.prep;render();spTick();break}
  case'sptalk':{const it=EXAMS[V.ex].speaking[V.sp.i];V.sp.phase='talk';V.sp.left=it.talk;render();spTick();break}
  case'spstop':clearInterval(tick);V.sp.phase='rate';render();break;
  case'srate':{const[k,n]=arg.split('|');V.sp.stars[V.sp.i]=Object.assign(V.sp.stars[V.sp.i]||{},{[k]:+n});render();break}
  case'sample':speakLines([['A',EXAMS[V.ex].speaking[V.sp.i].sample]]);break;
  case'spnext':{const items=EXAMS[V.ex].speaking;if(V.sp.i<items.length-1){V.sp.i++;V.sp.phase='idle';render()}else{V.sp.phase='end';const tot=items.reduce((a,_,i)=>a+avgStar(i),0)/items.length;setBest(V.ex,'speaking',Math.round(tot*10)/10,5);S.missions.speak++;reward(Math.round(tot*8),Math.round(tot*2));sfx(true);render()}break}
  /* challenge */
  case'newcode':V.code=newCode();render();break;
  case'copy':try{navigator.clipboard.writeText(arg).then(()=>toast('Đã sao chép mã '+arg),()=>toast('Mã của bạn: '+arg))}catch(e){toast('Mã của bạn: '+arg)}break;
  case'joincode':{const v=(($('#'+arg)||{}).value||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(v)){toast('Mã gồm đúng 6 chữ hoặc số.');break}go('challenge',{code:v});act('cstart',v);break}
  case'cstart':clearInterval(tick);tick=null;Object.assign(V,{code:arg,q:buildChallenge(arg),qi:0,qsel:null,right:0,pts:0,combo:0,left:90,end:false});render();break;
  case'cpick':{if(V.qsel!=null)break;const it=V.q[V.qi];V.qsel=+arg;const ok=V.qsel===it.a;if(ok){V.right++;V.combo++;V.pts+=10*Math.min(V.combo,4)}else V.combo=0;sfx(ok);
    render();setTimeout(()=>{if(V.name!=='challenge'||V.end)return;V.qi++;V.qsel=null;if(V.qi>=V.q.length)endChallenge();else render()},ok?600:1300);break}
  case'reset':V.confirmReset=true;render();break;
  case'resetno':V.confirmReset=false;render();break;
  case'resetyes':S=fresh();save();V.confirmReset=false;toast('Đã đặt lại tiến độ.');render();break;
  /* thi thật */
  case'checkin':{const[ex,p]=arg.split('|');go('checkin',{exam:ex,paper:p,cand:String(Math.floor(100000+Math.random()*900000))});break}
  case'soundcheck':speakLines([['Examiner','Hello. This is a sound check. If you can hear this clearly, you are ready to begin.']]);break;
  case'begin':{const name=(($('#cname')||{}).value||'').trim();if(!name){toast('Hãy nhập họ tên thí sinh.');const c=$('#cname');if(c)c.focus();break}
    S.name=name;save();const p=MOCK[V.exam].papers.find(x=>x.id===V.paper);
    E={exam:V.exam,paper:V.paper,cand:V.cand,name,part:0,ans:{},flag:{},played:{},wchoice:{},left:p.mins*60,review:false,modal:false,hideTime:false,playing:null};
    if(p.speaking){Object.assign(E,{si:0,sphase:'ready',sleft:0,showText:!hasTTS,rate:{}});go('speak')}else go('test');break}
  case'cbpick':{const[n,j]=arg.split('|').map(Number);E.ans[n]=j;el.parentNode.querySelectorAll('.cbo').forEach((b,k)=>{b.setAttribute('aria-pressed',k===j);b.setAttribute('aria-checked',k===j)});updateNav();break}
  case'cbflag':{const n=+arg;E.flag[n]=!E.flag[n];el.setAttribute('aria-pressed',E.flag[n]);el.textContent=E.flag[n]?'Đã đánh dấu':'Đánh dấu';updateNav();break}
  case'cbpart':{const i=+arg;const p=paperOf();if(i<0||i>=p.parts.length)break;E.part=i;$('#exam').innerHTML=VIEWS.test();const m=$('#cbmain');if(m)m.scrollTop=0;break}
  case'cbgo':{const n=+arg;const t=$('#qq-'+n)||$('#q-'+n);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});const f=$('#q-'+n);if(f)f.focus({preventScroll:true})}break}
  case'cbhide':E.hideTime=!E.hideTime;$('#exam').innerHTML=VIEWS.test();break;
  case'cbchoice':{const[pi,j]=arg.split('|').map(Number);E.wchoice[pi]=j;$('#exam').innerHTML=VIEWS.test();break}
  case'cbplay':{const pi=+arg;const part=paperOf().parts[pi];if((E.played[pi]&&!E.review)||E.playing!=null)break;E.played[pi]=true;E.playing=pi;
    const lines=[];part.audio.forEach(s=>{lines.push(['Narrator',s.label]);lines.push(...s.lines);lines.push(['Narrator','Now listen again.']);lines.push(...s.lines)});
    lines.push(['Narrator','That is the end of '+part.title+'.']);E.playMsg='Đang phát '+part.title+' (mỗi đoạn 2 lần)…';
    $('#exam').innerHTML=VIEWS.test();
    speakLines(lines,()=>{if(!E)return;E.playing=null;if(V.name==='test'&&E.part===pi){const a2=$('#aud');if(a2){a2.classList.remove('on');$('#audst').textContent=E.review?'Chế độ xem lại.':'Đã phát xong phần này.';const b=a2.querySelector('.pbtn');b.textContent=E.review?'Nghe lại':'Đã phát';b.disabled=!E.review}}});
    if(!hasTTS)toast('Trình duyệt không hỗ trợ đọc tự động. Hãy dùng Chrome hoặc Edge.');break}
  case'cbfinish':E.modal=true;E.timeup=false;$('#exam').innerHTML=VIEWS.test();break;
  case'cbcancel':E.modal=false;$('#exam').innerHTML=VIEWS.test();break;
  case'cbsubmit':finishMock();break;
  case'cbreview':E.review=true;E.part=0;E.playing=null;go('test');break;
  case'cbexit':go('mockres');break;
  case'spgo':spAsk();break;
  case'spans':spAnswer();break;
  case'spskip':spNext();break;
  case'sprep':{clearInterval(tick);const t=spTurns()[E.si];E.sphase='ask';render();speakLines([['Examiner',t.say]],()=>{if(V.name==='speak'&&E.sphase==='ask')spAnswer()});break}
  case'sptext':E.showText=!E.showText;render();break;
  case'spquit':clearInterval(tick);stopSpeak();go('mock');break;
  case'srt':{const[k,n]=arg.split('|');E.rate[k]=+n;render();break}
  case'spdone':{const sum=CRIT.reduce((a,[k])=>a+E.rate[k],0);const pct=Math.round(sum/20*100);const p=paperOf();
    E.result={rows:CRIT.map(([k,en])=>({title:en,score:E.rate[k],total:5})),got:sum,tot:20,pct};
    S.name=E.name;S.mocks.push({exam:E.exam,short:MOCK[E.exam].short,paper:p.name,paperId:p.id,name:E.name,pct,grade:gradeOf(E.exam,pct)[1],at:Date.now()});badge('mock');reward(pct,Math.round(pct/5));go('mockres');break}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg,b)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.gap!==undefined)V.ans[t.dataset.gap]=t.value;
  if(t.id==='din')V.val=t.value;
  if(t.id==='wtext'){S.drafts[t.dataset.wkey]=t.value;save();const ex=EXAMS[V.ex].writing[V.wi];const n=words(t.value);
    $('#wcn').textContent=n;const bar=$('#wcbar');bar.style.width=Math.min(100,n/ex.min*100)+'%';bar.classList.toggle('done',n>=ex.min);$('#wchecks').innerHTML=checks(ex,t.value)}
  if(t.id==='ltext'){S.drafts[t.dataset.lkey]=t.value;save();const lt=LETTERS[V.L];const n=words(t.value);
    $('#lcn').textContent=n;const bar=$('#lcbar');bar.style.width=Math.min(100,n/lt.min*100)+'%';bar.classList.toggle('done',n>=lt.min);$('#lchecks').innerHTML=checks(lt,t.value)}
  if(E&&t.dataset.cb!==undefined&&t.tagName==='INPUT'){E.ans[+t.dataset.cb]=t.value;updateNav()}
  if(E&&t.dataset.cbw!==undefined){E.ans[+t.dataset.cbw]=t.value;const w=$('#wc-'+t.dataset.cbw);if(w)w.textContent=words(t.value);updateNav()}
});
document.addEventListener('change',e=>{const t=e.target;if(E&&t.tagName==='SELECT'&&t.dataset.cb!==undefined){E.ans[+t.dataset.cb]=t.value===''?undefined:+t.value;updateNav()}});
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag]');if(t){V.sel=+t.dataset.drag;try{e.dataTransfer.setData('text/plain',t.dataset.drag)}catch(x){}}});
document.addEventListener('dragover',e=>{const b=e.target.closest('[data-drop]');if(b){e.preventDefault();b.classList.add('over')}});
document.addEventListener('dragleave',e=>{const b=e.target.closest('[data-drop]');if(b)b.classList.remove('over')});
document.addEventListener('drop',e=>{const b=e.target.closest('[data-drop]');if(b&&V.kind==='sort'){e.preventDefault();act('sdrop',b.dataset.drop)}});
(function(){try{const q=new URLSearchParams(location.search);const lv=q.get('lv'),vw=q.get('view');if(lv&&typeof LEVELS!=='undefined'&&LEVELS.find(x=>x.id===lv))V={name:'level',lv};else if(vw&&VIEWS[vw]&&!/^(mock|checkin|mockres)$/.test(vw))V={name:vw};}catch(e){}})();
render();
</script>
