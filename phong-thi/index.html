const LV_BOOK={fd:'Foundation',a1:'Gold Experience A1',a2:'Gold Experience A2',b1:'Gold Experience B1',pi:'Gold Experience B1+'};
function P(arr){return arr.map(([l,r])=>[l,new RegExp(r,'i')])}
function mkUnit(lv,n,title,d,plan){const uid=`${lv}-u${n}`;const book=LV_BOOK[lv];
  if(d.w)VOCAB.push({id:uid+'-w',bookName:book,title:title,unit:'Unit '+n,words:d.w});
  if(d.g)GRAMMAR.push({id:uid+'-g',title:d.g.t,tag:book+' · Unit '+n,rule:d.g.r,items:d.g.i});
  if(d.s){SHADOW[uid]=d.s.map(x=>Array.isArray(x)?x:[x,'']);DICT[uid]=d.s.map(x=>Array.isArray(x)?x[0]:x)}
  if(d.sp&&d.sp.turns)TALKS[uid+'-sp']=Object.assign({kind:'Nói',title:title,phrases:[]},d.sp);
  if(d.wr)LETTERS[uid+'-wr']=Object.assign({kind:'Viết',stamp:'IVY',from:'Bài viết · Unit '+n},d.wr,{points:P(d.wr.points)});
  const acts=[];const add=(type,o={})=>acts.push(Object.assign({id:`${uid}-${type}`,type,uid,title:TYPE[type][0]},o));
  plan.forEach(t=>{
   if(t==='vocab')add('vocab',{set:uid+'-w',title:'Thẻ từ vựng: '+title});
   else if(t==='grammar')add('grammar',{g:uid+'-g',title:'Ngữ pháp: '+d.g.t});
   else if(t==='memory')add('memory',{set:uid+'-w',pairs:d.pairs});
   else if(t==='hangman')add('hangman',{set:uid+'-w'});
   else if(t==='sort')add('sort',{sort:d.sort,title:'Kéo vào nhóm: '+d.sort.t});
   else if(t==='scramble')add('scramble');
   else if(t==='gapbank')add('gapbank');
   else if(t==='wheel')add('wheel',{qs:d.sp.wheel,phrases:d.sp.phrases||[]});
   else if(t==='talk')add('talk',{talk:d.sp.ref||uid+'-sp',title:'Nói: '+(d.sp.title||title)});
   else if(t==='jam')add('jam',{topics:d.jam});
   else if(t==='letter')add('letter',{letter:uid+'-wr',title:'Viết: '+d.wr.title});
   else if(t==='shadow')add('shadow',{sh:uid});
   else if(t==='dict')add('dict',{dict:uid});
   else if(t==='lw')add('lw',{sets:[uid+'-w']});
   else if(t==='gap')add('gap',{items:d.gap,title:d.gapTitle||'Word formation'});
   else if(t==='tfng')add('tfng',{tf:d.tf,title:'IELTS Reading: '+d.tf.title});
   else add(t)});
  return{n,title,topic:d.topic||'',acts}}

  s:[['She speaks English with a lovely accent.','Bạn ấy nói tiếng Anh với giọng rất dễ thương.'],['I was chatting with my friend when the teacher came in.','Mình đang nói chuyện với bạn thì cô giáo bước vào.'],['Could you tell me what this word means?','Bạn cho mình biết từ này nghĩa là gì nhé?']],

  sp:{title:'Mô tả ảnh',turns:[{card:'<div class="photo"><b>Your photograph</b>Two teenagers are standing at a train station in a foreign country. One is holding a map and pointing at it. The other is talking to an older man who is wearing a uniform. They look a little confused, but the man is smiling and making a gesture with his hand.</div>',prep:20,talk:60}],phrases:['In this photo I can see…','It looks like… / They seem to be…','Maybe they are… because…','I think they feel…'],sample:'In this photo I can see two teenagers at a train station, probably in another country. On the left, one boy is holding a map and pointing at something. The other boy is talking to an older man in a uniform; maybe he works at the station. They seem a bit confused, perhaps because they don\'t speak the language. However, the man is smiling and making a gesture, so I think he is helping them find the right platform.'},
  wr:{title:'Story: lost in translation',letter:'<p><b>Write a story beginning with:</b> "I couldn\'t understand a single word."</p>',task:'Viết khoảng 100 từ, kết hợp quá khứ đơn và quá khứ tiếp diễn.',min:100,points:[['Câu mở đầu','i couldn\'t understand a single word'],['Quá khứ tiếp diễn','\\b(was|were) \\w+ing'],['Quá khứ đơn','\\b(said|told|asked|smiled|realised|found|went)\\b'],['Từ nối','then|suddenly|while|when|in the end|finally']],model:'I couldn\'t understand a single word. I was standing in a small café in Tokyo and the waiter was speaking very fast in Japanese. My mum was looking at the menu, but it had no pictures. Then I had an idea. I took out my phone and opened a translation app. While the waiter was waiting, I typed "two noodle soups, please". He read it and laughed. Suddenly he said in English, "No problem!" In the end, we had the best noodles of our trip, and I decided to learn some Japanese.'}},

 [3,'Technology at home',{topic:'should / ought to · thì tương lai · đưa ý kiến',w:[['charger','n','bộ sạc','I forgot my phone charger.'],['robot vacuum','n','robot hút bụi','Our robot vacuum cleans the floor.'],['smart speaker','n','loa thông minh','Ask the smart speaker about the weather.'],['switch on','phr v','bật','Switch on the light, please.'],['switch off','phr v','tắt','Switch off your phone at night.'],['plug in','phr v','cắm điện','Plug in the laptop.'],['set up','phr v','cài đặt','Can you help me set up the Wi-Fi?'],['battery','n','pin','My battery is almost empty.']],
  g:{t:'should / ought to · future forms',r:'<b>should / ought to + V</b>: lời khuyên. Tương lai: <b>will</b> (dự đoán), <b>be going to</b> (dự định), <b>present simple</b> (lịch trình: The film starts at…).',i:[['You ___ switch off your phone at night.',['ought','ought to','should to','must to'],1,'ought to + V.'],["You shouldn't ___ your charger in the sun.",['leave','leaving','to leave','left'],0,"shouldn't + V."],['I think robots ___ do all the cleaning one day.',['are','will','going','is going'],1,'Dự đoán → will.'],["My tablet is broken. I'm going ___ a new one.",['buy','to buy','buying','bought'],1,'be going to + V.'],['The film ___ at 7.30 tonight.',['start','starts','is start','started'],1,'Lịch trình → hiện tại đơn.']]},
  s:[['You should switch off the lights when you leave.','Bạn nên tắt đèn khi ra ngoài.'],['In my opinion, smart speakers are really useful.','Theo mình, loa thông minh rất hữu ích.'],['I am going to set up my new laptop tonight.','Tối nay mình sẽ cài đặt laptop mới.']],
  sp:{title:'Thảo luận: robot trong nhà',turns:[{say:'Would you like to have a robot at home? What would it do?',talk:40},{say:'Do you think we use too many gadgets at home?',talk:40},{say:'Which household job should never be done by a robot? Why?',talk:40},{say:'What advice would you give to someone who spends too long on their phone?',talk:40}],phrases:['I reckon…','I see what you mean, but…','I totally agree / disagree.','You should / ought to…']},
  wr:{title:'Email: advice',from:'Leo · Toronto, Canada',stamp:'CA',letter:'<p>Hi! My parents say I spend too much time on my phone. I use it until midnight and I\'m always tired at school. What do you think I should do? – Leo</p>',task:'Viết email khoảng 100 từ: đồng cảm, đưa 3 lời khuyên có lý do, gợi ý một hoạt động thay thế.',min:100,points:[['Đồng cảm','sorry|understand|i know how'],['Lời khuyên','should|ought to|why don\'t you|it\'s a good idea'],['Lý do','because|so that|that way'],['Gợi ý thay thế','instead|try|how about'],['Kết thư','best wishes|good luck|take care|bye']],model:'Hi Leo,\nI understand how you feel. I used to have the same problem!\nFirst, you ought to switch off your phone at least an hour before bed, because the light from the screen makes it harder to sleep. Secondly, why don\'t you leave your charger in the living room? That way you won\'t take the phone to bed. Finally, you should set a time limit in your settings.\nInstead of scrolling, how about reading a book or listening to calm music? I think you\'ll feel much better at school.\nGood luck,\nTrang'}},

 [4,'Sport',{topic:'present perfect vs past simple · mô tả ảnh · article',w:[['athlete','n','vận động viên','She is a professional athlete.'],['tournament','n','giải đấu','Our team won the tournament.'],['referee','n','trọng tài','The referee blew the whistle.'],['train','v','tập luyện','He trains every morning.'],['beat','v','đánh bại','We beat them 3–1.'],['draw','n/v','trận hòa; hòa','The match ended in a draw.'],['medal','n','huy chương','She won a gold medal.'],['spectator','n','khán giả (thể thao)','Thousands of spectators came.']],
  g:{t:'Present perfect vs past simple',r:'<b>Hiện tại hoàn thành</b>: kinh nghiệm, kết quả liên quan hiện tại (so far, ever, since, for). <b>Quá khứ đơn</b>: thời điểm xác định (last…, in 2020, ago).',i:[['She ___ three medals so far this year.',['won','has won','wins','is winning'],1,'so far → HTHT.'],['They ___ the final last Sunday.',['have lost','lost','lose','have lose'],1,'last Sunday → QKĐ.'],['Have you ever ___ in a tournament?',['play','played','playing','plays'],1,'have + V3.'],['The match ended in a ___: 2–2.',['draw','beat','win','score'],0,'2–2 → a draw.'],['He has trained here ___ he was eight.',['for','since','ago','from'],1,'since + mốc.']]},
  s:[['Our team has won the school tournament twice.','Đội bọn mình đã vô địch giải của trường hai lần.'],['The referee blew the whistle and the match began.','Trọng tài thổi còi và trận đấu bắt đầu.'],['Training every day is hard, but it is worth it.','Tập luyện mỗi ngày rất vất vả, nhưng xứng đáng.']],
  sp:{title:'Mô tả ảnh: thể thao',turns:[{card:'<div class="photo"><b>Your photograph</b>A school sports day on a hot afternoon. In the foreground, four girls are running a relay race; one is passing a baton to her teammate. In the background, students are cheering and holding colourful signs. A teacher with a whistle is standing near the finish line.</div>',prep:20,talk:60}],phrases:['This photo shows…','In the foreground… / In the background…','It looks as if…','They must be feeling…']},
  wr:{title:'Article: a sport I\'ve tried',letter:'<p><b>Articles wanted!</b> "A sport I have tried." What sport was it? What was it like? Would you recommend it to other teenagers?</p>',task:'Viết article khoảng 100 từ, có tiêu đề, dùng từ nối để liên kết ý.',min:100,points:[['Tiêu đề','^.{3,60}\\n'],['Present perfect','\\b(have|has|\'ve) (tried|played|done|been)'],['Quá khứ đơn','\\b(was|went|felt|fell|learned|learnt)\\b'],['Từ nối','however|although|also|first|in addition|but'],['Lời khuyên','recommend|should try|give it a try']],model:'Climbing: Harder Than It Looks!\nHave you ever tried rock climbing? I hadn\'t, until last summer when my cousin took me to an indoor climbing centre in Ha Noi.\nAt first, I was terrified. The wall was much higher than I expected and my arms got tired very quickly. However, the instructor was patient and showed me how to use my legs, not just my arms. After an hour, I reached the top!\nSince then, I\'ve been back five times. It\'s great exercise and it builds confidence. I definitely recommend it, but wear comfortable shoes!'}},

 [5,'In the spotlight',{topic:'câu điều kiện 0, 1, 2 · unless · in case',w:[['celebrity','n','người nổi tiếng','Many teenagers follow celebrities online.'],['talent show','n','cuộc thi tài năng','She won a talent show on TV.'],['audition','n','buổi thử giọng','I have an audition tomorrow.'],['famous','adj','nổi tiếng','He became famous at sixteen.'],['spotlight','n','ánh đèn sân khấu, sự chú ý','She loves being in the spotlight.'],['perform','v','biểu diễn','They performed a dance.'],['rehearse','v','tập dượt','We rehearse every Friday.'],['review','n','bài phê bình','The film got great reviews.']],
  g:{t:'Câu điều kiện 0, 1, 2',r:'<b>Loại 0</b>: If + HTĐ, HTĐ (sự thật). <b>Loại 1</b>: If + HTĐ, will + V (có thể xảy ra). <b>Loại 2</b>: If + QKĐ, would + V (giả định). <b>unless</b> = if not · <b>in case</b> = phòng khi.',i:[['If you heat ice, it ___.',['melt','melts','will melt','would melt'],1,'Loại 0: sự thật.'],['If I ___ famous, I would buy a big house.',['am','were','will be','be'],1,'Loại 2: were.'],["We'll be late ___ we hurry.",['if','unless','in case','when'],1,'unless = if not.'],['Take an umbrella ___ it rains.',['unless','in case','if not','so'],1,'in case = phòng khi.'],['If she practises more, she ___ the audition.',['passes','will pass','would pass','passed'],1,'Loại 1 → will.']]},
  s:[['If I were a celebrity, I would help young musicians.','Nếu là người nổi tiếng, mình sẽ giúp các nhạc sĩ trẻ.'],['She is rehearsing every day for the talent show.','Bạn ấy tập dượt mỗi ngày cho cuộc thi tài năng.'],['Take your phone in case you need to call me.','Mang điện thoại phòng khi bạn cần gọi mình.']],
  sp:{title:'Thảo luận: sự nổi tiếng',turns:[{say:'Would you like to be famous? Why or why not?',talk:40},{say:'If you won a talent show, what would you do with the prize?',talk:40},{say:'Do celebrities have a good influence on teenagers?',talk:45},{say:'What is the hardest thing about being in the spotlight?',talk:40}],phrases:['If I were…, I would…','I\'m not sure, but…','That\'s true, but on the other hand…','I agree with that up to a point.']},
  wr:{title:'Article: would you like to be famous?',letter:'<p><b>Articles wanted!</b> "Would you like to be famous?" Tell us what would be good and bad about it, and what you would do if you became famous.</p>',task:'Viết article khoảng 100 từ, dùng câu điều kiện loại 2.',min:100,points:[['Tiêu đề','^.{3,60}\\n'],['Điều kiện loại 2','if (i|you|we|they|he|she) (were|had|became|won)[\\s\\S]{0,60}would'],['Mặt tốt','advantage|good thing|great|benefit'],['Mặt xấu','however|but|on the other hand|disadvantage'],['Câu hỏi với người đọc','\\?']],model:'Fame: Dream or Nightmare?\nWho hasn\'t dreamed of being famous? If I were a famous singer, I would travel the world and meet amazing people. I would also use my money to build music schools for poor children.\nHowever, fame has a dark side. Celebrities can\'t go out without photographers following them, and people write unkind comments online. If I made one small mistake, everyone would know!\nSo, would I like to be famous? Maybe just a little. I think I\'d prefer to be a successful songwriter, so people know my songs but not my face. What about you?'}},

 [6,'Our environment',{topic:'câu bị động · email cảm ơn, mời, nhận lời, từ chối',w:[['global warming','n','nóng lên toàn cầu','Global warming is melting the ice.'],['flood','n','lũ lụt','The flood damaged many houses.'],['drought','n','hạn hán','The drought killed the crops.'],['habitat','n','môi trường sống','Pandas are losing their habitat.'],['extinct','adj','tuyệt chủng','Dinosaurs are extinct.'],['plastic waste','n','rác thải nhựa','Plastic waste pollutes the ocean.'],['solar panel','n','tấm pin mặt trời','We have solar panels on our roof.'],['reduce','v','giảm','We should reduce plastic use.']],
  g:{t:'Câu bị động (hiện tại & quá khứ)',r:'<b>am/is/are + V3</b> (hiện tại) · <b>was/were + V3</b> (quá khứ). Người thực hiện thêm bằng <b>by</b> khi cần. Thank you for + <b>V-ing</b>.',i:[['Plastic bottles ___ every day.',['throw away','are thrown away','is thrown away','threw away'],1,'Số nhiều, hiện tại → are + V3.'],['This forest ___ in 1990.',['was planted','is planted','planted','were planted'],0,'Quá khứ, số ít → was planted.'],['Solar panels ___ on the school roof last year.',['were put','was put','are put','put'],0,'Số nhiều, quá khứ → were.'],['Many animals ___ by pollution.',['are harmed','harm','is harmed','harmed'],0,'are harmed by.'],['Thank you for ___ me to the eco club.',['invite','inviting','invited','to invite'],1,'for + V-ing.']]},
  s:[['Thousands of trees are cut down every year.','Hàng nghìn cây bị chặt mỗi năm.'],['Solar panels were installed on our school roof.','Tấm pin mặt trời đã được lắp trên mái trường mình.'],['Thank you for inviting me to the beach clean-up.','Cảm ơn bạn đã mời mình đi dọn biển.']],
  sp:{title:'Thảo luận: môi trường',turns:[{say:'What environmental problems are there in your area?',talk:40},{say:'What can students do to reduce plastic waste?',talk:45},{say:'Should the government ban plastic bags? Why or why not?',talk:45},{say:'Which is more serious: floods or droughts? Why?',talk:40}],phrases:['One of the biggest problems is…','I think we should…','It would be better if…','That\'s a good point, but…']},
  wr:{title:'Email: reply to an invitation',from:'Mai · Eco Club',stamp:'ECO',letter:'<p>Hi! Our eco club is organising a beach clean-up next Sunday morning. Would you like to join us? We also need someone to make posters. Can you help? – Mai</p>',task:'Viết email khoảng 100 từ: cảm ơn, nhận lời HOẶC từ chối (có lý do), trả lời về việc làm poster, hỏi thêm một thông tin.',min:100,points:[['Cảm ơn','thank you for|thanks for'],['Nhận lời / từ chối','i\'d love to|i\'d be happy to|i\'m afraid|unfortunately|sorry, i can\'t'],['Lý do','because|as|since'],['Về poster','poster'],['Câu hỏi thêm','\\?'],['Kết thư','best wishes|see you|bye|take care']],model:'Hi Mai,\nThank you for inviting me to the beach clean-up. I\'d love to come! I think it\'s really important, because so much plastic waste is left on our beaches every summer.\nI\'d also be happy to make the posters. I\'m quite good at drawing, and I can design them on my laptop too. How many posters do you need, and where will they be put up?\nCould you also tell me what time we should meet and what I need to bring? Gloves, maybe?\nSee you on Sunday,\nHuy'}},

 [7,'Travel',{topic:'must / have to / had to · mệnh đề quan hệ',w:[['set off','phr v','khởi hành','We set off at 5 a.m.'],['get on','phr v','lên (xe, tàu)','Get on the bus quickly!'],['get off','phr v','xuống (xe, tàu)','We got off at the next stop.'],['check in','phr v','làm thủ tục','Check in two hours before the flight.'],['delay','n','sự trì hoãn','There was a long delay at the airport.'],['luggage','n','hành lý','Don\'t leave your luggage alone.'],['passenger','n','hành khách','The passengers waited patiently.'],['platform','n','sân ga','The train leaves from platform 3.']],
  g:{t:'Modal of obligation · Relative clauses',r:"<b>must / have to</b>: bắt buộc · <b>had to</b>: quá khứ · <b>mustn't</b>: cấm · <b>don't have to</b>: không cần. Mệnh đề quan hệ: <b>who</b> (người), <b>which</b> (vật), <b>where</b> (nơi chốn), <b>that</b>.",i:[['Yesterday we ___ wait two hours at the airport.',['must','had to','have to','musted'],1,'Quá khứ → had to.'],['Passengers ___ smoke on the train.',["mustn't","don't have to","haven't to","needn't to"],0,"Cấm → mustn't."],['You ___ bring food; lunch is included.',["mustn't","don't have to","can't","shouldn't to"],1,"Không cần → don't have to."],['The man ___ sat next to me was very friendly.',['which','who','where','whose'],1,'Người → who.'],['This is the platform ___ the train to Hue leaves.',['which','where','who','when'],1,'Nơi chốn → where.']]},
  s:[['We had to set off very early to catch the train.','Bọn mình phải khởi hành rất sớm để kịp tàu.'],['The hotel where we stayed was next to the beach.','Khách sạn nơi bọn mình ở nằm cạnh bãi biển.'],["You don't have to bring much luggage.",'Bạn không cần mang nhiều hành lý.']],
  sp:{title:'Kể về một chuyến đi',turns:[{card:'<p><b>Describe a journey you remember.</b></p><ul><li>Where did you go and how did you travel?</li><li>Who were you with?</li><li>What happened on the way?</li><li>Why do you remember it?</li></ul>',prep:45,talk:75}],phrases:['The journey I remember best is…','We had to…','The place where we stayed…','What made it memorable was…']},
  wr:{title:'Article: travel tips',letter:'<p><b>Articles wanted!</b> "Travel tips for teenagers." Give advice to young people going on their first trip without their parents.</p>',task:'Viết article khoảng 100 từ, mở đầu bằng câu hỏi gây chú ý (Have you ever…?).',min:100,points:[['Câu hỏi mở đầu','have you ever|do you|are you'],['must / have to / don\'t have to','must|have to|don\'t have to'],['Mệnh đề quan hệ','\\b(who|which|where|that)\\b'],['Phrasal verbs du lịch','set off|check in|get on|get off'],['Kết luận','enjoy|have fun|good luck|most importantly']],model:'Ready for Your First Trip Alone?\nHave you ever travelled without your parents? It can be exciting, but you have to be prepared.\nFirst, check the times of your bus or train the night before and set off early. Delays happen, and you don\'t want to miss your connection.\nSecondly, pack light. You don\'t have to bring five pairs of shoes! A small bag which is easy to carry is best.\nFinally, you must keep your phone charged and share your location with someone who you trust.\nMost importantly, relax and enjoy the journey!'}},

 [8,'Interests',{topic:'câu tường thuật · gợi ý và đáp lại',w:[['be into','phr','rất thích','I\'m really into K-pop.'],['be mad about','phr','mê mẩn','She is mad about football.'],['chill out','phr v','thư giãn','Let\'s chill out at home.'],['hang out with','phr v','đi chơi với','I hang out with my friends.'],['join in','phr v','tham gia','Come and join in the game!'],['give up','phr v','từ bỏ','Don\'t give up!'],['collection','n','bộ sưu tập','He has a big stamp collection.'],['unusual','adj','khác thường','Her hobby is quite unusual.']],
  g:{t:'Reported speech',r:'Lùi thì: am/is → was · like → liked · will → would · can → could. Câu hỏi gián tiếp: asked + if/wh- + S + V (không đảo). Mệnh lệnh: told sb (not) <b>to V</b>.',i:[['"I like chess," he said. → He said he ___ chess.',['likes','liked','like','has liked'],1,'Lùi thì: like → liked.'],['"I am tired," she said. → She said she ___ tired.',['is','was','were','has been'],1,'am → was.'],['He asked me where I ___.',['live','lived','do live','did live'],1,'Câu hỏi gián tiếp: lùi thì, không đảo.'],['She told me ___ late.',['not be','not to be',"don't be",'to not being'],1,'told sb not to V.'],['"Why don\'t we go bowling?" — "___"',['Good idea!',"Yes, I don't.",'No, we do.',"I'm agree."],0,'Đáp lại lời gợi ý.']]},
  s:[['My cousin is really into collecting old coins.','Anh họ mình rất mê sưu tầm tiền xu cổ.'],['She told me that she had joined a dance club.','Bạn ấy kể với mình là đã vào câu lạc bộ nhảy.'],["Why don't we hang out at the park this weekend?",'Cuối tuần này bọn mình đi chơi công viên nhé?']],
  sp:{title:'Thảo luận: gợi ý hoạt động',turns:[{card:'<p><b>Your friend is bored and wants a new interest.</b> Ideas: learning to cook · joining a drama club · photography · learning a musical instrument · volunteering</p>',say:'Talk about the ideas. Make suggestions and respond to them.',prep:20,talk:75},{say:'Which interest would you choose for yourself? Why?',talk:40}],phrases:["Why don't you…?","How about…?","That sounds fun, but…","I'm not sure about that because…"]},
  wr:{title:'Article: an unusual hobby',letter:'<p><b>Articles wanted!</b> "Someone with an unusual hobby." Tell us about a person you know with an interesting or unusual hobby.</p>',task:'Viết article khoảng 100 từ, có câu tường thuật lời người đó nói.',min:100,points:[['Tiêu đề','^.{3,60}\\n'],['Câu tường thuật','(said|told me|explained|asked) (that|if|me)'],['Cụm từ sở thích','into|mad about|keen on|collection'],['Tính từ / trạng từ hay','amazing|unusual|surprisingly|incredibly|fascinating']],model:'My Uncle the Bottle Builder\nMost people throw empty bottles away, but my uncle Tuan is mad about them. He builds small houses out of plastic bottles filled with sand!\nHe told me that he had started the hobby five years ago, after he saw a video online. At first, his neighbours thought it was strange. Now they bring him their bottles.\nHis latest house is surprisingly strong and the children in our village use it as a playhouse. When I asked him why he loved it, he said it was a way to turn rubbish into something useful. I think that\'s amazing!'}},

 [9,'Survival',{topic:'quá khứ hoàn thành · kể chuyện',w:[['survive','v','sống sót','They survived for three days.'],['shipwreck','n','vụ đắm tàu','He was the only survivor of the shipwreck.'],['shelter','n','nơi trú ẩn','We built a shelter from leaves.'],['rescue','v/n','giải cứu','A helicopter rescued them.'],['torch','n','đèn pin','Bring a torch for the cave.'],['rope','n','dây thừng','Tie the boat with a rope.'],['signal','n','tín hiệu','They made a fire as a signal.'],['by the time','phr','trước lúc','By the time we arrived, it was dark.']],
  g:{t:'Past perfect',r:'<b>had + V3</b>: hành động xảy ra TRƯỚC một hành động khác trong quá khứ. Dấu hiệu: by the time, before, after, already, when.',i:[['When we arrived, the film ___.',['already started','had already started','has already started','was already start'],1,'Xảy ra trước → had started.'],['She ___ never seen the sea before that trip.',['has','had','was','did'],1,'Trước chuyến đi → had.'],['By the time the rescue team came, we ___ a shelter.',['built','had built','have built','were built'],1,'By the time → had + V3.'],['After he ___ dinner, he went out.',['had eaten','has eaten','eats','was eating'],0,'After + QKHT.'],['I realised I ___ my torch at home.',['left','had left','have left','leave'],1,'Để quên trước khi nhận ra.']]},
  s:[['By the time help arrived, we had built a shelter.','Khi cứu hộ đến, bọn mình đã dựng xong chỗ trú.'],['I would take a torch, a rope and a good book.','Mình sẽ mang đèn pin, dây thừng và một cuốn sách hay.'],['When I woke up, everyone had already left.','Khi mình tỉnh dậy, mọi người đã đi hết rồi.']],
  sp:{title:'Thảo luận: đảo hoang',turns:[{card:'<p><b>You are going to be on a desert island for a month.</b> You can take only THREE things: a torch · a rope · a knife · a phone · a book · a cooking pot · sun cream · a guitar</p>',say:'Talk about the items and decide which three you would take.',prep:30,talk:90},{say:'What would you miss most from home? Why?',talk:40}],phrases:['I would definitely take… because…','… would be useless because…','On the other hand,…','So, in the end, I\'d choose…']},
  wr:{title:'Story: the boat',letter:'<p><b>Write a story beginning with:</b> "When I woke up, the boat had disappeared."</p>',task:'Viết khoảng 100 từ, dùng quá khứ hoàn thành và từ nối thời gian.',min:100,points:[['Câu mở đầu','when i woke up, the boat had disappeared'],['Quá khứ hoàn thành','\\bhad (\\w+ed|been|gone|left|taken|seen|built|made)'],['Từ nối thời gian','by the time|after|before|then|suddenly|finally'],['Kết thúc','rescued|in the end|finally|home|safe']],model:'When I woke up, the boat had disappeared. I was alone on a small beach and I had no idea where my friends were. At first I panicked, but then I remembered what my scout leader had taught me. I collected wood and built a simple shelter before the sun went down. The next morning, I made a big fire as a signal. By the time the smoke reached the sky, a fishing boat had already seen it. In the end, the fishermen rescued me and took me home. My friends had been looking for me all night!'}},

 [10,'Review and exam skills',{topic:'từ nối · ôn các dạng bài viết PET',w:[['however','adv','tuy nhiên','It rained. However, we went out.'],['although','conj','mặc dù','Although it was late, we kept working.'],['moreover','adv','hơn nữa','It\'s cheap. Moreover, it\'s healthy.'],['therefore','adv','vì vậy','He was ill; therefore, he stayed home.'],['in addition','phr','thêm vào đó','In addition, you can swim there.'],['on the other hand','phr','mặt khác','On the other hand, it is expensive.'],['as a result','phr','kết quả là','He practised a lot. As a result, he won.'],['in conclusion','phr','tóm lại','In conclusion, I agree.']],
  g:{t:'Từ nối',r:'Thêm ý: <b>moreover, in addition</b>. Trái ngược: <b>however, although, on the other hand</b>. Kết quả: <b>therefore, as a result</b>. Kết luận: <b>in conclusion</b>.',i:[['___ it was raining, we played football.',['However','Although','Therefore','Moreover'],1,'Although + mệnh đề.'],['The film was long. ___, it was exciting.',['However','Although','Because','So'],0,'Trái ngược, đầu câu → However.'],['He studied hard. ___, he passed easily.',['However','As a result','Although','On the other hand'],1,'Kết quả.'],['Cycling is healthy. ___, it is cheap.',['However','Moreover','Although','Therefore'],1,'Thêm ý.'],['___, I believe school uniforms are a good idea.',['In conclusion','Although','Because of','Moreover of'],0,'Kết luận.']]},
  s:[['Although it was difficult, I never gave up.','Dù khó, mình chưa bao giờ bỏ cuộc.'],['In addition, the city has excellent public transport.','Thêm vào đó, thành phố có giao thông công cộng rất tốt.'],['As a result, more students chose to cycle to school.','Kết quả là nhiều học sinh chọn đạp xe đến trường.']],

  wr:{title:'PET Part 2: story',letter:'<p><b>Your English teacher has asked you to write a story.</b> Your story must begin with: "It was the most surprising day of my life."</p>',task:'Viết khoảng 100 từ, có từ nối đa dạng.',min:100,points:[['Câu mở đầu','it was the most surprising day of my life'],['Từ nối','however|although|moreover|as a result|therefore|in the end'],['Thì quá khứ đa dạng','\\b(was|were) \\w+ing|had \\w+ed|had (been|gone|seen)'],['Kết thúc','in the end|finally|never forget']],model:'It was the most surprising day of my life. I was walking home from school when my phone rang. It was my teacher, Ms Hoa. Although I was worried at first, she had good news: my short story had won a national competition! As a result, I was invited to Ha Noi to receive the prize. Moreover, my story would be printed in a magazine. That evening, my whole family celebrated with a big dinner. In the end, I realised that all those nights of writing had been worth it. I will never forget that phone call.'}},

  wr:{title:'Opinion essay: city or countryside?',letter:'<p><b>Some people think it is better to grow up in the city, while others prefer the countryside.</b> Discuss both views and give your own opinion.</p>',task:'Viết khoảng 150 từ: mở bài, 2 thân bài (mỗi bên 1 đoạn), kết luận có ý kiến cá nhân.',min:150,points:[['Mở bài nêu đề','some people|it is often said|many people'],['Ý kiến cá nhân','in my opinion|i believe|from my perspective|personally'],['Lý do','because|since|due to|owing to'],['Kết quả','as a result|therefore|so'],['Ví dụ','for example|for instance|such as'],['Kết luận','in conclusion|to sum up|overall']],model:'Some people believe that children should grow up in a big city, while others think the countryside is a better place. Both views have merit.\nOn the one hand, urban areas offer better schools and more extracurricular activities. For example, children in Ha Noi can join coding clubs or English centres easily. As a result, they may have better employment prospects in the future.\nOn the other hand, rural areas are more tranquil and much less polluted. Children can play outdoors safely and develop a close relationship with nature, which is good for their health.\nIn my opinion, the countryside is better for young children because a healthy, peaceful environment matters most at that age. However, teenagers may benefit from moving to a city to access more opportunities.\nIn conclusion, the best place depends on a child\'s age and needs.'}},

 [2,'Strange but true',{topic:'past tenses · strong adjectives · IELTS T/F/NG',w:[['enormous','adj','khổng lồ','They found an enormous fish.'],['tiny','adj','tí hon','The kitten was tiny.'],['terrified','adj','kinh hãi','I was terrified of the dark.'],['exhausted','adj','kiệt sức','After the race, I was exhausted.'],['furious','adj','giận dữ','The teacher was furious.'],['delighted','adj','vui sướng','She was delighted with her gift.'],['freezing','adj','lạnh cóng','It was freezing outside.'],['astonishing','adj','đáng kinh ngạc','It was an astonishing story.']],
  pairs:[['very big','enormous'],['very small','tiny'],['very scared','terrified'],['very tired','exhausted'],['very angry','furious'],['very cold','freezing']],
  g:{t:'Past tenses · comparatives',r:'Quá khứ đơn (sự việc chính) · quá khứ tiếp diễn (bối cảnh) · quá khứ hoàn thành (xảy ra trước). So sánh trạng từ: more carefully, faster.',i:[['I ___ along the beach when I saw a strange light.',['walked','was walking','had walked','walk'],1,'Bối cảnh → tiếp diễn.'],['By the time the police arrived, the thief ___.',['escaped','had escaped','was escaping','has escaped'],1,'Xảy ra trước → had escaped.'],["This is ___ story I've ever heard!",['the strangest','stranger','the most strange','strangest'],0,'strange → the strangest.'],['She ran ___ than anyone else.',['fast','faster','fastest','more fast'],1,'faster than.'],['He drove much more ___ than usual.',['careful','carefully','carefuller','care'],1,'Trạng từ: more carefully.']]},

  tf:{title:'The Dog Who Waited',p:'<p>In 1924, a university professor in Tokyo adopted a golden-brown Akita dog called Hachiko. Every afternoon, Hachiko walked to Shibuya Station to meet the professor when he returned from work.</p><p>In May 1925, the professor died suddenly while he was teaching. He never came home. However, Hachiko continued to wait at the station every day for nearly ten years. Commuters who noticed the loyal dog often brought him food.</p><p>In 1934, a bronze statue of Hachiko was placed at the station. Today, it is one of the most popular meeting points in Tokyo, and the story has been made into several films.</p>',items:[['Hachiko belonged to a university professor.',0],['The professor died at home.',1],['Hachiko waited at the station for about ten years.',0],['Hachiko was the only Akita dog in Tokyo at that time.',2],['The statue was built after Hachiko\'s story became famous in films.',1]]},
  sp:{title:'So sánh hai bức ảnh',turns:[{card:'<div class="photo"><b>Photo A</b>A teenager is climbing a high rock wall outdoors. He is wearing a helmet and looks focused.</div><div class="photo"><b>Photo B</b>A girl is giving a speech on a school stage in front of hundreds of students. She is holding a microphone and smiling nervously.</div><p><b>Compare the photos.</b> Which situation is more challenging? Why?</p>',prep:30,talk:60}],phrases:['Both photos show…','The main difference is that…','The person in the first photo might feel…','Whereas… / While…'],sample:'Both photos show young people in challenging situations. In the first photo, a boy is climbing a high rock wall, whereas in the second, a girl is giving a speech on stage. The main difference is that the first challenge is physical, while the second is more emotional. The boy might feel terrified of falling, but the girl is probably nervous about making mistakes in front of hundreds of people. Personally, I think public speaking is more challenging, because you can\'t hide your fear.'},
  wr:{title:'Story: when things go wrong',letter:'<p><b>Write a story with the title:</b> "When Everything Went Wrong"</p>',task:'Viết khoảng 150 từ, dùng đủ 3 thì quá khứ và ít nhất 3 strong adjectives.',min:150,points:[['Quá khứ tiếp diễn','\\b(was|were) \\w+ing'],['Quá khứ hoàn thành','\\bhad (\\w+ed|been|gone|left|forgotten|lost)'],['Strong adjectives','enormous|tiny|terrified|exhausted|furious|delighted|freezing|astonishing|boiling'],['Từ nối thời gian','suddenly|then|by the time|eventually|in the end']],model:'When Everything Went Wrong\nIt was the morning of the school science fair and I was absolutely delighted with my volcano model. I had spent three weeks building it.\nUnfortunately, things started to go wrong immediately. While I was carrying the model to the bus stop, an enormous dog ran towards me. I was terrified and dropped the box! By the time I picked it up, the top of the volcano had broken.\nThen it started to rain. It was freezing, and I had forgotten my umbrella. When I finally arrived at school, I was soaked and exhausted.\nSuddenly, my teacher saw me and smiled. She helped me fix the volcano with tape. In the end, it erupted perfectly and the judges laughed when I told them my story. I didn\'t win, but I got a special prize for "Never Giving Up"!'}},

 [3,'The world around us',{topic:'so / such / too / enough · make / do · collaborative task',w:[['eco-friendly','adj','thân thiện với môi trường','Use eco-friendly bags.'],['organic','adj','hữu cơ','We buy organic vegetables.'],['local produce','n','nông sản địa phương','The market sells local produce.'],['public transport','n','giao thông công cộng','Use public transport more often.'],['traffic jam','n','tắc đường','We were stuck in a traffic jam.'],['commute','v/n','đi lại hằng ngày','My dad commutes by bus.'],['waste','v/n','lãng phí; rác thải','Don\'t waste food.'],['carbon footprint','n','dấu chân carbon','Cycling reduces your carbon footprint.']],

  g:{t:'so / such / too / enough · future forms',r:'<b>so</b> + adj · <b>such (a/an)</b> + adj + noun · <b>too</b> + adj (quá… không thể) · adj + <b>enough</b> (đủ…).',i:[['It was ___ hot that we stayed inside.',['so','such','too','enough'],0,'so + adj + that.'],['It was ___ a hot day that we stayed inside.',['so','such','too','enough'],1,'such a + adj + noun.'],['The bus was ___ crowded to get on.',['so','such','too','enough'],2,'too + adj + to V.'],['Is the river clean ___ to swim in?',['so','such','too','enough'],3,'adj + enough.'],['By 2040, most cars ___ electric.',['are','will be','are being','be'],1,'Dự đoán → will be.']]},
  s:[['The city is so crowded that commuting takes hours.','Thành phố đông đến mức đi lại mất hàng giờ.'],['It was such a long traffic jam that we missed the start.','Tắc đường lâu đến mức bọn mình lỡ phần đầu.'],['Public transport is not reliable enough yet.','Giao thông công cộng vẫn chưa đủ đáng tin cậy.']],
  sp:{title:'Collaborative task: eco activities',turns:[{card:'<p><b>Your school wants students to be more eco-friendly.</b> Ideas: cycling to school · a no-plastic week · a school vegetable garden · a second-hand uniform market · switching off lights campaign</p>',say:'Talk about how effective each idea would be. Then decide which one is the best.',prep:30,talk:90}],phrases:['What about…? / How do you feel about…?','I\'d go for… because…','That\'s a fair point, but…','Shall we agree on…?']},
  wr:{title:'Article: solutions for a greener city',letter:'<p><b>Articles wanted!</b> "How can we make our city greener?" Suggest some solutions and explain why they would work.</p>',task:'Viết article khoảng 150 từ, mỗi đoạn có câu chủ đề rõ ràng.',min:150,points:[['Tiêu đề','^.{3,60}\\n'],['so / such / too / enough','\\b(so|such|too)\\b \\w+|\\w+ enough'],['Giải pháp','should|could|why not|one solution'],['Câu chủ đề / từ nối','firstly|secondly|another|finally|moreover'],['Kết luận','in conclusion|overall|together']],model:'Greener Streets, Happier People\nOur city is so crowded that the air is often grey. But there are simple ways to change this.\nFirstly, public transport should be cheaper and more reliable. If buses came every five minutes, many people would leave their motorbikes at home, which would reduce traffic jams and pollution.\nSecondly, we need more trees. Trees are such effective natural air filters that every new street should have them. Schools could also plant vegetable gardens to grow local produce.\nFinally, residents can reduce waste. Markets could give discounts to customers who bring their own bags and boxes.\nNone of these ideas is too expensive or too difficult. If everyone does a little, our city will be cleaner, cooler and healthier.'}},

  g:{t:'Modal verbs: deduction & regret',r:'Suy đoán: <b>must</b> (chắc chắn) · <b>might/may/could</b> (có thể) · <b>can\'t</b> (chắc chắn không). Quá khứ: <b>must/might/can\'t have + V3</b>. Lẽ ra: <b>should have + V3</b>.',i:[['She ___ be at home – the lights are on.',['must',"can't","mustn't","needn't"],0,'Chắc chắn → must.'],['He ___ be the winner – he finished last!',['must',"can't",'might','should'],1,'Chắc chắn không → can\'t.'],["They ___ come to the party, but they aren't sure.",['must','might',"can't",'have to'],1,'Có thể → might.'],['You ___ have told me earlier!',['should','must','can','would'],0,'should have: lẽ ra nên.'],['She ___ have taken the bus – her bike is here.',['must',"can't","mustn't","shouldn't"],0,'Suy luận chắc chắn về quá khứ.']]},
  s:[['She must be really motivated to train every morning.','Bạn ấy hẳn phải có động lực lắm mới tập mỗi sáng.'],['I should have listened to my coach.','Lẽ ra mình nên nghe lời huấn luyện viên.'],['I get on well with people who encourage me.','Mình hợp với những người biết khuyến khích mình.']],
  sp:{title:'Discussion: doing things together',turns:[{say:'Is it easier to achieve a goal alone or with friends? Why?',talk:45},{say:'How important is it for parents to support their children\'s dreams?',talk:45},{say:'Why do some friendships last while others don\'t?',talk:45},{say:'Should teenagers be allowed to make their own decisions about their future?',talk:45}],phrases:['It depends on…','From my point of view,…','There are two sides to this…','To sum up,…']},
  wr:{title:'Essay: money and happiness',letter:'<p><b>"Money is the most important thing for a happy life."</b> To what extent do you agree or disagree?</p>',task:'Viết essay khoảng 150 từ, có đoạn đối lập (contrast) và câu tóm tắt (summary).',min:150,points:[['Nêu quan điểm','i (partly |strongly )?(agree|disagree)|in my opinion|to some extent'],['Đối lập','however|on the other hand|nevertheless|whereas|although'],['Ví dụ','for example|for instance|such as'],['Từ cấu tạo','\\w+(able|ful|ment|ness|less)\\b'],['Tóm tắt','in conclusion|to sum up|all in all|overall']],model:'Many people believe that money is the key to happiness. I partly agree with this view.\nOn the one hand, money is necessary for a comfortable life. Without enough money, families cannot afford healthy food, good education or medical care, which can make life stressful. For example, a student whose family struggles financially may feel unable to focus on studying.\nOn the other hand, research suggests that once our basic needs are met, more money does not make us much happier. Relationships, health and a sense of achievement are far more important. Many wealthy people feel lonely, whereas some families with little money are very content because they support each other.\nTo sum up, money is important up to a point, but it is not the most important thing. Real happiness comes from the people around us and from feeling grateful for what we have.'}},
  ['vocab','memory','grammar','gap','errorhunt','shadow','talk','jeopardy','letter']],
 [5,'Lessons for life',{topic:'relative clauses · money · IELTS Speaking Part 3',w:[['budget','n','ngân sách','I set a monthly budget.'],['save','v','tiết kiệm','I\'m saving for a new bike.'],['earn','v','kiếm (tiền)','She earns money by tutoring.'],['borrow','v','mượn','Can I borrow your book?'],['lend','v','cho mượn','Could you lend me some money?'],['afford','v','đủ khả năng chi trả','We can\'t afford a new car.'],['pocket money','n','tiền tiêu vặt','I get pocket money every week.'],['bargain','n','món hời','This jacket was a real bargain.']],
  g:{t:'Defining & non-defining relative clauses',r:'Xác định: không có dấu phẩy, dùng được that. Không xác định: có dấu phẩy, KHÔNG dùng that. Rút gọn: chủ động → <b>V-ing</b>, bị động → <b>V3</b>.',i:[['My uncle, ___ lives in Hue, is a chef.',['that','who','which','whose'],1,'Không xác định → không dùng that.'],['The app ___ I use to save money is free.',['who','which','where','whose'],1,'Vật → which.'],['Students ___ in the library must be quiet.',['study','studying','studied','who studying'],1,'Rút gọn chủ động → V-ing.'],['The money ___ by the club was given to charity.',['raising','raised','raise','who raised'],1,'Rút gọn bị động → V3.'],["That's the girl ___ bike was stolen.",['who','whose','which','that'],1,'Sở hữu → whose.']]},
  s:[['Teenagers who learn to budget early become more independent.','Thanh thiếu niên biết lập ngân sách sớm sẽ tự lập hơn.'],['My grandmother, who grew up with very little, taught me to save.','Bà mình, người lớn lên trong thiếu thốn, đã dạy mình tiết kiệm.'],['One of the main reasons is that young people are under a lot of pressure.','Một lý do chính là người trẻ chịu nhiều áp lực.']],
  sp:{wheel:['Should schools teach students how to manage money? Why?','Is it a good idea for teenagers to have part-time jobs?','Why do some people find it hard to save money?','Do you think young people today spend too much on things they don\'t need?','What life skills are not taught at school but should be?','Is it better to learn from your own mistakes or from other people\'s advice?'],phrases:['I would argue that…','The reason I say this is that…','Take… for example.','On the other hand, some people might say…']},
  wr:{title:'Semi-formal letter',letter:'<p><b>Your head teacher wants ideas for a new after-school activity.</b> Write a letter suggesting one activity, explaining why students would benefit and how it could be organised.</p>',task:'Viết thư bán trang trọng khoảng 150 từ (Dear Mr/Ms…, Yours sincerely).',min:150,points:[['Mở thư bán trang trọng','dear (mr|ms|mrs|sir|madam)'],['Mục đích','i am writing to|i would like to suggest'],['Lợi ích','benefit|useful|help students|valuable'],['Cách tổ chức','could be held|organised|every|once a week|room'],['Mệnh đề quan hệ','\\b(who|which|where|whose)\\b'],['Kết thư trang trọng','yours sincerely|kind regards|best regards']],model:'Dear Ms Hoa,\nI am writing to suggest a new after-school activity: a "Money Smart" club, which would teach students how to manage their pocket money.\nMany students who receive pocket money spend it quickly and have nothing left for things they really need. In the club, we could learn how to set a budget, compare prices and save for bigger goals. These are valuable life skills which are not covered in our normal lessons.\nThe club could be held once a week in the library, where there are computers for online activities. A teacher who is interested in economics, such as Mr Nam, could lead the sessions, and older students could help.\nI believe this club would help students become more responsible and independent. Thank you for considering my suggestion.\nYours sincerely,\nLe Minh Anh, Class 9A'}},
  ['vocab','hangman','grammar','errorhunt','scramble','dict','wheel','escape','letter']],
 [6,'Superpowers',{topic:'infinitive & -ing · quantifiers · IELTS T/F/NG',w:[['experiment','n','thí nghiệm','We did an experiment in class.'],['laboratory','n','phòng thí nghiệm','Scientists work in a laboratory.'],['discover','v','khám phá','She discovered a new star.'],['invent','v','phát minh','Who invented the telephone?'],['scientist','n','nhà khoa học','I want to be a scientist.'],['research','n/v','nghiên cứu','They are doing research on AI.'],['theory','n','lý thuyết','It\'s just a theory.'],['breakthrough','n','bước đột phá','This is a medical breakthrough.']],
  g:{t:'Infinitive & -ing · quantifiers',r:'want/decide/hope + <b>to V</b> · avoid/enjoy/suggest + <b>V-ing</b>. <b>few / a few</b> + đếm được · <b>little / a little</b> + không đếm được.',i:[['I want ___ a scientist.',['become','to become','becoming','became'],1,'want + to V.'],['She avoids ___ sugary drinks.',['to drink','drinking','drink','drank'],1,'avoid + V-ing.'],["There are ___ people who don't use smartphones.",['few','little','much','a little'],0,'people đếm được → few.'],['We have ___ time left, so hurry!',['few','a few','little','many'],2,'time không đếm được → little.'],['___ of my friends like science – every single one!',['All','None','Some','Each'],0,'every single one → All.']]},
  s:[['Scientists hope to discover a cure within ten years.','Các nhà khoa học hy vọng tìm ra cách chữa trong mười năm tới.'],['Few people believed the theory at first.','Ban đầu ít ai tin vào lý thuyết đó.'],['This invention could give ordinary people superpowers.','Phát minh này có thể cho người bình thường siêu năng lực.']],
  tf:{title:'Inventions Inspired by Nature',p:'<p>Many of the most useful inventions were inspired by animals and plants. This approach is called biomimicry.</p><p>In 1941, a Swiss engineer noticed that tiny seeds stuck to his dog\'s fur after a walk. When he looked at them under a microscope, he saw hundreds of small hooks. Several years later, he used this idea to create Velcro.</p><p>In Japan, engineers redesigned the front of the high-speed Shinkansen train to copy the long beak of the kingfisher bird. The new design made the train quieter and used about 15% less electricity.</p><p>Today, researchers are studying spider silk, which is stronger than steel of the same weight, to develop new materials for clothing and medicine.</p>',items:[['The idea for Velcro came from seeds stuck to a dog.',0],['The engineer invented Velcro immediately after the walk.',1],['The redesigned train used less electricity than before.',0],['The kingfisher is the fastest bird in Japan.',2],['Spider silk is weaker than steel of the same weight.',1]]},
  sp:{ref:'pi-debate',title:'Tranh biện: Online vs classroom learning'},
  wr:{title:'Film review',letter:'<p><b>Reviews wanted!</b> Write a review of a science fiction or superhero film you have seen. Describe the story, say what was good and bad, and whether you would recommend it.</p>',task:'Viết review khoảng 150 từ, dùng thì hiện tại để kể nội dung phim (dramatic present).',min:150,points:[['Tiêu đề','^.{3,60}\\n'],['Kể bằng hiện tại','\\b(is|discovers|finds|decides|has to|tries|becomes)\\b'],['Đánh giá tốt','impressive|brilliant|amazing|stunning|gripping'],['Đánh giá chưa tốt','however|although|weakness|disappointing|a bit'],['Khuyến nghị','recommend|worth watching|must-see|don\'t miss']],model:'Big Hero 6: Small Robot, Big Heart\nBig Hero 6 is an animated superhero film set in the futuristic city of San Fransokyo. The hero, Hiro, is a fourteen-year-old genius who builds fighting robots. When his brother dies in a mysterious fire, Hiro discovers that someone has stolen his invention. Together with Baymax, a soft, friendly healthcare robot, and four science students, he decides to find the truth.\nThe animation is stunning and the action scenes are gripping. However, what makes the film special is the relationship between Hiro and Baymax, which is both funny and moving. The only weakness is that the villain is a little predictable.\nOverall, Big Hero 6 shows that science can be used to help people, not just to fight. I would definitely recommend it to anyone who enjoys technology, adventure and a good cry!'}},
  ['vocab','memory','grammar','tfng','gapbank','shadow','talk','speed','letter']],
 [7,'Home and away',{topic:'conditionals 0–3 · wishes · IELTS paraphrasing',w:[['apartment','n','căn hộ','We live in a small apartment.'],['cottage','n','nhà tranh, nhà nhỏ ở quê','They rent a cottage by the lake.'],['dormitory','n','ký túc xá','University students live in dormitories.'],['neighbourhood','n','khu phố','Our neighbourhood is quiet.'],['rent','v/n','thuê; tiền thuê','The rent is very high.'],['landlord','n','chủ nhà','The landlord fixed the window.'],['spacious','adj','rộng rãi','The living room is spacious.'],['cosy','adj','ấm cúng','My bedroom is small but cosy.']],
  pairs:[['house','accommodation'],['big','spacious'],['area','neighbourhood'],['comfortable','cosy'],['old','traditional'],['near the centre','conveniently located']],
  g:{t:'Conditionals 0–3 · wish',r:'Loại 3: <b>If + had V3, would have V3</b> (giả định quá khứ). <b>wish + QKĐ</b> (ước hiện tại) · <b>wish + had V3</b> (tiếc quá khứ). <b>would rather + V</b>.',i:[['If I had studied harder, I ___ the exam.',['would pass','would have passed','will pass','passed'],1,'Loại 3.'],['I wish I ___ a bigger room.',['have','had','will have','having'],1,'Ước hiện tại → QKĐ.'],['If you mix red and blue, you ___ purple.',['get','will get','would get','got'],0,'Loại 0.'],['I wish I ___ to the party last night.',['went','had gone','would go','go'],1,'Tiếc quá khứ → had V3.'],["I'd rather ___ in a cosy cottage than a big apartment.",['live','to live','living','lived'],0,'would rather + V.']]},
  s:[['If I could live anywhere, I would choose a cottage by the sea.','Nếu được sống ở bất cứ đâu, mình sẽ chọn một ngôi nhà nhỏ bên biển.'],['I wish our apartment were a bit more spacious.','Ước gì căn hộ nhà mình rộng hơn một chút.'],['If we had booked earlier, the rent would have been cheaper.','Nếu đặt sớm hơn thì tiền thuê đã rẻ hơn.']],
  sp:{title:'IELTS Part 2: a place you visited',turns:[{card:'<p><b>Describe a place you visited that you would like to go back to.</b></p><p>You should say:</p><ul><li>where it is</li><li>when you went there and who with</li><li>what you did there</li></ul><p>and explain why you would like to go back.</p>',prep:60,talk:120}],phrases:['I\'d like to talk about…','If I had the chance, I\'d…','I wish I had stayed longer because…','What I loved most was…']},
  wr:{title:'Informal email: describing a visit',from:'Ella · Bristol, UK',stamp:'UK',letter:'<p>Hey! You said you visited somewhere amazing last holiday. Where did you stay? What was the place like? Would you go back? Tell me everything! – Ella</p>',task:'Viết email thân mật khoảng 150 từ, có câu điều kiện và câu wish.',min:150,points:[['Mở thân mật','^(hi|hey|hello)'],['Chỗ ở','stayed|homestay|hotel|cottage|apartment|dormitory'],['Mô tả nơi chốn','spacious|cosy|traditional|peaceful|stunning|neighbourhood'],['Câu điều kiện','if (i|we) (had|could|were)'],['Câu wish','i wish'],['Kết thân mật','see you|take care|write back|bye|love']],model:'Hey Ella,\nYou won\'t believe how amazing Sa Pa was! We stayed in a traditional wooden homestay with a local family. It wasn\'t very spacious, but it was so cosy, especially in the evenings when we sat around the fire.\nThe neighbourhood was surrounded by rice terraces and misty mountains. Every morning we went trekking with our host, who taught us some words in her language. The food was delicious too; I still dream about the grilled corn!\nI wish we had stayed longer. If we had had one more day, we would have climbed Fansipan. My parents say we might go back next year, and if we do, I\'d love you to come too!\nWrite back soon and tell me about your holiday.\nLove,\nLinh'}},
  ['vocab','memory','grammar','errorhunt','gapbank','dict','talk','escape','letter']],
 [8,'Numbers and data',{topic:'passive · have something done · IELTS Writing Task 1',w:[['calculate','v','tính toán','Calculate the total cost.'],['percentage','n','tỉ lệ phần trăm','A large percentage of students agreed.'],['average','n/adj','trung bình','The average age is 14.'],['estimate','v','ước lượng','I estimate it will take two hours.'],['increase','v/n','tăng','Prices increased sharply.'],['decrease','v/n','giảm','The number decreased slightly.'],['figure','n','con số, số liệu','The figures show a clear trend.'],['double','v','gấp đôi','Sales doubled in one year.']],
  pairs:[['increase sharply','tăng mạnh'],['fall slightly','giảm nhẹ'],['remain stable','giữ ổn định'],['reach a peak','đạt đỉnh'],['fluctuate','dao động'],['the majority','phần lớn']],
  g:{t:'Passive · have/get something done',r:'Bị động: <b>be + V3</b> ở mọi thì (will be done, has been done…). <b>have/get + O + V3</b>: nhờ người khác làm.',i:[["I'm going to ___ my hair cut tomorrow.",['have','make','do','take'],0,'have something done.'],['The bridge ___ next year.',['will build','will be built','builds','is building'],1,'Tương lai bị động.'],['Our house ___ painted last month.',['got','had','was','were'],2,'was painted.'],['She had her phone ___ last week.',['repair','repaired','repairing','to repair'],1,'had + O + V3.'],['The results ___ to all students tomorrow.',['will send','will be sent','are sending','send'],1,'Bị động tương lai.']]},
  s:[['The number of students who cycle to school doubled.','Số học sinh đạp xe đến trường tăng gấp đôi.'],['Gaming was the most popular activity, at seventy students.','Chơi game là hoạt động phổ biến nhất, với 70 học sinh.'],['Overall, the figures increased steadily over the period.','Nhìn chung, các số liệu tăng đều trong suốt giai đoạn.']],
  sp:{title:'Long turn: paraphrasing',turns:[{card:'<p><b>Talk about a competition you took part in or watched.</b> Try NOT to repeat the same words: paraphrase! (e.g. "won" → "came first", "difficult" → "challenging")</p>',prep:45,talk:90}],phrases:['In other words,…','What I mean is…','It was quite challenging, or rather…','To put it another way,…']},
  wr:{title:'IELTS Task 1: bar chart',letter:'<p><b>The chart shows the favourite free-time activities of 200 students.</b> Gaming 70 · Sport 55 · Music 45 · Reading 30.</p><p>Summarise the information by selecting and reporting the main features, and make comparisons where relevant.</p>',task:'Viết khoảng 150 từ: câu mở (paraphrase đề), overview, 2 đoạn chi tiết có số liệu.',min:150,points:[['Paraphrase đề','the (bar )?chart (shows|illustrates|compares)'],['Overview','overall|in general|it is clear that'],['Số liệu cụ thể','\\d+'],['So sánh','more than|less than|the most|the least|whereas|while'],['Từ chỉ tỉ lệ','percent|%|proportion|quarter|third|half|majority']],model:'The bar chart compares the favourite free-time activities of 200 secondary school students.\nOverall, playing video games was by far the most popular choice, whereas reading was the least popular activity.\nGaming was chosen by 70 students, which accounts for 35% of the group. Sport came second with 55 students, or just over a quarter of the total. Listening to music was slightly less popular, with 45 students choosing it.\nBy contrast, only 30 students said that reading was their favourite way to spend free time. This figure was less than half the number of students who preferred gaming. Taken together, screen-based and physical activities attracted a much larger proportion of students than quieter hobbies such as reading.\nIn summary, the data suggest that active and digital entertainment is more popular among teenagers than traditional reading.'}},
  ['vocab','memory','grammar','gapbank','errorhunt','dict','talk','jeopardy','letter']],
 [9,'Express yourself',{topic:'reported speech & reporting verbs · arts · review',w:[['exhibition','n','triển lãm','We visited an art exhibition.'],['sculpture','n','tác phẩm điêu khắc','The sculpture is made of metal.'],['gallery','n','phòng tranh','The gallery is free on Sundays.'],['portrait','n','tranh chân dung','She painted a portrait of her mother.'],['critic','n','nhà phê bình','The critics loved the play.'],['masterpiece','n','kiệt tác','This painting is a masterpiece.'],['admire','v','ngưỡng mộ','I admire her creativity.'],['audience','n','khán giả','The audience gave a standing ovation.']],
  g:{t:'Reporting verbs',r:'<b>advise / tell / ask / remind + sb + to V</b> · <b>admit / deny / suggest + V-ing</b> hoặc + that… · asked <b>if / whether</b>…',i:[['She ___ me to visit the gallery.',['suggested','advised','said','told that'],1,'advise sb to V.'],['He ___ that he had never seen a sculpture before.',['told','admitted','asked','advised'],1,'admit that…'],['They asked me ___ I liked the show.',['that','if','what that','did'],1,'asked if…'],['The teacher told us ___ touch the paintings.',['not','not to',"don't",'to not to'],1,'told sb not to V.'],['She suggested ___ to the concert together.',['to go','going','go','we going'],1,'suggest + V-ing.']]},
  s:[['The critic described the exhibition as a masterpiece.','Nhà phê bình gọi buổi triển lãm là một kiệt tác.'],['My teacher advised me to enter the art competition.','Cô giáo khuyên mình tham gia cuộc thi vẽ.'],['On the other hand, there are some drawbacks we shouldn\'t ignore.','Mặt khác, có những hạn chế ta không nên bỏ qua.']],
  sp:{wheel:['Is it important for schools to teach art and music? Why?','Why do some people prefer going to live performances rather than watching online?','Should museums and galleries be free for everyone?','How has technology changed the way people enjoy art?','Do you think artists should be paid more by the government?','What kind of art is popular with young people in Viet Nam?'],phrases:['That\'s an interesting question.','I suppose it depends on…','There are a couple of reasons…','Having said that,…']},
  wr:{title:'Review of an event',letter:'<p><b>Reviews wanted!</b> Write a review of a concert, exhibition, festival or school show you attended. What was it like? What was the highlight? Would you recommend it?</p>',task:'Viết review khoảng 150 từ, có tường thuật lời người khác (reported speech).',min:150,points:[['Tiêu đề','^.{3,60}\\n'],['Reported speech','(said|told|explained|admitted|suggested|advised)'],['Từ vựng nghệ thuật','exhibition|performance|audience|gallery|stage|masterpiece|artist'],['Điểm nổi bật','highlight|the best part|stood out'],['Khuyến nghị','recommend|worth|don\'t miss|must-see']],model:'"Colours of the Delta" Exhibition – A Must-See\nLast weekend, I visited "Colours of the Delta", a photography exhibition at the city gallery. It shows daily life in the Mekong Delta through the eyes of young local photographers.\nThe highlight for me was a huge portrait of an old boat seller laughing in the rain. A guide told us that the photographer had waited three days for the perfect moment. You can really feel the joy in her face.\nThe gallery was a bit crowded, and some of the information boards were only in English. However, the staff were friendly and one of them suggested downloading the free audio guide, which was very helpful.\nI would definitely recommend this exhibition to anyone who loves photography or wants to understand rural life in Viet Nam. It runs until the end of the month and entry is free for students.'}},
  ['vocab','hangman','grammar','errorhunt','scramble','shadow','wheel','escape','letter']],
 [10,'Learning from the past',{topic:'ôn tập · IELTS Listening sentence completion',w:[['ancient','adj','cổ đại','We studied ancient Egypt.'],['civilisation','n','nền văn minh','The Maya civilisation was advanced.'],['empire','n','đế chế','The Roman Empire was huge.'],['ruins','n','tàn tích','We visited the ruins of an old city.'],['century','n','thế kỷ','It was built in the 11th century.'],['archaeologist','n','nhà khảo cổ học','Archaeologists found old coins.'],['tradition','n','truyền thống','Tet is an important tradition.'],['decline','n/v','sự suy tàn','The empire went into decline.']],
  g:{t:'Ôn tập tổng hợp B1+',r:'Các thì · bị động · câu điều kiện · mệnh đề quan hệ · câu tường thuật.',i:[['The temple ___ in the 11th century.',['built','was built','has built','is building'],1,'Bị động quá khứ.'],['If the Maya had not cut down their forests, their civilisation ___ longer.',['might last','might have lasted','will last','lasted'],1,'Loại 3.'],['The archaeologist ___ found the coins is from Hue.',['which','who','whose','where'],1,'Người → who.'],['She said that the ruins ___ over 900 years old.',['are','were','have been','will be'],1,'Lùi thì.'],['By 1500, the empire ___ into decline.',['went','had gone','has gone','goes'],1,'By + mốc quá khứ → QKHT.']]},
  s:[['The Maya civilisation reached its peak around the ninth century.','Nền văn minh Maya đạt đỉnh cao vào khoảng thế kỷ thứ chín.'],['Archaeologists discovered the ruins in the nineteen fifties.','Các nhà khảo cổ phát hiện tàn tích vào những năm 1950.'],['Many experts believe that climate change caused the decline.','Nhiều chuyên gia tin rằng biến đổi khí hậu gây ra sự suy tàn.']],
  sp:{title:'IELTS Part 2: a historical place',turns:[{card:'<p><b>Describe a historical place you have visited or would like to visit.</b></p><p>You should say:</p><ul><li>where it is</li><li>what you know about its history</li><li>what people can do there</li></ul><p>and explain why it is important.</p>',prep:60,talk:120},{say:'Do you think young people are interested in history nowadays? Why or why not?',talk:45}],phrases:['The place I\'d like to describe is…','It dates back to…','What makes it so special is…','It\'s important because it reminds us…']},
  wr:{title:'Essay: is history useful?',letter:'<p><b>Some people think studying history is a waste of time for young people. Others believe it is essential.</b> Discuss both views and give your opinion.</p>',task:'Viết essay khoảng 150 từ.',min:150,points:[['Mở bài','some people|it is argued|many people'],['Hai quan điểm','on the one hand|on the other hand|others believe'],['Ý kiến cá nhân','in my opinion|i believe|personally'],['Ví dụ','for example|for instance|such as'],['Kết luận','in conclusion|to sum up|overall']],model:'Some people argue that history is a waste of time for young people, while others believe it is an essential subject. Both views deserve consideration.\nOn the one hand, critics say that students should focus on practical subjects such as science and technology, which lead directly to jobs. They feel that memorising dates and names has little use in modern life.\nOn the other hand, history teaches us valuable lessons. For example, studying the decline of ancient civilisations such as the Maya shows how environmental damage can destroy a society. History also helps young people understand their own traditions and identity.\nIn my opinion, history is extremely useful, but it should be taught in a more engaging way, through projects, museum visits and discussion rather than memorisation.\nIn conclusion, learning from the past helps us make better decisions for the future.'}},
  ['vocab','memory','grammar','gapbank','dict','talk','jeopardy','escape','letter']]
];

   {title:'Part 2',instr:"For each question, choose the correct answer. Read about three teenagers' summer holidays.",type:'match',opts:['Hana','Kien','Mai'],
    text:`<h4>My summer holiday</h4><p><b>A &nbsp;Hana</b><br>Last summer I went to Sa Pa with my parents. We stayed in a homestay with a local family, and I learned to cook some traditional dishes. It was cold in the evenings, so we sat around the fire and told stories. I didn't use my phone at all because there was no internet!</p><p><b>B &nbsp;Kien</b><br>My family went to Nha Trang for a week. I spent most of my time in the sea – I tried scuba diving for the first time and saw amazing fish. The hotel was very big and had three swimming pools. The only problem was the food; I'm not a fan of seafood.</p><p><b>C &nbsp;Mai</b><br>I stayed at home in Ha Noi, but I joined a summer music camp. Every day we practised the guitar for four hours and at the end we gave a concert for our families. I made lots of new friends there and we still meet every weekend.</p>`,

    text:`<h4>Summer courses</h4><p><b>A &nbsp;Wild Skills Camp</b> – Spend five days in the forest learning to build shelters, find clean water and read maps. Ages 13–17. Sleep in tents.</p><p><b>B &nbsp;International English Mornings</b> – Conversation classes from 8 to 11 a.m. with teenagers from Korea, Japan and Australia. Afternoons are free.</p><p><b>C &nbsp;Robot Day Lab</b> – Design and program your own robot in daily workshops, 9 a.m. to 4 p.m. Go home every evening.</p><p><b>D &nbsp;Family Kayak Week</b> – Learn to kayak on the lake. Complete beginners welcome. For families with children aged 8 and over.</p><p><b>E &nbsp;Pottery Studio</b> – A maximum of six students per class. Make bowls and cups and take them home after they are fired.</p><p><b>F &nbsp;Football Academy</b> – A two-week course for experienced players aged 14–16 who want to reach the next level.</p><p><b>G &nbsp;Drawing Online</b> – Learn digital art from home with video lessons. Large classes with students from all over the country.</p><p><b>H &nbsp;Science Summer School</b> – A two-week residential course in physics and computer coding at a university.</p>`,

   {title:'Part 3',instr:'For each question, choose the correct answer.',type:'mcq',
    text:`<h4>My year without a smartphone <span style="font-weight:400">by Bao, 15</span></h4><p>Last January, I made a decision that surprised my friends: I gave my smartphone to my mum and asked her to keep it for a year. I wasn't trying to prove anything. I simply noticed that I was checking it more than a hundred times a day, and I was tired all the time.</p><p>The first month was really hard. I kept reaching into my pocket for a phone that wasn't there, and I felt left out when my classmates talked about videos I hadn't seen. I did keep a basic phone for calls and texts, so my parents could contact me, but that was all.</p><p>Around March, things began to change. Without notifications, I could concentrate on my homework for longer, and my marks in maths went up. I also started reading again – something I had loved as a child but had stopped doing. By the summer I had finished twenty novels.</p><p>The biggest surprise was my friendships. I thought I would lose friends, but actually the opposite happened. Because I couldn't message people, I had to meet them in person, and our conversations became longer and more interesting.</p><p>When the year ended, my mum gave the phone back. I use it now, but I've turned off most notifications and I never take it to bed. I don't think everyone needs to do what I did, but I would recommend trying a week without your phone. You might be surprised by what you learn about yourself.</p>`,
    qs:[{n:11,stem:'Why did Bao give his phone away?',opts:['to win a bet with his friends','because he felt he was using it too much','because his mum asked him to','because it was broken'],a:1},
     {n:12,stem:'What was difficult in the first month?',opts:['He could not contact his parents.','He missed conversations about things online.','He lost his basic phone.','He had too much homework.'],a:1},
     {n:13,stem:'By the summer, Bao',opts:['had worse marks in maths.','had read a lot of books.','had bought a new phone.','had joined a book club.'],a:1},
     {n:14,stem:'How did his friendships change?',opts:['He lost most of his friends.','He spent more time talking to friends face to face.','His friends started writing him letters.','He made new friends online.'],a:1},
     {n:15,stem:'What does Bao suggest to readers?',opts:['Everyone should stop using phones for a year.','People should try a short break from their phones.',"Parents should keep their children's phones.",'Phones should not be allowed at school.'],a:1}]},
   {title:'Part 4',instr:'Five sentences have been removed from the text below. For each question, choose the correct answer. There are three extra sentences which you do not need to use.',type:'cloze',
    side:`<h4>Sentences</h4><p><b>A</b> To be honest, I felt quite nervous and wanted to stay on the sand.</p><p><b>B</b> It felt a bit silly, and I wondered when we would get wet.</p><p><b>C</b> The water was so salty that I swallowed a lot of it.</p><p><b>D</b> It doesn't sound long, but it felt amazing.</p><p><b>E</b> I'm not an expert yet, but I've definitely found a new hobby.</p><p><b>F</b> My parents decided to go home early.</p><p><b>G</b> Quan has been teaching surfing for ten years.</p><p><b>H</b> We had to wake up at five o'clock every morning.</p>`,
    text:`<h4>How I learned to surf</h4><p>Last summer my family spent two weeks in Da Nang, and my parents booked me a surfing lesson. I had never stood on a surfboard before. {{16}}</p><p>My instructor, Quan, started on the beach. For almost an hour, we practised jumping up from lying down to standing on the board in the sand. {{17}} But Quan said it was the most important skill.</p><p>When we finally went into the water, I fell off again and again. {{18}} Every time I came up, Quan just smiled and told me to try again.</p><p>On my fifth day, something changed. I caught a small wave and stood up for about three seconds. {{19}} I shouted so loudly that people on the beach turned to look.</p><p>By the end of the holiday, I could ride most small waves. {{20}} I'm already saving my pocket money for another trip next year.</p>`,
    qs:[{n:16,letters:true,a:0},{n:17,letters:true,a:1},{n:18,letters:true,a:2},{n:19,letters:true,a:3},{n:20,letters:true,a:4}]},

    text:`<h4>Tet in Viet Nam</h4><p>Tet, or Lunar New Year, is the most important {{21}} in Viet Nam. Before Tet, families clean and {{22}} their homes, and many people buy peach or apricot blossoms. On New Year's Eve, family members {{23}} together for a special meal. Children are especially excited because they {{24}} lucky money in red envelopes.</p><p>During the first days of the new year, people visit relatives and friends to {{25}} them good luck. Many people also go to pagodas to pray for health and {{26}}.</p>`,

   {title:'Part 6',instr:'For each question, write the correct answer. Write ONE word for each gap.',type:'cloze',
    text:`<h4>Volunteering at the animal shelter</h4><p>My name's Lily and I've been a volunteer at an animal shelter {{27}} two years. I go there every Saturday morning. Most of the animals are dogs and cats {{28}} have been left by their owners. My job is to feed them and take the dogs for walks.</p><p>At first I was a bit scared of the big dogs, but now I'm not afraid {{29}} them at all. The best part is when a family comes to adopt one of the animals. It makes me {{30}} happy!</p><p>If you love animals, you should try volunteering. You don't need any experience, but you {{31}} be at least 14 years old. {{32}} you want more information, ask at reception.</p>`,

    {n:1,min:100,marks:20,prompt:`<p>Read this email from your English teacher, Mrs Wilson, and the notes you have made.</p>${N('email',`<p>Dear students,</p><p>Our school is organising a <b>sports day</b> next month <span style="color:#c2362b">← Great idea!</span>. Which sports would you like to do? <span style="color:#c2362b">← Tell her</span></p><p>We also need some students to help. What could you do? <span style="color:#c2362b">← Explain</span></p><p>Finally, should we have the sports day on a weekday or at the weekend? <span style="color:#c2362b">← Say which and why</span></p><p>Best wishes,<br>Mrs Wilson</p>`,'From: Mrs Wilson &nbsp;·&nbsp; Subject: Sports day')}<p>Write your email to Mrs Wilson using <b>all the notes</b>.</p>`,
     points:[['Phản hồi "Great idea!"',/great|good idea|excited|happy|love|fantastic|wonderful/i],['Nêu môn thể thao muốn chơi',/football|badminton|basketball|volleyball|running|race|swim|tennis|tug of war|relay/i],['Nói việc có thể giúp',/help|could|can|organis|organiz|carry|set up|photos|water|prepare/i],['Chọn ngày thường / cuối tuần + lý do',/(weekday|weekend|saturday|sunday)[\s\S]*(because|so|as)|(because|so|as)[\s\S]*(weekday|weekend)/i],['Mở và kết thư phù hợp',/(dear|hello|hi)[\s\S]*(best wishes|regards|yours|see you)/i]],
     model:`Dear Mrs Wilson,\nThank you for your email. A sports day is a great idea, and everyone in my class is really excited about it!\nI would love to play football and badminton, because they are my favourite sports. A relay race would be fun for the whole class too.\nI can help on the day. I'm good at taking photos, so I could take pictures for the school website. I could also help to carry water and chairs.\nI think we should have it on a Saturday, because we won't miss any lessons and parents can come and watch.\nBest wishes,\nNam`}]},
   {title:'Part 2',instr:'Choose ONE of these questions. Write your answer in about 100 words.',type:'writing',choice:true,qs:[
    {n:2,label:'Question 2 · Article',min:100,marks:20,prompt:`<p>You see this announcement in an English-language magazine for teenagers.</p>${N('sign','<b>Articles wanted!</b><br><b>A DAY I WILL NEVER FORGET</b><br>Tell us about a day you will always remember. What happened? Who were you with? Why was it so special?<br><i>The best articles will be published next month.</i>')}<p>Write your <b>article</b>.</p>`,
     points:[['Có tiêu đề',/^.{3,60}\n/],['Kể chuyện gì đã xảy ra (thì quá khứ)',/\b(was|were|went|had|saw|got|took|visited|made)\b/i],['Nói đi cùng ai',/with my|family|friends|parents|brother|sister|classmates|grand/i],['Giải thích vì sao đặc biệt',/because|special|never forget|remember|best|amazing/i]],
     model:`The Day I Met the Ocean\nI will never forget the day I first saw the sea. I was ten years old, and my whole family travelled by train from Thai Binh to Nha Trang for my grandmother's seventieth birthday.\nWhen we arrived, I ran straight to the beach. The water was so blue and so huge that I couldn't speak! My cousins taught me to swim, and in the evening we had a big seafood dinner together.\nThat day was special because all of my family were together and happy. Now, whenever I feel stressed, I close my eyes and remember the sound of the waves.`},
    {n:3,label:'Question 3 · Story',min:100,marks:20,prompt:`<p>Your English teacher has asked you to write a story.</p><p>Your story must begin with this sentence:</p>${N('sign',"<i>When I opened the door, I couldn't believe my eyes.</i>")}<p>Write your <b>story</b>.</p>`,
     points:[['Bắt đầu bằng câu cho sẵn',/when i opened the door/i],['Dùng thì quá khứ',/\b(was|were|saw|ran|shouted|looked|found|said|felt)\b/i],['Có từ nối thời gian',/then|after that|suddenly|finally|later|at first|in the end/i],['Có kết thúc / cảm xúc',/in the end|finally|happy|laughed|smiled|never|best/i]],
     model:`When I opened the door, I couldn't believe my eyes. My living room was full of balloons, and all my friends were standing there shouting "Surprise!"\nAt first I didn't understand. My birthday was not until next week! Then my best friend, Lan, explained that they had planned the party early because I was moving to a new city on Saturday.\nWe played games, ate a huge chocolate cake and took lots of photos. Later, everyone gave me a book full of messages and drawings.\nIn the end, I cried a little, but they were happy tears. I still read that book whenever I miss them.`}]}
  ]},

try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
if(!S.missions||S.missions.day!==today())S.missions={day:today(),listen:0,vocab:0,grammar:0,write:0,speak:0,claimed:[]};
['mocks'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});['act','chest','best','known','drafts'].forEach(k=>{if(!S[k]||typeof S[k]!=='object')S[k]={}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function touchStreak(){const t=today();if(S.lastDay===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak=S.lastDay===ys?S.streak+1:1;S.lastDay=t;if(S.streak>=3)badge('streak3')}
function reward(xp,coins){S.xp+=xp;S.coins+=coins;touchStreak();save();renderChips()}
function badge(id){if(S.badges.includes(id))return;S.badges.push(id);const b=BADGES.find(x=>x[0]===id);save();setTimeout(()=>toast('Huy hiệu mới: '+b[1]+'!'),800)}
const level=()=>Math.floor(S.xp/200)+1;
const rank=()=>RANKS[Math.min(RANKS.length-1,Math.floor((level()-1)/2))];
function setBest(exam,skill,score,total){const k=exam+'.'+skill;const pct=Math.round(score/total*100);
  if(!S.best[k]||pct>=S.best[k].pct)S.best[k]={pct,score,total,at:Date.now()};badge('first');save()}
const starsOf=pct=>pct>=90?3:pct>=70?2:pct>=40?1:0;
function recordAct(id,pct){const st=starsOf(pct);const prev=S.act[id]||{stars:0,best:0};
  S.act[id]={stars:Math.max(prev.stars,st),best:Math.max(prev.best,pct),at:Date.now()};
  badge('first');if(st===3)badge('perfect');const gain=Math.max(0,st-prev.stars);
  reward(Math.round(pct/4)+gain*10,st+gain*3);return{st,gain}}
